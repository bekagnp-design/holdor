<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HOLDOR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#e3b661;--ok:#7fd06a;--bad:#e14b4b;--ink:#0b1220;--paper:#f2e6c9;--muted:#9fb6c9;--f-display:Cinzel,Georgia,serif;--f-body:"EB Garamond",Georgia,serif;--acc:#a9bdd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#060b14;color:#e9eef5;font-family:var(--f-body);overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
#screen{position:absolute;inset:0;display:none;background:rgba(6,11,20,.92);overflow:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#screen.on{display:block}
button{font-family:var(--f-display);font-weight:800;border:2px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);color:#e9eef5;min-height:44px;padding:0 14px;cursor:pointer}
button.pri{background:linear-gradient(180deg,#8be26a,#3f9a3a);border-color:#d8ffbf;color:#0b2a0a;font-size:18px;min-height:56px;width:100%;letter-spacing:.06em;box-shadow:0 8px 20px rgba(0,0,0,.45)}
button:disabled{filter:grayscale(1) brightness(.75)}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(6,11,20,.9);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;font:700 14px var(--f-display);color:#f3e7c4;pointer-events:none;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#err{position:absolute;left:8px;right:8px;bottom:8px;background:#5a1414;color:#fff;font:12px/1.3 monospace;padding:6px;border-radius:8px;display:none;z-index:99;white-space:pre-wrap}
/* ==== css/44_dungeons.css ==== */
/* 44_dungeons.css (A22): the dungeon banner, the leave prompt, the entry sheet */
#dgbar{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);display:none;max-width:calc(100% - 32px);white-space:nowrap;background:rgba(6,11,20,.82);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font:700 13px/1.2 var(--f-display);color:#e9eef5;pointer-events:none;z-index:5}
#dgbar.on{display:block}
#dgbar b{color:var(--gold)}
#dgbar .t{font-variant-numeric:tabular-nums;color:var(--muted)}
#dgbar .t.low{color:var(--bad)}
#dgleave{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 150px);display:none;background:rgba(6,11,20,.9);border:1px solid rgba(227,182,97,.5);border-radius:16px;padding:12px 14px;text-align:center;z-index:6;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#dgleave.on{display:block}
#dgleave .h{font:800 18px var(--f-display);color:var(--gold);letter-spacing:.04em}
#dgleave .s{font-size:14px;color:var(--muted);margin:4px 0 10px}
#dgleave .s .t{color:#e9eef5;font-weight:700}
.dgsheet{max-width:420px;margin:8vh auto 0;text-align:center}
.dgsheet .k{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dgsheet h2{font:800 28px var(--f-display);color:var(--gold);margin:6px 0 4px}
.dgsheet .line{color:#cdd6e0;font-size:16px;font-style:italic;margin:0 0 16px}
.dgsheet .row{display:flex;gap:8px;margin-bottom:12px}
.dgsheet .cell{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 6px}
.dgsheet .v{font:800 22px var(--f-display);color:#e9eef5}
.dgsheet .v.bad{color:var(--bad)}
.dgsheet .l{font-size:12px;color:var(--muted);margin-top:2px}
.dgsheet .gem{background:rgba(155,231,255,.1);border:1px solid rgba(155,231,255,.35);border-radius:12px;padding:10px;font-size:15px;color:#9be7ff;margin-bottom:8px}
.dgsheet .gem b{color:#fff}
.dgsheet .gem.done{opacity:.55;border-color:rgba(255,255,255,.15);color:var(--muted)}
.dgsheet .runs{font-size:14px;color:var(--muted);margin-bottom:14px}
.dgsheet .runs b{color:#e9eef5}
.dgsheet button.ghost{width:100%;margin-top:10px;background:transparent;border-color:rgba(255,255,255,.14);color:var(--muted);font-weight:700}

/* ==== css/54_menu.css ==== */
/* ==== menu (A29): the pause sheet + the menu button ==== */
#menuBtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;width:46px;height:46px;min-height:46px;padding:0;border-radius:14px;background:rgba(6,11,20,.72);border:2px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;z-index:5;backdrop-filter:blur(4px)}
#menuBtn.off{display:none}
#menuBtn svg{width:22px;height:22px;stroke:#f3e7c4;stroke-width:2.4;stroke-linecap:round;fill:none}
#menuBtn:active{transform:scale(.94)}
.mn{max-width:440px;margin:0 auto;padding-bottom:8px;animation:mnin .22s ease-out}
@keyframes mnin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mn-head{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.mn-eye{font:800 12px var(--f-display);letter-spacing:.22em;color:var(--acc);text-transform:uppercase}
.mn-who{font:700 15px var(--f-display);color:#f3e7c4;margin-top:4px}
.mn-who small{font:600 12px var(--f-body);color:var(--muted);margin-left:6px;letter-spacing:.02em}
.mn-x{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center}
.mn .pri{margin:2px 0 14px;font-size:20px;min-height:60px}
.mn-list{display:flex;flex-direction:column;gap:6px}
.mn-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 14px 0 10px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);color:#e9eef5;font:800 17px var(--f-display);text-align:left;letter-spacing:.02em}
.mn-row:active{background:rgba(255,255,255,.14)}
.mn-row.dim{opacity:.45}
.mn-row .ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.mn-row .ic svg{width:22px;height:22px;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.mn-row .lb{flex:1}
.mn-row .sub{display:block;font:600 12px var(--f-body);color:var(--muted);letter-spacing:.02em;margin-top:2px}
.mn-row .ch{color:var(--muted);font-size:20px;line-height:1}
.mn-row.danger{border-color:rgba(225,75,75,.55);color:#ffb3b3}
.mn-row.danger .ic svg{stroke:#e14b4b}
.mn-row.danger.armed{background:linear-gradient(180deg,#8a1f1f,#5a1414);border-color:#ff8e8e;color:#fff;animation:mnpulse .6s ease-in-out infinite alternate}
@keyframes mnpulse{from{box-shadow:0 0 0 0 rgba(225,75,75,.0)}to{box-shadow:0 0 0 6px rgba(225,75,75,.35)}}
.mn-back{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:0;background:none;color:var(--acc);font:800 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px -6px}
.mn-back:before{content:"‹";font-size:26px;line-height:1;margin-top:-3px}
.mn-h{font:800 22px var(--f-display);color:#f3e7c4;margin:0 0 12px}
.mn-sw{justify-content:space-between}
.mn-sw .tg{position:relative;width:54px;height:30px;flex:0 0 54px;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);transition:background .18s}
.mn-sw .tg:after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#cfd8e3;transition:transform .18s}
.mn-sw.on .tg{background:#3f9a3a;border-color:#8be26a}
.mn-sw.on .tg:after{transform:translateX(24px);background:#fff}
.mn-sw.on .st{color:var(--ok)}
.mn-sw .st{font:800 12px var(--f-display);letter-spacing:.1em;color:var(--muted);width:30px;text-align:right}
.mn-kv{display:flex;justify-content:space-between;align-items:center;min-height:46px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08);font:600 15px var(--f-body);color:var(--muted)}
.mn-kv b{font:800 16px var(--f-display);color:#f3e7c4;letter-spacing:.02em}
.mn-card{border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);margin-bottom:14px;overflow:hidden}
.mn-note{font:600 13px/1.4 var(--f-body);color:var(--muted);margin:10px 2px 14px}
.mn-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 4px;font:600 12px var(--f-body);color:var(--muted);letter-spacing:.06em}
.mn-foot b{font:800 12px var(--f-display);color:var(--acc)}
.mn-code{font:800 14px var(--f-display);color:var(--gold);letter-spacing:.1em;word-break:break-all}

/* ==== css/55_levelup.css ==== */
/* HOLDOR RPG — the level-up card (A30). Dark fantasy, gold burst, the house colour as the accent (--acc). */
.lvup{position:relative;max-width:420px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 2px 8px;text-align:center;--acc:#e3b661;--acc2:#1c2634;animation:lvrise .45s cubic-bezier(.2,.9,.3,1.2) both}
.lvup .hd{position:relative;width:100%;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.lvup .hd .k{position:relative;font:700 13px/1 var(--f-display);letter-spacing:.34em;color:var(--gold);text-shadow:0 0 10px rgba(227,182,97,.6)}
.lvup .hd .n{position:relative;font:900 78px/1 var(--f-display);color:#fff6d9;text-shadow:0 0 22px rgba(227,182,97,.85),0 3px 0 #7a5214,0 6px 16px rgba(0,0,0,.6);animation:lvpop .7s cubic-bezier(.2,1.7,.4,1) both}
.lvup .ring{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;background:radial-gradient(circle,rgba(227,182,97,.5),rgba(227,182,97,.12) 45%,rgba(227,182,97,0) 70%);animation:lvglow 2.4s ease-in-out infinite}
.lvup .burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.lvup .burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c,#ffd98a);box-shadow:0 0 8px var(--c,#ffd98a);opacity:0;animation:lvburst var(--t,1s) ease-out var(--dl,0s) infinite}
@keyframes lvburst{0%{opacity:0;transform:rotate(var(--a)) translateX(10px) scale(.5)}12%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(1.15)}}
@keyframes lvpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes lvglow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
@keyframes lvrise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lvup .sig{position:relative;width:76px;height:76px;border-radius:50%;border:3px solid var(--acc);background:radial-gradient(circle at 50% 38%,var(--acc2),#0b1220 80%);display:grid;place-items:center;font-size:40px;line-height:1;box-shadow:0 0 0 6px rgba(255,255,255,.05),0 0 24px rgba(227,182,97,.25),0 10px 24px rgba(0,0,0,.5)}
.lvup .sig img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.lvup .who{font:700 12px/1 var(--f-display);letter-spacing:.14em;color:var(--acc);opacity:.95;margin-top:-4px}
.lvup .say{margin:0;max-width:330px;font:italic 17px/1.35 var(--f-body);color:var(--paper);opacity:.92}
.lvup .st{width:100%;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.lvup .st table{width:100%;border-collapse:collapse}
.lvup .st td{padding:8px 10px;font:18px/1 var(--f-body);border-top:1px solid rgba(255,255,255,.06);text-align:center}
.lvup .st tr:first-child td{border-top:0}
.lvup .st td.k{font:700 13px/1 var(--f-display);letter-spacing:.14em;color:var(--muted);text-align:left;width:26%}
.lvup .st td.b{color:#9fb6c9;width:20%}
.lvup .st td.ar{color:var(--gold);width:8%;font-size:16px}
.lvup .st td.a{font-weight:700;color:#fff;width:20%}
.lvup .st td.d{font:700 15px/1 var(--f-display);color:#6d7c8c;text-align:right;width:20%}
.lvup .st td.d.up{color:var(--ok);text-shadow:0 0 8px rgba(127,208,106,.45)}
.lvup .st td.d.dn{color:var(--bad)}
.lvup .sk{width:100%;display:grid;grid-template-columns:56px 1fr;gap:8px 12px;align-items:center;padding:10px;border-radius:16px;text-align:left;background:linear-gradient(135deg,rgba(227,182,97,.2),rgba(255,255,255,.04));border:1px solid rgba(227,182,97,.6);box-shadow:0 0 22px rgba(227,182,97,.15) inset;animation:lvrise .5s .15s cubic-bezier(.2,.9,.3,1.2) both}
.lvup .sk .ic{width:56px;height:56px;border-radius:14px;background:#0b1220;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:30px;line-height:1;box-shadow:0 0 14px rgba(227,182,97,.35)}
.lvup .sk .ic img{width:44px;height:44px;object-fit:contain}
.lvup .sk .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.lvup .sk .tx .tag{font:700 10px/1 var(--f-display);letter-spacing:.24em;color:var(--gold)}
.lvup .sk .tx b{font:800 19px/1.15 var(--f-display);color:#fff6d9}
.lvup .sk .tx small{font:15px/1.3 var(--f-body);color:#d7dde6;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lvup .sk .slot{grid-column:1/-1;min-height:46px;width:100%;border-color:var(--gold);background:linear-gradient(180deg,rgba(227,182,97,.35),rgba(227,182,97,.12));color:#fff3cf;font-size:15px;letter-spacing:.08em}
.lvup .sk .slot.in{border-color:rgba(127,208,106,.6);background:rgba(127,208,106,.12);color:var(--ok);filter:none}
.lvup .pts{width:100%}
.lvup .pts .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.lvup .pts .h .t{font:700 13px/1.2 var(--f-display);letter-spacing:.1em;color:var(--paper);text-align:left}
.lvup .pts .auto{min-height:44px;padding:0 16px;font-size:13px;letter-spacing:.14em;border-color:rgba(255,255,255,.22);color:#9fb6c9;flex:none}
.lvup .pts .auto.on{border-color:var(--gold);background:rgba(227,182,97,.2);color:#fff3cf;box-shadow:0 0 12px rgba(227,182,97,.3)}
.lvup .pts .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvup .pb{min-height:72px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px;background:rgba(255,255,255,.07)}
.lvup .pb:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,rgba(227,182,97,.28),rgba(227,182,97,.08));box-shadow:0 0 14px rgba(227,182,97,.2)}
.lvup .pb:not(:disabled):active{transform:scale(.95)}
.lvup .pb.main .k{color:var(--acc)}
.lvup .pb .k{font:700 12px/1 var(--f-display);letter-spacing:.16em;color:var(--muted)}
.lvup .pb .v{font:800 24px/1 var(--f-display);color:#fff}
.lvup .pb .p{font:900 18px/1 var(--f-display);color:var(--gold)}
.lvup .pb:disabled{filter:none;opacity:.78}
.lvup .pb:disabled .p{color:var(--ok);font-size:14px}
.lvup .go{margin-top:auto}
@media (max-height:700px){.lvup{gap:8px}.lvup .hd{height:120px}.lvup .hd .n{font-size:64px}.lvup .sig{width:64px;height:64px;font-size:30px}.lvup .sig img{width:46px;height:46px}.lvup .st td{padding:7px 8px;font-size:16px}.lvup .pb{min-height:66px}}
@media (prefers-reduced-motion:reduce){.lvup,.lvup *{animation:none!important}.lvup .burst{display:none}}

</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas><div id="ui"></div><div id="screen"></div><div id="err"></div></div>
<script>
'use strict';


/* ==== js/00_core.js ==== */
/* HOLDOR RPG core — the one global R. (stub by the integrator; agent A01 completes it, keeping every name here) */
window.R = window.R || {};
(function () {
  R.VERSION = '2.0.0';
  R.data = R.data || {}; R.sys = R.sys || {}; R.sysList = []; R.screens = R.screens || {}; R.ents = []; R.t = 0; R.dt = 1 / 60; R.running = false;
  R.cam = { x: 0, y: 0, z: 1 }; R.W = 7200; R.H = 12288; R.SCALE = 6;
  const L = {};
  R.bus = { on: (e, f) => ((L[e] = L[e] || []).push(f), f), off: (e, f) => { L[e] = (L[e] || []).filter(x => x !== f); },
    emit: (e, ...a) => { for (const f of (L[e] || []).slice()) { try { f(...a); } catch (x) { console.error(e, x); } } } };
  R.addSys = (name, s) => { s.name = name; R.sys[name] = s; R.sysList = Object.values(R.sys).sort((a, b) => (a.order || 0) - (b.order || 0)); return s; };
  let nid = 1;
  R.spawn = e => { e.id = nid++; e.x = e.x || 0; e.y = e.y || 0; e.r = e.r || 14; e.face = e.face || 1; e.team = e.team == null ? 1 : e.team; e.hpMax = e.hpMax || e.hp || 1; e.hp = e.hp == null ? e.hpMax : e.hp; e.cd = e.cd || {}; e.status = e.status || {}; e.anim = e.anim || 'idle'; e.animT = 0; R.ents.push(e); R.bus.emit('spawn', e); return e; };
  R.kill = e => { if (e.dead) return; e.dead = true; e.anim = 'die'; e.animT = 0; if (e.kind === 'mob' || e.kind === 'boss') R.bus.emit('kill', e, e.lastHitBy); };
  R.remove = e => { const i = R.ents.indexOf(e); if (i >= 0) R.ents.splice(i, 1); };
  R.find = fn => R.ents.find(fn); R.near = (x, y, r, f) => R.ents.filter(e => !e.dead && (!f || f(e)) && (e.x - x) ** 2 + (e.y - y) ** 2 <= r * r);
  R.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  R.w2s = (x, y) => ({ x: (x - R.cam.x) * R.cam.z + R.vw / 2, y: (y - R.cam.y) * R.cam.z + R.vh / 2 });
  R.s2w = (x, y) => ({ x: (x - R.vw / 2) / R.cam.z + R.cam.x, y: (y - R.vh / 2) / R.cam.z + R.cam.y });
  let seed = 1234567; R.rng = s => { if (s != null) seed = s >>> 0 || 1; seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  R.clamp = (v, a, b) => v < a ? a : v > b ? b : v; R.lerp = (a, b, k) => a + (b - a) * k;
  /* ---- save ---- */
  R.state = null;
  R.newState = () => ({ v: 1, p: { name: '', house: 'stark', cls: 'knight', lvl: 1, xp: 0, hp: 0, gold: 0, gems: 0, pos: null, stats: { str: 5, agi: 5, int: 5, vit: 5 }, pts: 0, skills: {}, bar: [null, null, null], gear: {}, inv: [], potions: { hp: 3, mana: 0 }, comps: [], champs: {}, quests: {}, flags: {}, found: [], killed: {}, bosses: {}, ach: [], title: '', created: Date.now(), played: 0 }, wallet: { imported: false }, opts: { sfx: 1, haptic: 1, lang: 'en' } });
  let saveT = 0;
  R.save = now => { if (!R.state) return; if (!now) { if (saveT) return; saveT = setTimeout(() => { saveT = 0; R.save(true); }, 800); return; }
    try { if (R.player) R.state.p.pos = { x: Math.round(R.player.x), y: Math.round(R.player.y) }; localStorage.setItem('holdor_rpg', JSON.stringify(R.state)); } catch (e) {}
    R.bus.emit('save'); if (R.net && R.net.on && R.net.save) R.net.save(); };
  R.load = () => { try { const s = JSON.parse(localStorage.getItem('holdor_rpg') || 'null'); if (s && s.p) { R.state = s; return true; } } catch (e) {} return false; };
  /* ---- ui shell ---- */
  const scr = () => document.getElementById('screen');
  R.ui = { cur: null,
    open: (name, arg) => { const S = R.screens[name]; if (!S) { console.warn('no screen', name); return; } if (R.ui.cur && R.ui.cur !== name) R.ui.close(); R.ui.cur = name; const el = scr(); el.innerHTML = ''; el.classList.add('on'); el.dataset.screen = name; S.open(arg, el); R.paused = !S.live; R.bus.emit('screen', name); },

/* HOLDOR RPG — world runtime (A06). Helpers over R.data.world (written by 11_world_data.js, which loads AFTER this file,

/* ==== js/32_loot.js ==== */
/* HOLDOR RPG — loot (A17): drops on the ground, pickup radius, chests, gold/gem bursts.
   API (R.loot):
     drop(mob)                → [drops]  rolls R.data.mobs[mob.type].drops / .gold (fallbacks when absent) and scatters them.
                                A11 calls it on a mob's death; the 'kill' event also calls it, `mob.looted` keeps it to one roll.
     spawn(sub, x, y, o)      → drop entity {kind:'drop', sub:'gold'|'gem'|'item'|'potion'|'mat', amount|item, icon, col, glow?}
     goldBurst(x, y, n, k?)   → 3–6 coins that sum to n.
     chest(x, y, lvl, rar)    → {kind:'chest'} entity; INTERACT opens it: 3 items + gold (+ gems from Rare up).
     take(e) / open(e)        pickup / open by hand (the 'interact' bus event does the same).
     drawDrop(ctx, e)         optional helper for the renderer (beam, shadow, hop, blink). The renderer owns drawing.
   Mob data read: drops = {item:p, potion:p, mat:p, gem:p} or [{sub, p, rar?, n:[a,b]?, id?, name?, icon?}]; gold = [a,b] × lvl (or a number × lvl,
   or {flat:[a,b]}). Balance read (soft): R.data.balance.drops {item, potion, mat, eliteItem, bossGems:[a,b], gold:[a,b]}, R.data.balance.invMax.
   Pickup: gold / gems / potions fly to the player inside 120 u and are taken inside 46 u; gear and materials need INTERACT inside 70 u
   (R.input.interact = {label:'Take <name>', e, src:'loot', act}) or 1.5 s standing on them. Drops live 60 s. */

  const RAR_NAME = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
  const C = { LIFE: 60, PICK_R: 46, MAGNET_R: 120, TAKE_R: 70, STAND_T: 1.5, SCATTER: [20, 50], CHEST_LIFE: 15, INV_MAX: 60, POTION_MAX: 20 };
  const rnd = () => (R.rng ? R.rng() : Math.random());
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const rr = (a, b) => a + rnd() * (b - a);
  const bal = () => (R.data.balance && R.data.balance.drops) || {};
  const P = () => (R.state && R.state.p) || null;
  const col = r => RAR_COL[R.clamp(r | 0, 0, 4)];
  let seq = 0;
  const uid = () => 'i' + Date.now().toString(36) + (seq++).toString(36);

  /* ---------- fallbacks when R.items is absent ---------- */
  const FB = {
    weapon: ['Castle-forged sword', 'Longaxe', 'Hunting bow', 'Bronze dirk', 'Warhammer'],
    armor: ['Boiled leather', 'Mail hauberk', 'Plate cuirass', 'Ranger cloak'],
    trinket: ['Weirwood charm', 'Raven feather', 'Dragonglass amulet', 'Signet ring'],
    icon: { weapon: '🗡️', armor: '🛡️', trinket: '📿', potion: '🧪', mat: '🪨' },
    mats: [{ id: 'iron', name: 'Iron scrap', icon: '⛓️' }, { id: 'leather', name: 'Boiled leather strip', icon: '🪢' }, { id: 'wood', name: 'Ironwood', icon: '🪵' },
      { id: 'glass', name: 'Dragonglass shard', icon: '🔹' }, { id: 'bone', name: 'Wight bone', icon: '🦴' }],
    rarW: [0.62, 0.25, 0.09, 0.035, 0.005] };
  const rollRar = floor => { let s = 0; for (let i = floor; i < 5; i++) s += FB.rarW[i]; let x = rnd() * s; for (let i = floor; i < 5; i++) { x -= FB.rarW[i]; if (x <= 0) return i; } return floor; };
  const fbRoll = (lvl, floor) => { const rar = rollRar(R.clamp(floor | 0, 0, 4)); const kinds = ['weapon', 'armor', 'trinket']; const kind = kinds[ri(0, 2)];
    const m = 1 + rar * 0.25; const st = kind === 'weapon' ? { atk: Math.round((4 + 2 * lvl) * m) } : kind === 'armor' ? { def: Math.round((2 + 1.2 * lvl) * m), hp: Math.round((10 + 6 * lvl) * m) } : { crit: Math.round((2 + rar * 2) * 10) / 10, spd: Math.round(2 + rar * 2) };
    return { id: uid(), kind, name: FB[kind][ri(0, FB[kind].length - 1)], rar, lvl: lvl | 0, stats: st, icon: FB.icon[kind] }; };
  const rollItem = (lvl, floor) => { const I = R.items; let it = null;
    try { if (I && typeof I.roll === 'function') it = I.roll(lvl, floor); } catch (e) { console.error('items.roll', e); }

  const barOf = () => { const p = P(); if (!Array.isArray(p.bar)) p.bar = [null, null, null]; while (p.bar.length < 3) p.bar.push(null); return p.bar; };
  const slotOf = id => barOf().indexOf(id);
  const assign = id => { const p = P(); if (!p) return -1; const bar = barOf(); let i = bar.indexOf(id); if (i >= 0) return i;
    i = bar.indexOf(null); if (i < 0) i = bar.indexOf(undefined); if (i < 0) i = bar.length - 1;
    p.skills = p.skills || {}; if (!p.skills[id]) p.skills[id] = 1;
    const S = R.skills; let done = false;
    for (const f of ['assign', 'equip', 'setSlot', 'setBar']) if (S && typeof S[f] === 'function') { try { S[f](id, i); done = true; } catch (e) {} break; }
    if (!done || barOf().indexOf(id) < 0) bar[i] = id;
    R.bus.emit('bar', barOf()); R.save(); return i; };

  /* ---- points ---- */
  const autoPlan = n => { const p = P(), main = MAIN[p.cls] || 'str', plan = { str: 0, agi: 0, int: 0, vit: 0 }; for (let i = 0; i < n; i++) plan[i % 3 === 2 ? 'vit' : main]++; return plan; };
  const recalc = () => { const f = recalcFn(); if (f) { try { f(); } catch (e) {} } R.bus.emit('stats', P() && P().stats); };
  const spend = k => { const p = P(); if (!p || STATS.indexOf(k) < 0 || !(p.pts > 0)) return false; p.stats = p.stats || {}; p.stats[k] = (p.stats[k] || 0) + 1; p.pts--; recalc(); R.save(); return true; };
  const manual = () => !!(R.state && R.state.opts && R.state.opts.manualPts);
  const applyAuto = () => { const p = P(); if (!p || !(p.pts > 0)) return; const plan = autoPlan(p.pts); pend.autoLog = pend.autoLog || { str: 0, agi: 0, int: 0, vit: 0 };
    for (const k of STATS) { p.stats[k] = (p.stats[k] || 0) + plan[k]; pend.autoLog[k] += plan[k]; } p.pts = 0; recalc(); R.save(); };
  const undoAuto = () => { const p = P(), log = pend && pend.autoLog; if (!p || !log) return; let n = 0; for (const k of STATS) { p.stats[k] -= log[k]; n += log[k]; log[k] = 0; } p.pts += n; recalc(); R.save(); };
  const setAuto = on => { if (!R.state) return; R.state.opts = R.state.opts || {}; R.state.opts.manualPts = on ? 0 : 1; if (on) applyAuto(); else undoAuto(); R.save(); render(); };

  /* ---- the flash in the world ---- */
  const haptic = kind => { try { const o = R.state && R.state.opts; if (o && o.haptic === 0) return; const H = window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback; if (!H) return; kind === 'tap' ? H.impactOccurred('light') : H.notificationOccurred('success'); } catch (e) {} };
  const flash = lvl => { const pl = R.player; if (pl && R.fx) { if (typeof R.fx.spawn === 'function') R.fx.spawn('levelup', pl.x, pl.y, { lvl }); if (typeof R.fx.num === 'function') R.fx.num(pl.x, pl.y - 44, 'LEVEL ' + lvl, GOLD, true); }
    if (R.sfx && typeof R.sfx.play === 'function') R.sfx.play('levelup', 1); haptic('ok'); };
  const storyLine = lvl => { const p = P(), s = R.data.story && R.data.story.levelup; if (!s) return ''; try {
    if (typeof s === 'function') return s(lvl, p) || ''; if (Array.isArray(s)) return s.length ? s[(lvl - 1) % s.length] : '';
    if (typeof s === 'object') return s[lvl] || s[String(lvl)] || s.any || s.default || ''; return String(s); } catch (e) { return ''; } };

  /* ---- queue: one card for every level-up that arrives while it is pending or open ---- */
  let pend = null, timer = 0, waitClose = false, root = null;
  const tryOpen = () => { timer = 0; if (!pend || !P()) return; if (R.ui.cur === 'levelup') { render(); return; } if (R.ui.cur) { waitClose = true; return; } R.ui.open('levelup', pend.to); };
  R.bus.on('levelup', lvl => { const p = P(); if (!p) return; lvl = +lvl || p.lvl;
    if (!pend) pend = { from: snap && snap.lvl < lvl ? snap.lvl : lvl - 1, to: lvl, before: snap && snap.lvl < lvl ? snap.nums : null, stats0: snap && snap.lvl < lvl ? snap.stats : Object.assign({}, p.stats), autoLog: null, opened: false };
    pend.to = Math.max(pend.to, lvl); flash(lvl);
    if (R.ui.cur === 'levelup') { if (!manual()) applyAuto(); render(); return; }
    if (!timer) timer = setTimeout(tryOpen, 650); });
  R.bus.on('tick1s', takeSnap);
  R.bus.on('screen', name => { if (name === null && waitClose && pend) { waitClose = false; setTimeout(tryOpen, 150); } });

  /* ---- render ---- */
  const burst = () => { let s = ''; for (let i = 0; i < 30; i++) { const a = Math.round(i * 12 + Math.random() * 12), d = Math.round(60 + Math.random() * 90), t = (0.9 + Math.random() * 0.8).toFixed(2), dl = (Math.random() * 1.6).toFixed(2), c = ['#ffd98a', '#e3b661', '#fff3cf', '#f2a62c'][i % 4], sz = 4 + (i % 3) * 2;
    s += '<i style="--a:' + a + 'deg;--d:' + d + 'px;--t:' + t + 's;--dl:' + dl + 's;--c:' + c + ';width:' + sz + 'px;height:' + sz + 'px"></i>'; } return s; };
  const render = () => { if (!root || !pend || !P()) return; const p = P(), H = house(), B = before(), A = after(), pts = p.pts | 0, auto = !manual(), log = pend.autoLog || {};
    const sks = skillsAt(pend.from, pend.to, p.cls), line = storyLine(pend.to), gained = (pend.to - pend.from) * ptsPer();
    const rows = ROWS.map(([k, n]) => { const d = (A[k] | 0) - (B[k] | 0); return '<tr><td class="k">' + n + '</td><td class="b">' + B[k] + '</td><td class="ar">→</td><td class="a">' + A[k] + '</td><td class="d' + (d > 0 ? ' up' : d < 0 ? ' dn' : '') + '">' + (d > 0 ? '+' + d : d < 0 ? d : '—') + '</td></tr>'; }).join('');
    const skHtml = sks.map(s => { const i = slotOf(s.id); return '<div class="sk" data-sk="' + esc(s.id) + '"><span class="ic">' + skIcon(s) + '</span><span class="tx"><small class="tag">NEW SKILL</small><b>' + esc(skName(s)) + '</b><small>' + esc(skLine(s)) + '</small></span>' +
      '<button class="slot' + (i >= 0 ? ' in' : '') + '" data-slot="' + esc(s.id) + '"' + (i >= 0 ? ' disabled' : '') + '>' + (i >= 0 ? 'IN SLOT ' + (i + 1) + ' ✓' : 'PUT IN SLOT') + '</button></div>'; }).join('');
    const pb = STATS.map(k => { const add = auto ? (log[k] || 0) : 0, main = k === (MAIN[p.cls] || 'str'); return '<button class="pb' + (main ? ' main' : '') + '" data-k="' + k + '"' + (auto || pts <= 0 ? ' disabled' : '') + '><span class="k">' + SNAME[k] + '</span><span class="v">' + (p.stats[k] | 0) + '</span><span class="p">' + (auto ? (add ? '+' + add : '·') : '+') + '</span></button>'; }).join('');
    const ptsTxt = auto ? (gained ? gained + ' POINT' + (gained > 1 ? 'S' : '') + ' · BY CLASS' : 'POINTS BY CLASS') : pts + ' POINT' + (pts !== 1 ? 'S' : '') + ' TO SPEND';
    root.innerHTML = '<div class="lvup" style="--acc:' + H.col + ';--acc2:' + H.col2 + '">' +
      '<div class="hd"><span class="ring"></span><span class="burst">' + burst() + '</span><span class="k">LEVEL UP</span><span class="n">' + pend.to + '</span></div>' +
      '<div class="sig" title="' + esc(H.n) + '">' + (H.sigil ? '<img src="' + esc(H.sigil) + '" alt="">' : '<span>' + esc(H.e) + '</span>') + '</div>' +
      '<div class="who">' + esc(p.name || 'You') + ' · ' + esc(H.n) + ' · ' + esc((p.cls || 'knight').toUpperCase()) + '</div>' +
      (line ? '<p class="say">' + esc(line) + '</p>' : '') +
      '<div class="st"><table>' + rows + '</table></div>' + skHtml +
      '<div class="pts"><div class="h"><span class="t">' + ptsTxt + '</span><button class="auto' + (auto ? ' on' : '') + '">AUTO</button></div><div class="g">' + pb + '</div></div>' +
      '<button class="pri go">CONTINUE</button></div>'; };
  const onTap = ev => { const b = ev.target.closest('button'); if (!b || !root || !root.contains(b)) return;
    if (b.classList.contains('go')) { haptic('tap'); R.ui.close(); return; }
    if (b.classList.contains('auto')) { haptic('tap'); setAuto(!b.classList.contains('on')); return; }
    if (b.dataset.k) { if (spend(b.dataset.k)) { haptic('tap'); if (R.sfx && R.sfx.play) R.sfx.play('ui', 0.6); render(); } return; }
    if (b.dataset.slot) { assign(b.dataset.slot); haptic('tap'); if (R.sfx && R.sfx.play) R.sfx.play('ui', 0.8); render(); } };

  R.screens.levelup = { live: false,
    open: (arg, el) => { const p = P(); if (!p) return; const lvl = +arg || p.lvl; if (!pend) pend = { from: lvl - 1, to: lvl, before: snap && snap.lvl < lvl ? snap.nums : null, stats0: Object.assign({}, p.stats), autoLog: null, opened: false };
      pend.to = Math.max(pend.to, lvl); root = el || document.getElementById('screen'); if (!pend.opened) { pend.opened = true; if (!manual()) applyAuto(); }
      root.addEventListener('click', onTap); render(); if (timer) { clearTimeout(timer); timer = 0; } },
    close: () => { if (root) root.removeEventListener('click', onTap); const done = pend && pend.to; root = null; pend = null; waitClose = false; snap = snapNow(); R.save(); if (done) R.bus.emit('levelup:done', done); } };
  R.levelup = { skillsAt, calc, spend, assign, auto: setAuto, pending: () => pend, before, after };
})();

</script>
