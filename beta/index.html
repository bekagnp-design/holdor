<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Heavy Gold</title>
<style>
:root{--bg:#070c16;--ink:#f3e7c4;--muted:#8d9bb0;--gold:#e8b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:rgba(7,12,22,.9);z-index:10;overflow:auto}
.scr.on{display:flex}
.scr{justify-content:flex-start}.scr>:first-child{margin-top:auto}.scr>:last-child{margin-bottom:auto}
@media (max-height:430px){.scr{gap:8px}.big{font-size:34px}.lines{font-size:13px;line-height:1.35}.sec{min-height:44px}h1{font-size:30px}.god{min-height:72px}}
h1{margin:0;font:900 40px/1 Georgia,serif;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 24px rgba(232,184,74,.35);text-align:center}
.rule{margin:0;font:italic 16px/1.35 Georgia,serif;color:#cfd6e2;text-align:center;max-width:440px}
.gods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(100%,600px)}
.god{min-height:84px;position:relative;border-radius:14px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--ink);padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;cursor:pointer}
.god b{font-size:16px}
.god i{font:900 20px Georgia,serif;font-style:normal;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#081018}
.god small{font-size:11px;color:var(--muted);letter-spacing:.08em;line-height:1.2;text-align:center}
.god.sel small{color:var(--gold)}
.gdesc{font:14px/1.3 Georgia,serif;color:#cfd6e2;text-align:center;min-height:18px}
.god.sel{border-color:var(--gold);background:rgba(232,184,74,.16)}
@media (max-width:440px){.gods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pri{min-height:56px;width:min(100%,360px);border:0;border-radius:14px;background:linear-gradient(180deg,#f0c75e,#b8862b);color:#1c1207;font:900 19px Georgia,serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.sec{min-height:46px;width:min(100%,360px);border:2px solid rgba(255,255,255,.22);border-radius:14px;background:transparent;color:var(--ink);font:700 16px Georgia,serif;cursor:pointer}
.small{font-size:13px;color:var(--muted);text-align:center}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
.tl{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));font:700 17px/1.35 Georgia,serif;text-shadow:0 1px 3px #000}
.tl .c{color:var(--gold)}
.tc{position:absolute;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;font:13px/1.4 Georgia,serif;color:#cfd6e2;text-shadow:0 1px 3px #000;white-space:nowrap}
.tc b{display:block;font-size:22px;color:var(--ink)}
.tr{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));font:13px/1.4 Georgia,serif;text-align:right;text-shadow:0 1px 3px #000;min-width:120px}
.tr .me{color:var(--gold);font-weight:700}
#sk{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:3px solid var(--gold);background:rgba(10,16,28,.72);color:var(--ink);font:900 26px Georgia,serif;z-index:6;display:none;pointer-events:auto;touch-action:none;padding:0}
#sk.on{display:grid;place-items:center}#sk canvas{width:56px;height:56px;grid-area:1/1;pointer-events:none}#sk b{grid-area:1/1;text-shadow:0 1px 4px #000;pointer-events:none}#sk.cd canvas{opacity:.3}
.coin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e8b84a;border:1.5px solid #8a6420;color:#3a2808;font:900 11px Georgia,serif;font-style:normal;vertical-align:-4px;margin-right:3px;text-shadow:none}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:30;pointer-events:none;font:700 16px Georgia,serif;color:var(--ink);text-shadow:0 2px 6px #000;text-align:center;width:max-content;max-width:calc(100vw - 32px);background:rgba(7,12,22,.78);padding:6px 12px;border-radius:10px;opacity:0;transition:opacity .25s}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#5a1414;color:#fff;font:12px monospace;padding:6px;border-radius:8px;display:none;white-space:pre-wrap}
.big{font:900 46px/1 Georgia,serif;color:var(--gold)}
.lines{font:15px/1.5 Georgia,serif;color:#cfd6e2;text-align:center}
.extra{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,600px)}.extra:empty,.links:empty{display:none}
/* icon buttons (the owner, 2026-11-23: "too much text"): an icon, one short word under it; every target >= 52 px */
.ib{min-width:52px;min-height:52px;padding:4px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px Georgia,serif;letter-spacing:.04em;cursor:pointer;position:relative;flex:0 0 auto}
.ib i{font-style:normal;font-size:22px;line-height:1;display:block}.ib canvas{width:24px;height:24px;display:block}.ib span{color:#aab5c6;font-size:11px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.links:has(.ib){gap:6px}
.ib.on{border-color:var(--gold)}
.hrows{display:flex;flex-direction:column;gap:12px;width:min(100%,380px)}.hrow{display:flex;align-items:center;gap:12px;font:16px/1.3 Georgia,serif;color:#e4e9f1}.hrow>i{flex:0 0 40px;height:40px;display:grid;place-items:center;font-style:normal;font-size:24px}
.ring{width:34px;height:34px;border-radius:50%;background:#7b93ff;box-shadow:0 0 0 3px #070c16,0 0 0 6px #5be38a}.ring.red{box-shadow:0 0 0 3px #070c16,0 0 0 6px #ff5a5a}
.vlt{width:36px;height:36px;border-radius:50%;border:3px dashed #e8b84a;background:rgba(232,184,74,.2)}
.bk{font:900 40px/1 Georgia,serif;color:var(--gold)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tile{min-width:76px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center}.tile b{display:block;font:900 20px/1.1 Georgia,serif;color:var(--ink)}.tile span{font-size:11px;color:var(--muted)}
.win{font-size:14px;color:#cfd6e2}.nb{color:var(--gold);font-weight:700}
/* a short landscape window (a phone held sideways): the title and end screens in two columns, so PLAY stays on screen */
@media (max-height:430px) and (min-aspect-ratio:4/3){
  #title.on,#end.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-auto-rows:min-content;column-gap:20px;row-gap:8px;align-content:safe center;align-items:start;justify-items:center}
  #title>*,#end>*{margin:0!important;width:100%}
  #title>h1{grid-column:1;grid-row:1}#titleExtra{grid-column:1;grid-row:2/8}
  #gods{grid-column:2;grid-row:1/3}#gdesc{grid-column:2;grid-row:3}#play{grid-column:2;grid-row:4}#best{grid-column:2;grid-row:5}#titleLinks{grid-column:2;grid-row:6}
  #end>.small{grid-column:1;grid-row:1}#eRank{grid-column:1;grid-row:2}#eGold{grid-column:1;grid-row:3}#eLines{grid-column:1;grid-row:4/8}
  #endExtra{grid-column:2;grid-row:1/3}#again{grid-column:2;grid-row:3}#endLinks{grid-column:2;grid-row:4}
  .pri,.sec{width:100%}
  #gods{grid-template-columns:repeat(2,minmax(0,1fr))}#gods .god{min-height:78px;padding:6px 6px}
}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(100%,600px)}.links .sec{width:auto;flex:1 1 140px}
@media (max-height:430px) and (min-aspect-ratio:4/3){.links .ib{min-height:48px}#end>.links,#title>.links{width:100%}
  #gods .god{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;row-gap:0;min-height:58px;justify-items:start;align-content:center;padding:6px 10px}#gods .god canvas{grid-row:1/3;width:36px!important;height:36px!important}#gods .god b{font-size:15px}#gods .god .trn-lv{left:auto;right:8px}#gods .god .trn-cb{left:auto;right:8px}
  #gdesc{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="tl" id="hTL"></div><div class="tc" id="hTC"></div><div class="tr" id="hTR"></div><div id="hudExtra"></div></div>
<button id="sk">SKILL</button>
<div id="toast"></div>
<div class="scr on" id="title">
  <h1>HEAVY GOLD</h1>
  <div class="gods" id="gods"></div>
  <div class="gdesc" id="gdesc"></div>
  <div id="titleExtra" class="extra"></div>
  <button class="pri" id="play">PLAY</button>
  <div class="small" id="best"></div>
  <div id="titleLinks" class="links"><button class="ib" id="helpB"><i>?</i><span>Rules</span></button></div>
</div>
<div class="scr" id="end">
  <div class="small">ROUND OVER</div>
  <div class="big" id="eRank"></div>
  <div class="bk" id="eGold"></div>
  <div class="lines" id="eLines"></div>
  <div id="endExtra" class="extra"></div>
  <button class="pri" id="again">PLAY AGAIN</button>
  <div id="endLinks" class="links"><button class="ib" id="share"><i>📤</i><span>Invite</span></button><button class="ib" id="change"><canvas width="48" height="48"></canvas><span>God</span></button></div>
</div>
<div class="scr" id="help">
  <h1 style="font-size:26px">HOW TO PLAY</h1>
  <div class="hrows">
    <div class="hrow"><i><span class="coin" style="width:30px;height:30px;font-size:14px;margin:0">8</span></i>Grab gold. Every 50 s a coin is worth half.</div>
    <div class="hrow"><i><span class="vlt"></span></i>Stand in a vault to bank it. Only banked gold counts.</div>
    <div class="hrow"><i><span class="ring"></span></i>Green ring: lighter than them, you rob them.</div>
    <div class="hrow"><i><span class="ring red"></span></i>Red ring: they rob you. Run.</div>
  </div>
  <button class="pri" id="helpOk">GOT IT</button>
</div>
<div id="err"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
(() => {
  const errBox = document.getElementById('err');
  const showErr = m => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; };
  window.addEventListener('error', e => showErr('Error: ' + (e.message || e)));

  /* ---------- hooks for the modules (src/gold/js/*.js): G.on(event, fn), G.addMod(name, fn(p, value) → value) ----------
     events: start(S) · step(dt) · pickup(p, coin) · rob(thief, victim, take, loss) · bank(p, amount) · skill(p) · end(S, res) · draw(ctx, k, ox, oy) · hud(S) · title()
     mods:   speed · cd · dash · thorR · thorShare · lokiT · chainT · rob (the victim's share lost) · bankT · coinValue (p = null) · view (camera scale) */
  const BUS = {}, MODS = {};
  const emit = (e, ...a) => { for (const f of BUS[e] || []) { try { f(...a); } catch (x) { showErr(e + ': ' + (x && x.message || x)); } } };
  const mod = (n, p, v) => { for (const f of MODS[n] || []) { try { const r = f(p, v); if (typeof r === 'number' && isFinite(r)) v = r; } catch (x) { showErr('mod ' + n + ': ' + (x && x.message || x)); } } return v; };

  /* ---------- Telegram ---------- */
  const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
  try { if (TG) { TG.ready(); TG.expand(); if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); if (TG.setHeaderColor) TG.setHeaderColor('#070c16'); if (TG.setBackgroundColor) TG.setBackgroundColor('#070c16'); } } catch (e) {}
  const haptic = k => { try { if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

  /* ---------- canvas ---------- */
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let VW = 390, VH = 844, DPR = 1;
  const resize = () => { DPR = Math.min(2, window.devicePixelRatio || 1); VW = window.innerWidth || 390; VH = window.innerHeight || 844; cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); };
  window.addEventListener('resize', resize); resize();

  /* ---------- rules ---------- */
  /* the owner's numbers (2026-11-23): a map ~15 s across, 7 bots, one coin a second whose worth halves every 50 s (8 → 4 → 2),
     2 vaults that move every 20 s (the new spot shows 3 s before), robbery 35 % (half to the thief, half spilled) */
  const WORLD = 4000, ROUND = 150, COIN_T = 1, HALVE_T = 50, FIRST_VALUE = 8, START_COINS = 14, BOTS = 7, BANK_T = 1.5, ROB = 0.35, TAU = Math.PI * 2;
  const VAULT_N = 2, VAULT_R = 120, VAULT_MOVE = 20, VAULT_WARN = 3, NET_REACH = 12;
  const coinValue = t => Math.max(1, FIRST_VALUE >> Math.floor(t / HALVE_T));
  const GODS = {
    hermes:  { n: 'Hermes',  c: '#5ad1e8', g: 'H', sk: 'DASH',    d: 'Dash: a burst of speed', cd: 4 },
    thor:    { n: 'Thor',    c: '#7b93ff', g: 'T', sk: 'THUNDER', d: 'Thunder: richer rivals near you spill gold', cd: 9 },
    loki:    { n: 'Loki',    c: '#7fd36a', g: 'L', sk: 'TRICK',   d: 'Trick: vanish and leave a decoy', cd: 10 },
    amirani: { n: 'Amirani', c: '#ee6a4c', g: 'A', sk: 'CHAINS',  d: 'Chains: nobody can rob you for 3 s', cd: 10 },
  };
  /* each god's sign inside his circle: Hermes a wing, Thor a hammer, Loki a serpent, Amirani a chain */
  function sym(c, g, x, y, s) {
    c.save(); c.fillStyle = '#081018'; c.strokeStyle = '#081018'; c.lineCap = 'round';
    if (g === 'thor') { c.fillRect(x - s * 0.46, y - s * 0.5, s * 0.92, s * 0.36); c.fillRect(x - s * 0.1, y - s * 0.16, s * 0.2, s * 0.68); }
    else if (g === 'hermes') { for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(x + s * (0.06 - i * 0.07), y - s * 0.26 + i * s * 0.26, s * (0.56 - i * 0.12), s * 0.12, -0.35, 0, TAU); c.fill(); } }
    else if (g === 'loki') { c.lineWidth = s * 0.2; c.beginPath(); c.moveTo(x - s * 0.36, y - s * 0.42); c.bezierCurveTo(x + s * 0.62, y - s * 0.42, x - s * 0.62, y + s * 0.42, x + s * 0.36, y + s * 0.42); c.stroke();
      c.beginPath(); c.arc(x - s * 0.36, y - s * 0.42, s * 0.16, 0, TAU); c.fill(); }
    else { c.lineWidth = s * 0.13; c.beginPath(); c.ellipse(x - s * 0.22, y, s * 0.3, s * 0.19, 0, 0, TAU); c.stroke(); c.beginPath(); c.ellipse(x + s * 0.22, y, s * 0.3, s * 0.19, 0, 0, TAU); c.stroke(); }
    c.restore();
  }
  const GK = Object.keys(GODS);
  const BOTN = ['Ares', 'Freya', 'Anubis', 'Odin', 'Athena', 'Dali', 'Tyr'];
  const mkRnd = seed => { let s = seed >>> 0; const f = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; f.seed = n => { s = n >>> 0; }; return f; };
  const rnd = mkRnd(Date.now() ^ 0x9e3779b9);   // the bots' choices, spills, decoys
  /* the daily map (the owner's choice, 2026-11-23): one map a UTC day for everyone — the same start spots, the same coins at the same
     seconds, the same vault spots — so every result of the day can be compared. Map #1 is 2026-11-23. */
  const MAP0 = Date.UTC(2026, 10, 23);
  let mapNo = Math.max(1, Math.floor((Date.now() - MAP0) / 86400000) + 1), mapForced = null;
  const mapRnd = mkRnd(0);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');   // a name in innerHTML (online names come from other players)
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const nm = p => p.name + (S && S.online && p.bot ? ' (bot)' : '');   // a hero's name in a toast (online: bots say so)
  const radius = p => Math.min(58, 17 + Math.sqrt(Math.max(0, p.carry)) * 1.1);
  const speed = p => mod('speed', p, (p.god === 'hermes' ? 1.08 : 1) * 270 / Math.sqrt(1 + p.carry / 110));

  let S = null, god = 'hermes', paused = false;
  try { const g = localStorage.getItem('hg_god'); if (GODS[g]) god = g; } catch (e) {}
  const best = () => { try { return +(localStorage.getItem('hg_best') || 0); } catch (e) { return 0; } };

  /* ---------- round ---------- */
  const mkP = (name, g, bot, id) => ({ id, name, god: g, bot, x: 0, y: 0, vx: 0, vy: 0, fx: 1, fy: 0, carry: 0, bank: 0, cd: 0, imm: 0, inv: 0, dash: 0, bankT: 0, robs: 0, lost: 0, best: 0,
    ai: { t: 0, dx: 0, dy: 0, th: 18 + Math.floor(rnd() * 40), mode: 'coin' } });
  const addCoin = (x, y, v) => { S.coins.push({ x: clamp(x, 12, WORLD - 12), y: clamp(y, 12, WORLD - 12), v }); };
  const spill = (x, y, amount, r) => { if (amount <= 0) return; const n = Math.min(40, amount); let left = amount;
    for (let i = 0; i < n; i++) { const v = i === n - 1 ? left : Math.max(1, Math.floor(amount / n)); left -= v; if (v <= 0) continue; const a = rnd() * TAU, d = r * (0.7 + rnd() * 0.8); addCoin(x + Math.cos(a) * d, y + Math.sin(a) * d, v); } };
  const fx = (o) => { S.fx.push(Object.assign({ t: S.t, life: 0.8 }, o)); };
  let toastT = 0; const toast = (m, ms) => { const el = $('toast'); el.textContent = m; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { el.style.opacity = 0; }, ms || 1600); };

  /* n spots far apart and away from the edges (and from the given points) */
  function spots(n, avoid) { const out = []; for (let i = 0; i < n; i++) { let best = null, bd = -1;
      for (let k = 0; k < 40; k++) { const q = { x: 450 + mapRnd() * (WORLD - 900), y: 450 + mapRnd() * (WORLD - 900) }; const d = Math.min(1e9, ...out.concat(avoid).map(o => dist(o, q)));
        if (d > bd) { bd = d; best = q; } } out.push(best); } return out; }
  const nearestVault = p => { let bv = S.vaults[0], bd = 1e9; for (const v of S.vaults) { const d = dist(v, p); if (d < bd) { bd = d; bv = v; } } return bv; };
  /* online hook (90_online.js, GOLD.md "Online hooks"): start(god, {seats:[{name, god, flag, u, me}], client, map}) seats the real
     players first (hero id = seat index), fills the rest with the same 7 bots as solo; a client (S.client) runs no coins, bots,
     vaults, robbery or banking: the host's state brings them. start(god) alone is the solo round, unchanged. */
  function start(g, o) {
    god = GODS[g] ? g : god; try { localStorage.setItem('hg_god', god); } catch (e) {}
    if (mapForced == null) mapNo = Math.max(1, Math.floor((Date.now() - MAP0) / 86400000) + 1);
    if (o && o.map > 0) mapNo = o.map | 0;   // an online round: the host's map
    mapRnd.seed(Math.imul(mapNo, 2654435761) ^ 0x5bd1e995);   // the same map all day
    const ps = []; let id = 0, me = null;
    if (o && o.seats) for (const s of o.seats.slice(0, BOTS + 1)) { const p = mkP(String(s.name || 'Hero'), GODS[s.god] ? s.god : 'hermes', false, id++); p.u = s.u; p.flag = s.flag || ''; p.net = !s.me; ps.push(p); if (s.me) me = p; }
    if (!me) { me = mkP('You', god, false, id++); ps.unshift(me); ps.forEach((p, i) => { p.id = i; }); }
    for (let i = 0; ps.length < BOTS + 1; i++) ps.push(mkP(BOTN[i], GK[(i + 1) % 4], true, id++));
    S = { t: 0, ps, me, coins: [], decoys: [], fx: [], veins: [], pairT: {}, vaults: [], vNext: VAULT_MOVE, nextCoin: COIN_T, minted: 0, over: false, camX: 0, camY: 0, hudT: 0 };
    if (o) { S.online = true; S.client = !!o.client; }
    S.vaults = spots(VAULT_N, []).map(q => ({ x: q.x, y: q.y, r: VAULT_R, nx: null, ny: null }));
    for (const p of ps) { for (let k = 0; k < 80; k++) { p.x = 250 + mapRnd() * (WORLD - 500); p.y = 250 + mapRnd() * (WORLD - 500);
      if (S.vaults.every(v => dist(v, p) > 500) && ps.every(q => q === p || !q.placed || dist(q, p) > 500)) break; } p.placed = true; }
    S.camX = me.x; S.camY = me.y;

  /* ---------- step ---------- */

  }

    'MP:Northern Mariana Islands|MQ:Martinique|MR:Mauritania|MS:Montserrat|MT:Malta|MU:Mauritius|MV:Maldives|MW:Malawi|MX:Mexico|MY:Malaysia|' +
    'MZ:Mozambique|NA:Namibia|NC:New Caledonia|NE:Niger|NF:Norfolk Island|NG:Nigeria|NI:Nicaragua|NL:Netherlands|NO:Norway|NP:Nepal|NR:Nauru|' +
    'NU:Niue|NZ:New Zealand|OM:Oman|PA:Panama|PE:Peru|PF:French Polynesia|PG:Papua New Guinea|PH:Philippines|PK:Pakistan|PL:Poland|' +
    'PM:Saint Pierre and Miquelon|PN:Pitcairn Islands|PR:Puerto Rico|PS:Palestine|PT:Portugal|PW:Palau|PY:Paraguay|QA:Qatar|RE:Réunion|' +
    'RO:Romania|RS:Serbia|RU:Russia|RW:Rwanda|SA:Saudi Arabia|SB:Solomon Islands|SC:Seychelles|SD:Sudan|SE:Sweden|SG:Singapore|SH:Saint Helena|' +
    'SI:Slovenia|SJ:Svalbard and Jan Mayen|SK:Slovakia|SL:Sierra Leone|SM:San Marino|SN:Senegal|SO:Somalia|SR:Suriname|SS:South Sudan|' +
    'ST:São Tomé and Príncipe|SV:El Salvador|SX:Sint Maarten|SY:Syria|SZ:Eswatini|TC:Turks and Caicos Islands|TD:Chad|' +
    'TF:French Southern Territories|TG:Togo|TH:Thailand|TJ:Tajikistan|TK:Tokelau|TL:Timor-Leste|TM:Turkmenistan|TN:Tunisia|TO:Tonga|' +
    'TR:Türkiye|TT:Trinidad and Tobago|TV:Tuvalu|TW:Taiwan|TZ:Tanzania|UA:Ukraine|UG:Uganda|UM:U.S. Outlying Islands|US:United States|' +
    'UY:Uruguay|UZ:Uzbekistan|VA:Vatican City|VC:Saint Vincent and the Grenadines|VE:Venezuela|VG:British Virgin Islands|' +
    'VI:U.S. Virgin Islands|VN:Vietnam|VU:Vanuatu|WF:Wallis and Futuna|WS:Samoa|YE:Yemen|YT:Mayotte|ZA:South Africa|ZM:Zambia|ZW:Zimbabwe';
  /* other names people search for */
  const ALIAS = { TR: 'turkey', CZ: 'czech republic', CI: 'ivory coast', SZ: 'swaziland', MM: 'burma', NL: 'holland', GB: 'uk great britain britain england scotland wales northern ireland',
    US: 'usa america united states of america', MK: 'macedonia', CV: 'cabo verde', TL: 'east timor', VA: 'holy see', CD: 'democratic republic kinshasa drc', CG: 'brazzaville',
    AE: 'uae emirates', RU: 'russian federation', KR: 'korea', KP: 'korea dprk', BQ: 'bonaire saba sint eustatius', FK: 'malvinas', PS: 'gaza west bank', BN: 'brunei darussalam' };
  const COUNTRIES = RAW.split('|').map(s => [s.slice(0, 2), s.slice(3)]).sort((a, b) => a[1].localeCompare(b[1], 'en'));
  const CC = {}; for (const [c, n] of COUNTRIES) CC[c] = n;
  const flag = c => /^[A-Z]{2}$/.test(String(c || '')) ? String.fromCodePoint(...[...c].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65)) : '';
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, '').toLowerCase();
  G.COUNTRIES = COUNTRIES; G.flag = flag; G.countryName = c => CC[c] || '';

  /* ---- the name rules ---- */
  const OK_CH = /^[\p{L}\p{M}\p{Nd} _-]+$/u, BAD_CH = /[^\p{L}\p{M}\p{Nd} _-]/gu;
  const tidy = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const nlen = s => [...s].length;
  const valid = s => { const n = tidy(s); return nlen(n) >= 3 && nlen(n) <= 16 && OK_CH.test(n); };
  const cleanName = s => tidy([...tidy(String(s || '').replace(BAD_CH, ''))].slice(0, 16).join(''));
  const MSG = { name_taken: 'Name taken', bad_name: '3–16 letters, digits, _ -', bad_country: 'Pick a country' };

  const tgUser = () => { try { const u = G.TG && G.TG.initDataUnsafe && G.TG.initDataUnsafe.user; return u || null; } catch (e) { return null; } };
  const read = () => { try { const o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o && valid(o.name) && CC[o.country]) return { name: tidy(o.name), country: o.country }; } catch (e) {} return null; };
  const write = p => { try { localStorage.setItem(LS, JSON.stringify({ name: p.name, country: p.country })); } catch (e) {} };
  let needFix = '';    // the server refused the local profile when it synced ('name_taken' …): PLAY asks again
  const has = () => !!(G.profile && valid(G.profile.name) && CC[G.profile.country]);
  const apply = (name, country) => {
    G.profile = G.profile || {}; G.profile.name = tidy(name); G.profile.country = country; write(G.profile);
    paintBtn(); try { G.emit('profile', G.profile); } catch (e) {}
  };

  /* ---- styles ---- */
  const css = document.createElement('style');
  css.textContent = [
    '.hgScr{background:var(--bg,#070c16);z-index:20}',
    '.hgP{flex:1 1 auto;min-height:0;width:min(100%,640px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "list" "foot";gap:10px}',
    '.hgPhead{grid-area:head;display:flex;flex-direction:column;gap:6px}',
    '.hgPtop{display:flex;align-items:center;gap:8px}.hgPtop .hgH{flex:1 1 auto;padding-left:60px}.hgPtop .ib{flex:none}',
    '.hgPlist.pk #hgSearch,.hgPlist.pk .hgList{display:none}.hgPlist:not(.pk) .hgSel{display:none}',
    '#hgMe span{max-width:46px}',
    '.hgPlist{grid-area:list;display:flex;flex-direction:column;gap:6px;min-height:0}',
    '.hgPfoot{grid-area:foot;display:flex;flex-direction:column;align-items:center;gap:8px}',
    '.hgH{margin:0;font:900 20px/1.2 Georgia,serif;letter-spacing:.08em;color:var(--gold,#e8b84a);text-align:center}',
    '.hgIn{width:100%;min-height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--ink,#f3e7c4);font:700 18px Georgia,serif;padding:0 14px;outline:none;user-select:text;-webkit-user-select:text;touch-action:manipulation}',
    '.hgIn:focus{border-color:var(--gold,#e8b84a)}.hgIn::placeholder{color:#6f7d92;font-weight:400}',
    '.hgMsg{font:700 13px/1.3 Georgia,serif;color:#ff8a7a;text-align:center}.hgMsg:empty{display:none}',
    '.hgSel{align-self:stretch;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;padding:4px 14px;border-radius:12px;border:2px solid var(--gold,#e8b84a);background:rgba(232,184,74,.12);font:700 17px/1.3 Georgia,serif;color:var(--ink,#f3e7c4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.hgSel:empty{display:none}',
    '.hgList{flex:1 1 auto;min-height:92px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;align-content:start;padding:2px;border-radius:12px}',
    '.hgC{min-height:44px;display:flex;align-items:center;gap:8px;text-align:left;border-radius:10px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--ink,#f3e7c4);font:14px/1.2 Georgia,serif;padding:4px 8px;cursor:pointer;touch-action:pan-y}',
    '.hgC .f{font-size:22px;line-height:1;flex:none}.hgC.sel{border-color:var(--gold,#e8b84a);background:rgba(232,184,74,.16)}.hgC[hidden],.hgLbl[hidden]{display:none}',
    '.hgLbl{grid-column:1/-1;font:12px Georgia,serif;color:var(--muted,#8d9bb0);letter-spacing:.08em;text-transform:uppercase;padding:4px 2px 0}',
    '.hgNone{grid-column:1/-1;font:14px Georgia,serif;color:var(--muted,#8d9bb0);text-align:center;padding:12px}',
    '#hgMe.bad::after{content:"!";position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#e0483a;color:#fff;font:900 12px/18px Georgia,serif;text-align:center}',
    '.hgP.pk{grid-template-rows:auto auto auto;align-content:center}',
    '@media (orientation:landscape) and (max-height:540px){.hgP{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head list" "foot list";gap:8px 16px}.hgP.pk{grid-template-rows:auto auto}.hgH{font-size:18px}.hgPfoot{justify-content:flex-start}}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---- the screen ---- */
  const scr = document.createElement('div'); scr.className = 'scr hgScr'; scr.id = 'hgProf';
  scr.innerHTML = '<div class="hgP"><div class="hgPhead"><div class="hgPtop"><h2 class="hgH">YOU</h2><button class="ib" id="hgBack" type="button" aria-label="Back"><i>✕</i></button></div>' +
    '<input id="hgName" class="hgIn" type="text" maxlength="16" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Name" aria-label="Name">' +
    '<div class="hgMsg" id="hgPErr" role="alert"></div></div>' +
    '<div class="hgPlist" id="hgPlist"><button class="hgSel" id="hgSel" type="button" aria-label="Change country"></button><input id="hgSearch" class="hgIn" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="🔍 Country" aria-label="Search a country">' +
    '<div class="hgList" id="hgList"></div></div>' +
    '<div class="hgPfoot"><button class="pri" id="hgSave">SAVE</button></div></div>';
  document.body.appendChild(scr);
  const $q = id => scr.querySelector('#' + id);
  const boxP = scr.querySelector('.hgP'), plist = $q('hgPlist'), nameIn = $q('hgName'), searchIn = $q('hgSearch'), list = $q('hgList'), errEl = $q('hgPErr'), selEl = $q('hgSel'), saveB = $q('hgSave'), backB = $q('hgBack');
  /* the core's keydown (space / J = skill, WASD) must not eat the letters typed here */
  for (const el of [nameIn, searchIn]) for (const t of ['keydown', 'keyup', 'keypress']) el.addEventListener(t, e => e.stopPropagation());

  let sel = '', pendingPlay = false, busy = false, touched = false, built = false;
  const suggestGE = () => { const u = tgUser(); return !!(u && String(u.language_code || '').toLowerCase().split(/[-_]/)[0] === 'ka'); };
  const mkBtn = (c, n, extra) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'hgC' + (extra ? ' ' + extra : ''); b.dataset.cc = c;
    const f = document.createElement('span'); f.className = 'f'; f.textContent = flag(c); const t = document.createElement('span'); t.textContent = n; b.append(f, t);
    b._k = fold(n + ' ' + c + ' ' + (ALIAS[c] || '')); return b; };
  function build() {
    if (built) return; built = true; list.textContent = '';
    if (suggestGE()) {
      const l1 = document.createElement('div'); l1.className = 'hgLbl hgSugL'; l1.textContent = 'Suggested'; list.appendChild(l1);
      list.appendChild(mkBtn('GE', CC.GE, 'hgSug'));
      const l2 = document.createElement('div'); l2.className = 'hgLbl hgSugL'; l2.textContent = 'All'; list.appendChild(l2);
    }
    for (const [c, n] of COUNTRIES) list.appendChild(mkBtn(c, n));
    const none = document.createElement('div'); none.className = 'hgNone'; none.id = 'hgNone'; none.hidden = true; none.textContent = 'No match'; list.appendChild(none);
  }
  list.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.hgC'); if (!b) return; pick(b.dataset.cc); });
  function pick(c) {
    if (!CC[c]) return; sel = c; touched = true;
    for (const b of list.querySelectorAll('.hgC')) b.classList.toggle('sel', b.dataset.cc === c);
    paintSel(); fold_(true); if (errEl.dataset.code === 'bad_country') msg('');
  }
  /* the chosen country as a chip; nothing before one is picked */
  function paintSel() { selEl.textContent = sel ? flag(sel) + ' ' + CC[sel] + ' 🔍' : ''; }
  /* folded: the chip only; unfolded: the search + grid (the chip hidden: the grid marks the pick) */
  function fold_(on) {
    on = !!(on && sel); plist.classList.toggle('pk', on); boxP.classList.toggle('pk', on);
    if (!on) { searchIn.value = ''; filter(); scrollToSel(); }
  }
  function scrollToSel() {
    list.scrollTop = 0;
    if (sel) { const b = list.querySelector('.hgC:not(.hgSug)[data-cc="' + sel + '"]'); if (b) { try { list.scrollTop = Math.max(0, b.offsetTop - list.offsetTop - list.clientHeight / 2 + b.offsetHeight / 2); } catch (e) {} } }
  }
  selEl.addEventListener('click', () => fold_(false));
  function filter() {
    const q = fold(tidy(searchIn.value)); let n = 0;
    for (const b of list.querySelectorAll('.hgC')) { const show = !q ? true : (b.classList.contains('hgSug') ? false : (b._k.indexOf(q) >= 0)); b.hidden = !show; if (show && !b.classList.contains('hgSug')) n++; }
    for (const l of list.querySelectorAll('.hgSugL')) l.hidden = !!q;
    const none = list.querySelector('#hgNone'); if (none) none.hidden = n > 0;
    return n;
  }
  searchIn.addEventListener('input', () => { filter(); list.scrollTop = 0; });
  searchIn.addEventListener('keydown', e => { if (e.key === 'Enter') { const vis = [...list.querySelectorAll('.hgC:not(.hgSug)')].filter(b => !b.hidden); if (vis.length === 1) pick(vis[0].dataset.cc); searchIn.blur(); } });
  nameIn.addEventListener('input', () => { touched = true; if (errEl.classList.contains('bad') && errEl.dataset.code !== 'bad_country') msg(''); });
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') nameIn.blur(); });
  function msg(code, text) {
    errEl.dataset.code = code || '';
    if (!code) { errEl.classList.remove('bad'); errEl.textContent = ''; return; }
    errEl.classList.add('bad'); errEl.textContent = text || MSG[code] || 'Not saved · try again';
  }

  function open(forPlay) {
    build(); pendingPlay = !!forPlay; busy = false; touched = false; saveB.disabled = false; saveB.textContent = 'SAVE';
    const p = has() ? G.profile : read();
    const u = tgUser();
    nameIn.value = p ? p.name : (u && u.first_name ? cleanName(u.first_name) : '');
    sel = p && CC[p.country] ? p.country : '';
    for (const b of list.querySelectorAll('.hgC')) b.classList.toggle('sel', b.dataset.cc === sel);
    searchIn.value = ''; filter(); paintSel(); msg(needFix ? needFix : '');
    scr.classList.add('on');
    fold_(true); scrollToSel();
  }
  function close() { scr.classList.remove('on'); try { nameIn.blur(); searchIn.blur(); } catch (e) {} pendingPlay = false; }

  async function save() {
    if (busy) return;
    const name = tidy(nameIn.value);
    if (!valid(name)) { msg('bad_name'); return; }
    if (!CC[sel]) { msg('bad_country'); return; }
    const country = sel, go = pendingPlay;
    busy = true; saveB.disabled = true; saveB.textContent = 'SAVING…';
    let res = null, online = false;
    try { if (G.net && G.TG) online = await G.net.login(); } catch (e) { online = false; }
    if (online) res = await G.net.rpc('hg_profile_set', { token: null, name, country });
    busy = false; saveB.disabled = false; saveB.textContent = 'SAVE';
    if (res && res.error) { msg(res.error); return; }
    if (res && res.ok) { needFix = ''; apply(res.name || name, CC[res.country] ? res.country : country); }
    else { needFix = ''; apply(name, country); if (online) G.toast('⚠️ Server error · saved on phone', 2400); }
    close();
    if (go) { const b = G.$('play'); if (b) b.click(); }
  }
  saveB.addEventListener('click', save);
  backB.addEventListener('click', close);

  /* ---- the title button ---- */
  const btn = document.createElement('button'); btn.className = 'ib'; btn.id = 'hgMe'; btn.type = 'button';
  const btnI = document.createElement('i'), btnS = document.createElement('span'); btn.append(btnI, btnS);
  function paintBtn() {
    const ok = has();
    btnI.textContent = ok ? (flag(G.profile.country) || '👤') : '👤'; btnS.textContent = ok ? G.profile.name : 'You';
    btn.classList.toggle('bad', !!(ok && needFix));
    btn.setAttribute('aria-label', ok ? (needFix ? (MSG[needFix] || 'Name refused') + ': ' : '') + G.profile.name + ' · ' + G.countryName(G.profile.country) : 'Name & country');
  }
  btn.addEventListener('click', () => open(false));
  const links = G.$('titleLinks'), helpB = G.$('helpB');   // before Rules: Rules stays the last icon
  if (links) { if (helpB && helpB.parentNode === links) links.insertBefore(btn, helpB); else links.appendChild(btn); }

  /* ---- the gate ---- */
  const prevGate = G.beforePlay;
  G.beforePlay = () => {
    if (!has() || needFix) { open(true); return false; }
    return typeof prevGate === 'function' ? prevGate() : true;
  };

  /* ---- sync when the game is online: the server's profile wins; with none there, the local one goes up ---- */
  let syncing = null;
  function sync() {
    if (syncing) return syncing;
    syncing = (async () => {
      if (!G.net || !G.net.on) return false;
      const r = await G.net.rpc('hg_profile_get', { token: null });
      if (!r || typeof r !== 'object' || r.error) return false;
      if (r.name && CC[r.country]) {
        needFix = ''; apply(r.name, r.country);
        if (scr.classList.contains('on') && !touched && !busy) { nameIn.value = G.profile.name; pick(G.profile.country); touched = false; }
        return true;
      }
      const loc = has() ? { name: G.profile.name, country: G.profile.country } : read();
      if (!loc) return false;
      const s = await G.net.rpc('hg_profile_set', { token: null, name: loc.name, country: loc.country });
      if (s && s.ok) { needFix = ''; apply(s.name || loc.name, CC[s.country] ? s.country : loc.country); return true; }
      if (s && s.error) { needFix = s.error; paintBtn(); if (!(G.S && !G.S.over)) G.toast('⚠️ ' + (MSG[s.error] || 'Name refused') + ' · tap your name', 3000); }
      return false;
    })().catch(() => false).then(v => { syncing = null; return v; });
    return syncing;
  }
  G.on('net', on => { if (on) sync(); });
  G.on('title', paintBtn);

  /* ---- start ---- */
  const p0 = read(); if (p0) { G.profile = G.profile || {}; G.profile.name = p0.name; G.profile.country = p0.country; }
  paintBtn();
  if (G.net && G.net.on) sync();
  G.profileUI = { open, close, valid, sync, get needFix() { return needFix; } };
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 20_profile.js: "+(e&&e.message||e));}})();
</script>
<script>/* 30_board.js */
(function(){try{
/* Heavy Gold — boards (30_board.js): the round submit, the weekly / all-time boards, the title podium (src/gold/GOLD.md, UI rules).
   - On `end`, online and with a profile: hg_round_submit(token, r), r = {god, banked, rank, heroes, robs, lost, minted, day}.
     #endExtra gets one short line (#hgWeek in #hgEnd): "🏆 #3 · 240 🪙" (this week's rank and total, the server's answer), "Connecting…"
     while it waits, "Offline · not counted" without a login, "Not counted · server" when the login worked but the call failed (e.g. a
     missing hg_* function), "Not counted · no name" without a profile, "Not counted · too soon" etc. for a refusal. Nothing else.
   - #titleExtra: the podium, one compact row #1 #2 #3 (🥇 or 👑 on #1 only; flag + name, the gold under it), headed "LAST WEEK" from hg_board(token, 'last');
     "THIS WEEK" from 'week' when last week has no rounds; nothing when neither has rounds or the game is offline.
   - Icon buttons: 🏆 "Boards" in #titleLinks (#hgTitleBoard) and in #endLinks (#hgEndBoard).
   - The board screen (#hgBoard): BOARDS 🪙 + the player count, tabs Week / Last week / All × Players / Countries, rows rank · flag · name ·
     gold (my row marked; my own row pinned under the list when I am outside the top 20), CLOSE.
   - Only server data is shown (never a Telegram id: only name, country, total, rounds, players, gold, crown are read).
   - Crowns (g2): a row with crown: true (the champion, last week's #1) gets 👑 right before the flag / name, on the board and the podium.
   - G.emit('submitted', answer, r) once hg_round_submit has answered (answer = the server's JSON, or null), for the ladder.
   - G.board = { open(), close(), load(scope, fresh), render(), podium(), top3(scope) }: top3('title' | 'last' | 'week') returns the rows
     last rendered on the podium ({rank, name, country, flag, total, mine, crown}); top3('end') is [] (the end screen shows no rows). */
(function () {
  const num = v => { const n = Number(v); return isFinite(n) ? Math.round(n) : 0; };
  const fmt = v => num(v).toLocaleString('en-US');
  const code = v => { const s = String(v == null ? '' : v).toUpperCase(); return /^[A-Z]{2}$/.test(s) ? s : ''; };
  const flag = c => (typeof G.flag === 'function' ? G.flag(c) : '') || '';
  const cname = c => (typeof G.countryName === 'function' && G.countryName(c)) || c || '—';
  const arr = v => Array.isArray(v) ? v : [];
  const online = () => !!(G.net && G.net.on);
  const hasTG = () => { try { return !!(G.TG && typeof G.TG.initData === 'string' && G.TG.initData.length); } catch (e) { return false; } };
  const hasProfile = () => !!(G.profile && G.profile.name && G.profile.country);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ib = (id, icon, word) => { const b = el('button', 'ib'); b.id = id; b.type = 'button'; b.append(el('i', null, icon), el('span', null, word)); return b; };
  const MEDAL = ['', '🥇', '', ''];   // #1 only: bigger and gold already, left to right

  /* ---- styles ---- */
  const css = document.createElement('style');
  css.textContent = [
    '.hgScr{background:var(--bg,#070c16);z-index:20}',
    '.hgB{flex:1 1 auto;min-height:0;width:min(100%,560px);display:flex;flex-direction:column;gap:8px}',
    '.hgBtop{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap}',
    '.hgBtop h2{margin:0;font:900 20px/1.2 Georgia,serif;letter-spacing:.08em;color:var(--gold,#e8b84a)}.hgU{font-size:18px;line-height:1}',
    '.hgTot{font:700 13px/1.3 Georgia,serif;color:var(--muted,#8d9bb0);margin-right:auto}',
    '.hgTabs{display:flex;gap:8px;flex-wrap:wrap}.hgTabs[hidden]{display:none}',

    '.hgPl.me .nm .n{text-decoration:underline;text-underline-offset:3px}',
    '.hgCr{flex:none;font-style:normal}.hgRow .n .hgCr{margin-right:.25em}.hgPl .nm .hgCr{font-size:.8em}',
    '@media (max-height:430px){.hgPl .nm{font-size:13px}.hgPl.p1 .nm{font-size:16px}.hgPl .g,.hgPl.p1 .g{font-size:11px}.hgPodRow{gap:8px}}',

    '.hgEnd{display:flex;justify-content:center;width:100%;min-width:0}',

  document.head.appendChild(css);

  /* ---- data ---- */

    if (!online()) return Promise.resolve(null);
    inflight[scope] = G.net.rpc('hg_board', { token: null, scope }).then(d => {
      if (d && typeof d === 'object' && !Array.isArray(d) && !d.error) { cache[scope] = { at: Date.now(), d }; return d; }
      return null;
    }).catch(() => null).then(d => { delete inflight[scope]; return d; });
    return inflight[scope];
  }

    if (my !== endSeq) return;
    if (x && x.ok && x.week) { const w = x.week; line('🏆 #' + fmt(w.rank) + ' · ' + fmt(w.total) + ' 🪙'); delete cache.week; delete cache.all; }
    else if (x && x.error) line(ERR[x.error] || 'Not counted', true);
    else line(online() ? SRV : OFF, true);   // logged in but no answer (a missing hg_* function, a 5xx, a timeout): not "offline"

  }

  /* ---- the board screen ---- */
  const scr = el('div', 'scr hgScr'); scr.id = 'hgBoard';
  const box = el('div', 'hgB');
  const top = el('div', 'hgBtop'); const h2 = el('h2', null, 'BOARDS'); const unit = el('span', 'hgU', '🪙'); unit.title = 'Gold'; const tot = el('div', 'hgTot'); tot.id = 'hgTot'; top.append(h2, unit, tot);
  const tabs = el('div', 'hgTabs'); tabs.id = 'hgTabs';
  const seg = (id, items) => { const s = el('div', 'hgSeg'); s.id = id; for (const [k, t] of items) { const b = el('button', null, t); b.type = 'button'; b.dataset.k = k; s.appendChild(b); } return s; };
  const segScope = seg('hgScope', [['week', 'Week'], ['last', 'Last week'], ['all', 'All']]), segKind = seg('hgKind', [['players', 'Players'], ['countries', 'Countries']]);
  tabs.append(segScope, segKind);
  const body = el('div', 'hgBody'); body.id = 'hgBody';
  const pin = el('div', 'hgPin'); pin.id = 'hgPin'; pin.hidden = true;
  const closeB = el('button', 'pri', 'CLOSE'); closeB.id = 'hgClose'; closeB.type = 'button';
  box.append(top, tabs, body, pin, closeB); scr.appendChild(box); document.body.appendChild(scr);
  let scope = 'week', kind = 'players', state = {};   // state[scope] = 'loading' | 'error'
  segScope.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; scope = b.dataset.k; render(); fetchScope(); });
  segKind.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; render(); });
  closeB.addEventListener('click', () => close());

  const cell = (cls, text) => el('span', cls, text);
  function note(text, retry) {
    const n = el('div', 'hgNote'); n.appendChild(el('div', null, text));
    if (retry) { const b = el('button', 'sec', '↻ Retry'); b.type = 'button'; b.id = 'hgRetry'; b.addEventListener('click', () => { delete state[scope]; open(true); }); n.appendChild(b); }
    body.appendChild(n);
  }
  function pRow(p, rank) {
    const r = el('div', 'hgRow' + (p.mine ? ' me' : '')); r.dataset.rank = rank;
    const n = cell('n'); if (p.crown) { n.appendChild(crown()); r.classList.add('crown'); } n.append(p.name);
    r.append(cell('k', String(rank)), cell('fl', flag(p.country)), n, cell('v', fmt(p.total)));
    return r;
  }
  function render() { paint(); body.classList.toggle('nt', !body.querySelector('.hgRow')); }
  function paint() {
    for (const b of segScope.children) b.classList.toggle('on', b.dataset.k === scope);
    for (const b of segKind.children) b.classList.toggle('on', b.dataset.k === kind);
    body.textContent = ''; pin.hidden = true; pin.textContent = ''; tot.textContent = '';
    if (!online()) {
      tabs.hidden = true;
      if (!hasTG()) note('Open in Telegram');
      else if (G.net && G.net.pending) note('Connecting…');
      else note('Offline', true);
      return;
    }
    tabs.hidden = false;
    const c = cache[scope];
    if (!c) { if (state[scope] === 'error') note('Server error', true); else note('Loading…'); return; }
    const d = c.d, t = d.totals || {};
    tot.textContent = '👤 ' + fmt(t.players);
    if (kind === 'players') {
      const ps = players(d);
      if (!ps.length) note('No rounds yet');
      for (const p of ps) body.appendChild(pRow(p, p.rank));
      const me = d.me && typeof d.me === 'object' ? d.me : null, inList = ps.some(p => p.mine);
      if (me && num(me.rank) > 0 && (!inList || num(me.rank) > 20) && hasProfile()) {
        pin.appendChild(pRow({ name: G.profile.name, country: G.profile.country, total: me.total, mine: true, crown: false }, '#' + fmt(me.rank)));
        pin.hidden = false;
      }
    } else {
      const cs = countries(d);
      if (!cs.length) { note('No rounds yet'); return; }
      const mine = hasProfile() ? G.profile.country : '';
      cs.forEach((c, i) => {
        const r = el('div', 'hgRow c' + (c.country && c.country === mine ? ' me' : '')); r.dataset.cc = c.country;
        r.append(cell('k', String(i + 1)), cell('fl', flag(c.country)), cell('n', cname(c.country)), cell('pp', '👤 ' + fmt(c.players)), cell('v', fmt(c.gold)));
        body.appendChild(r);
      });
    }
  }
  async function fetchScope(fresh) {
    if (!online()) return;
    const sc = scope; if (!cache[sc] || fresh) state[sc] = 'loading';
    const d = await load(sc, !!fresh);
    state[sc] = d ? 'ok' : 'error';
    if (scr.classList.contains('on') && scope === sc) render();
  }
  async function open(fresh) {
    fresh = fresh === true;
    scr.classList.add('on'); body.scrollTop = 0; render();
    if (!online() && hasTG() && G.net) { const p = G.net.login(true); render(); await p; render(); }   // "Connecting…" while the login runs
    fetchScope(fresh);
  }
  function close() { scr.classList.remove('on'); }

  /* ---- the icon buttons ---- */
  const tBtn = ib('hgTitleBoard', '🏆', 'Boards'), endBtn = ib('hgEndBoard', '🏆', 'Boards');
  const links = G.$('titleLinks'), helpB = G.$('helpB');   // before Rules: Rules stays the last icon
  if (links) { if (helpB && helpB.parentNode === links) links.insertBefore(tBtn, helpB); else links.appendChild(tBtn); }
  const eLinks = G.$('endLinks'); if (eLinks) eLinks.appendChild(endBtn);
  tBtn.addEventListener('click', () => open()); endBtn.addEventListener('click', () => open());

  G.on('net', on => { podium(); if (scr.classList.contains('on')) { render(); if (on) fetchScope(); } });
  G.on('title', () => podium());
  G.on('profile', () => { if (scr.classList.contains('on')) render(); });
  G.board = { open, close, load, render, podium, top3: s => (s === 'end' ? [] : (shown[s || 'title'] || [])).map(r => Object.assign({}, r)) };
  if (online()) podium();
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 30_board.js: "+(e&&e.message||e));}})();

<script>/* 35_chat.js */
(function(){try{
/* Heavy Gold — chat (35_chat.js): the world chat and the player's own country chat (src/gold/GOLD.md, Wave 5).

     shows the flag, the name (👑 for last week's champion), the text and a short time (HH:MM today, "21 Nov" before); an input
     ("Message", 200 characters at most) with ➤ (send, the screen's one primary button) and a 1–3 word line for each error
     ('rate' → "Too fast", 'too_long' → "Too long", 'auth' → "Not signed in", no network → "Offline").
     · On the title (no round): a full screen (.scr, z 20).
     · During a round the game keeps running, so the panel docks: a bottom sheet (42 % of the height, left of the skill button) in
       portrait, a side panel (≤ 40 % of the width, under the live board #hTR, above the skill button) on the right in landscape. The hero at the centre, the
       skill button and the free side stay uncovered, so the drag-anywhere joystick still works there. The round's end closes it.

     (since-based) for the unread dot. An answer of a full page (50) after since may have skipped older messages, so it replaces
     what is stored instead of being joined onto it (no silent gap). hg_chat_send(token, channel, body).

(function () {

<script>/* 40_daygod.js */
(function(){try{

     Mon  Máni    Moon night     dark beyond ~340 units around you       (draw: an overlay with a soft hole; coins glimmer, rivals hidden)

     Thu  Thor    Thor's day     every 30 s lightning hits the richest carrier (>= 10, not in a vault): 25 % spills as coins
     Fri  Freya   Freya's gold   coins worth 50 % more                   (mod coinValue; the start coins too, minted adjusted)
     Sat  Saturn  Saturn's hour  banking takes 0.75 s instead of 1.5     (mod bankT)

        G.setDayGod(key | 'none' | null) forces a day ('none' = no rule, null = back to the real UTC day); it takes effect at the next G.start.
        G.dayGod.active = the key in force in the running (or last) round; G.dayGod.visible(p) = false for a hero hidden by the Moon night.

    { key: 'mani',   name: 'Máni',   rule: 'Moon night',    ic: '🌙', day: 'Monday',    col: '#a9c4ff', hud: 'Dark',        desc: 'Darkness' },
    { key: 'tyr',    name: 'Tyr',    rule: "Tyr's law",     ic: '⚖️', day: 'Tuesday',   col: '#ff8a5a', hud: 'Rob 50%',     desc: 'Robbery takes 50%' },
    { key: 'odin',   name: 'Odin',   rule: "Odin's ravens", ic: '🐦', day: 'Wednesday', col: '#8fd3c8', hud: 'Fast skills', desc: 'Skills −30% wait' },

  function strike(S) {
    let q = null; for (const p of S.ps) if (!q || p.carry > q.carry) q = p;
    const rec = { t: +S.t.toFixed(3), id: q ? q.id : -1, name: q ? q.name : '', before: q ? q.carry : 0, loss: 0, me: q === S.me, hit: false };
    DG.strikes.push(rec);
    if (!q || q.carry < STRIKE_MIN) { rec.why = 'poor'; return; }
    if (S.vaults.some(v => G.dist(v, q) < v.r)) { rec.why = 'vault'; G.fx({ kind: 'text', x: q.x, y: q.y - 40, s: 'spared', c: '#9fc4ff', life: 1 }); G.toast(q === S.me ? '⚡ Vault saved you' : '⚡ ' + label(q) + ' spared'); return; }
    const loss = Math.ceil(q.carry * STRIKE_SHARE); q.carry -= loss; q.lost += loss; q.bankT = 0;
    spill(S, q.x, q.y, loss, G.radius(q) + 26);
    rec.loss = loss; rec.hit = true;
    bolts.push({ x: q.x, y: q.y, t: S.t, seed: (Math.floor(G.rnd() * 1e9) | 1) });
    G.fx({ kind: 'ring', x: q.x, y: q.y, r: 150, c: '#9fc4ff', life: 0.7 }); G.fx({ kind: 'text', x: q.x, y: q.y - 36, s: '-' + loss, c: '#9fc4ff', life: 1.1 });
    if (q === S.me) { G.toast('⚡ −' + loss + " · Thor's lightning", 2400); G.haptic('heavy'); }
    else G.toast('⚡ −' + loss + ' · ' + label(q), 2000);
    G.emit('lightning', q, loss);
  }
  G.on('step', () => { const S = G.S; if (!S || !is('thor')) return;
    while (S.t >= nextStrike && nextStrike < G.ROUND) { nextStrike += STRIKE_T; strike(S); } });

  /* ---------- drawing ---------- */
  G.on('draw', (ctx, k, ox, oy) => {
    const S = G.S; if (!S || !act) return;
    DG.view = { k, ox, oy };
    if (is('mani')) moon(ctx, S, k, ox, oy);
    if (bolts.length) drawBolts(ctx, S, k, ox, oy);
  });

  /* Moon night: an overlay, opaque beyond LIGHT units around the hero, with a soft hole; rivals outside the light are covered
     (their name labels reach into the soft edge, so they get a dark patch too); coins and vaults keep a faint glow */
  function moon(ctx, S, k, ox, oy) {
    const me = S.me, W = G.W, H = G.H, L = LIGHT * k, mx = me.x * k + ox, my = me.y * k + oy;
    ctx.save();
    const g = ctx.createRadialGradient(mx, my, L * 0.55, mx, my, L);
    g.addColorStop(0, 'rgba(' + DARK + ',0)'); g.addColorStop(0.45, 'rgba(' + DARK + ',.5)'); g.addColorStop(0.8, 'rgba(' + DARK + ',.9)'); g.addColorStop(1, 'rgba(' + DARK + ',1)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const hid = S.ps.filter(p => p !== me).concat(S.decoys || []);
    for (const p of hid) { const d = G.dist(me, p); if (d <= LIGHT || d > LIGHT + 160) continue;
      // a soft dark blob over the body, the gold glow and the name: opaque over the box, fading out past it
      const r = G.radius(p) * k, gr = r + Math.min(40, 6 + Math.sqrt(Math.max(0, p.carry || 0)) * 1.6) * k, hw = Math.max(gr, 64) + 6, px = p.x * k + ox, py = p.y * k + oy;
      const top = py - r - 36, bot = py + gr + 6, cy = (top + bot) / 2, ex = hw * 1.45, ey = (bot - top) / 2 * 1.45;
      if (px < -ex || px > W + ex || cy < -ey || cy > H + ey) continue;
      ctx.save(); ctx.translate(px, cy); ctx.scale(ex, ey);
      const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); pg.addColorStop(0, 'rgba(' + DARK + ',1)'); pg.addColorStop(0.8, 'rgba(' + DARK + ',1)'); pg.addColorStop(1, 'rgba(' + DARK + ',0)');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore(); }
    const fade = d => clamp((d - LIGHT * 0.55) / (LIGHT * 0.45), 0, 1);
    for (const v of S.vaults) for (const nx of [false, true]) { const x = nx ? v.nx : v.x, y = nx ? v.ny : v.y; if (x == null) continue;
      const a = fade(Math.hypot(x - me.x, y - me.y)); if (a <= 0) continue; const sx = x * k + ox, sy = y * k + oy, r = v.r * k;
      if (sx < -r || sx > W + r || sy < -r || sy > H + r) continue;
      ctx.strokeStyle = 'rgba(232,184,74,' + (nx ? 0.25 : 0.42) * a + ')'; ctx.lineWidth = 2; ctx.setLineDash(nx ? [4, 10] : [10, 8]); ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      if (!nx) { ctx.fillStyle = 'rgba(243,231,196,' + 0.4 * a + ')'; ctx.font = '900 ' + Math.round(16 * k + 4) + 'px Georgia'; ctx.textAlign = 'center'; ctx.fillText('VAULT', sx, sy + 6); } }
    for (const c of S.coins) { const a = fade(Math.hypot(c.x - me.x, c.y - me.y)); if (a <= 0) continue; const sx = c.x * k + ox, sy = c.y * k + oy; if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
      const r = (c.v >= 8 ? 8 : c.v >= 4 ? 6.5 : 5) * k + 1, tw = a * (0.8 + 0.2 * Math.sin(S.t * 3 + c.x * 0.013 + c.y * 0.007));
      const cg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 3); cg.addColorStop(0, 'rgba(255,214,110,' + 0.6 * tw + ')'); cg.addColorStop(0.35, 'rgba(255,200,90,' + 0.22 * tw + ')'); cg.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(sx, sy, r * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,228,150,' + 0.75 * tw + ')'; ctx.beginPath(); ctx.arc(sx, sy, r * 0.45, 0, TAU); ctx.fill(); }
    ctx.restore(); DG.drawn++;
  }

  /* Thor's day: a blue flash over the screen and a jagged bolt from the sky onto the struck hero */
  function drawBolts(ctx, S, k, ox, oy) {
    const W = G.W, H = G.H; ctx.save();
    for (const b of bolts) { const age = S.t - b.t; if (age < 0 || age > BOLT_LIFE) continue; const f = 1 - age / BOLT_LIFE, x = b.x * k + ox, y = b.y * k + oy;
      if (age < 0.3) { ctx.fillStyle = 'rgba(150,185,255,' + (0.34 * (1 - age / 0.3)) + ')'; ctx.fillRect(0, 0, W, H); DG.flashes++; }
      if (x < -80 || x > W + 80 || y < -80 || y > H + 80) continue;
      let h = b.seed + Math.floor(age * 16) * 7919; const rr = () => { h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
      const x0 = x + (rr() - 0.5) * 120, pts = [[x0, -12]], N = 9;
      for (let i = 1; i < N; i++) { const q = i / N; pts.push([x0 + (x - x0) * q + (rr() - 0.5) * 46, -12 + (y + 12) * q]); } pts.push([x, y]);
      const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); };
      ctx.globalAlpha = f; ctx.lineJoin = ctx.lineCap = 'round';
      ctx.shadowColor = '#9fc4ff'; ctx.shadowBlur = 20; ctx.strokeStyle = 'rgba(160,195,255,.9)'; ctx.lineWidth = 7; path(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = '#f4f8ff'; ctx.lineWidth = 2.5; path(); ctx.stroke();
      const ig = ctx.createRadialGradient(x, y, 0, x, y, 90 * k); ig.addColorStop(0, 'rgba(220,235,255,.75)'); ig.addColorStop(1, 'rgba(150,185,255,0)');
      ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(x, y, 90 * k, 0, TAU); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha = 1;
    bolts = bolts.filter(b => S.t - b.t <= BOLT_LIFE && S.t >= b.t);
  }

  /* ---------- UI: a title chip (a tap: the effect + the next god), a HUD chip; nothing on the end screen ---------- */
  const css = document.createElement('style');
  css.textContent = '.dg-ban{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border:1.5px solid var(--dg);border-radius:999px;background:rgba(255,255,255,.04);'
    + 'color:var(--ink);font:700 15px/1 Georgia,serif;white-space:nowrap;cursor:pointer;flex:0 0 auto;width:auto!important;max-width:100%;justify-self:center}'
    + '.dg-ban i,#dgChip i{font-style:normal;font-size:17px;line-height:1}#dgChip i{font-size:13px}'
    + '#dgPop{position:fixed;left:16px;top:0;z-index:30;pointer-events:none;font:700 15px/1.25 Georgia,serif;color:var(--ink);text-shadow:0 2px 6px #000;text-align:center;width:max-content;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:2px;'
    + 'background:rgba(7,12,22,.94);border:1px solid var(--dg);padding:7px 14px;border-radius:10px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}#dgPop.on{opacity:1;visibility:visible}'
    + '#dgPop small{font:700 12px/1.2 Georgia,serif;color:#b9c3d3}'
    + '#dgChip{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(56px + env(safe-area-inset-top));display:none;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;'
    + 'border:1px solid var(--dg);background:rgba(7,12,22,.66);color:var(--ink);font:700 11px/1.1 Georgia,serif;letter-spacing:.04em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}'
    + '#dgChip.on{display:flex}#dgChip.hot{box-shadow:0 0 12px var(--dg)}#dgChip.hot i{animation:dgp .5s infinite alternate}@keyframes dgp{to{opacity:.25}}';
  document.head.appendChild(css);

  /* a tap's pop, just under the chip (above it if there is no room), inside the 16 px gutters: the effect, then the next god
     (a pop of its own: the core's #toast sits under the title screen) */
  let popT = 0;
  const popText = () => { const n = nextOf(sel); return [sel.ic + ' ' + sel.desc, n ? 'Next: ' + n.name + ' · ' + left() : '']; };
  function pop() {
    let el = $('dgPop'); if (!el) { el = document.createElement('div'); el.id = 'dgPop'; el.setAttribute('role', 'status'); el.innerHTML = '<span></span><small></small>'; document.body.appendChild(el); }
    const [a, b] = popText(); el.style.setProperty('--dg', sel.col); el.firstChild.textContent = a; el.lastChild.textContent = b; el.lastChild.style.display = b ? '' : 'none';
    const ban = $('dgBanner'), W = innerWidth, H = innerHeight, pw = el.offsetWidth, ph = el.offsetHeight;
    const r = ban && ban.offsetParent ? ban.getBoundingClientRect() : { left: W / 2, width: 0, top: H * 0.2, bottom: H * 0.2 };
    /* under the chip, else above it, else beside it (right, then left), else on the chip itself (a tight portrait title); never on the title, the cards, the god's line or PLAY */
    const cx = clamp(r.left + r.width / 2 - pw / 2, 16, Math.max(16, W - 16 - pw)), cy = r.top + r.height / 2 - ph / 2;
    const keep = [$('play'), $('gods'), $('gdesc'), document.querySelector('#title h1')].filter(e => e && e.offsetParent).map(e => e.getBoundingClientRect());
    const free = ([x, y]) => x >= 16 - 0.5 && x + pw <= W - 16 + 0.5 && y >= 8 && y + ph <= H - 8 && !keep.some(q => x < q.right && q.left < x + pw && y < q.bottom && q.top < y + ph);
    const at = [[cx, r.bottom + 6], [cx, r.top - ph - 6], [r.right + 8, cy], [r.left - 8 - pw, cy], [cx, cy]].find(free) || [cx, clamp(r.bottom + 6, 8, Math.max(8, H - ph - 8))];
    el.style.left = at[0] + 'px'; el.style.top = at[1] + 'px';
    el.classList.add('on');
    clearTimeout(popT); popT = setTimeout(() => el.classList.remove('on'), 2600);
  }
  G.on('start', () => { const el = $('dgPop'); if (el) el.classList.remove('on'); });
  function banner() {
    const box = $('titleExtra'); if (!box) return;
    let el = $('dgBanner');
    if (!el) { el = document.createElement('button'); el.type = 'button'; el.id = 'dgBanner'; el.className = 'dg-ban'; el.innerHTML = '<i></i><span></span>'; box.appendChild(el);
      el.addEventListener('click', () => { pop(); if (G.haptic) G.haptic('light'); }); }
    if (sel.key === 'none') { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.setProperty('--dg', sel.col);
    el.firstChild.textContent = sel.ic; el.lastChild.textContent = sel.rule; el.setAttribute('aria-label', sel.rule + ': ' + sel.desc);
  }
  let chipTxt = '';
  function chip(force) {
    const box = $('hudExtra'); if (!box) return;
    let el = $('dgChip'); if (!el) { el = document.createElement('div'); el.id = 'dgChip'; el.innerHTML = '<i></i><span></span>'; box.appendChild(el); }
    if (!act || act.key === 'none') { el.classList.remove('on'); chipTxt = ''; return; }
    const S = G.S; let t = act.hud, hot = false;
    if (act.key === 'thor' && S && nextStrike < G.ROUND) { const s = Math.max(0, Math.ceil(nextStrike - S.t)); t = s + ' s'; hot = s <= 3; }   // "⚡ 12 s": the next strike
    if (force) { el.style.setProperty('--dg', act.col); el.classList.add('on'); el.firstChild.textContent = act.ic; }
    el.classList.toggle('hot', hot);
    const tl = $('hTL'); if (tl && tl.offsetHeight) el.style.top = (tl.offsetTop + tl.offsetHeight + 6) + 'px';   // right under the carry/bank block
    if (t !== chipTxt || force) { chipTxt = t; el.lastChild.textContent = t; }
  }
  G.on('hud', () => chip(false));
  const refresh = () => { if (!forced && !running()) { const t = today(); if (t.key !== sel.key) { sel = t; sync(sel); } } banner(); };
  G.on('title', refresh);
  setInterval(() => { const t = $('title'); if (t && t.classList.contains('on')) refresh(); }, 15000);
  banner();
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 40_daygod.js: "+(e&&e.message||e));}})();

<script>/* 50_training.js */
(function(){try{
/* 50_training.js — god training (the owner's idea, 2026-11-23): the player grows with his god across rounds, with a small edge only,
   so a newcomer and a friend can still beat a veteran.
   - Each god has his own XP in localStorage 'hg_train' (the player's own save: no server).
     A round gives XP = banked gold + 5 per robbery + 10 for finishing.
   - Levels 1..10 (XP 0, 60, 150, 280, 450, 670, 950, 1300, 1700, 2200). Each new level offers one of two perks for that god on the end
     screen (#endExtra). Every perk can be taken at most 3 times and moves one number by at most 15 % (speed 9 %, robbed share 9 %).
     9 picks (Lv 2..10) from 12 slots, so two choices are always open.
   - Perks reach the game only through G.addMod, and only for the human hero (p === G.S.me), never for bots.
   - The title cards (#gods .god) get "Lv N" and a thin XP bar once the god has XP (a god never played shows none); the core rebuilds the cards on each tap, a MutationObserver re-decorates them.
   - The end screen (the owner: "too much text"): one line "Thor Lv 2 [bar] +141 XP"; on a pick, "🎁 Pick one" and two cards
     (the gift's name, "Reach +5%"); after it "✓ <gift>". No breakdowns.
   - Test hooks: G.train = { get(god) → {lvl, xp, prev, next, perks, pending, offer}, reset(), offer(god), factor(god, mod), PERKS, LEVELS }. */
const G = window.G; if (!G || !G.on || !G.addMod) return;
const KEY = 'hg_train', LV = [0, 60, 150, 280, 450, 670, 950, 1300, 1700, 2200], MAXL = LV.length, XP_ROB = 5, XP_FINISH = 10, MAXT = 3, CAP = 0.15;
const num = (v, d) => String(+v.toFixed(d));
/* step = the relative change of one take; |step| × MAXT ≤ CAP. `what` names the number on the card ("Reach +5%"); base → the number itself */
const PERKS = {
  h_dash:   { god: 'hermes',  mod: 'dash',      n: 'Longer dash',    step: 0.05,  what: 'Dash',     base: () => 0.3,  f: v => num(v, 3) + ' s' },
  h_speed:  { god: 'hermes',  mod: 'speed',     n: 'Swift feet',     step: 0.03,  what: 'Speed',    base: () => 1,    f: v => '+' + num((v - 1) * 100, 1) + '%' },
  t_reach:  { god: 'thor',    mod: 'thorR',     n: 'Wider thunder',  step: 0.05,  what: 'Reach',    base: () => 170,  f: v => num(v, 0) },
  t_share:  { god: 'thor',    mod: 'thorShare', n: 'Heavier strike', step: 0.04,  what: 'Strike',   base: () => 0.25, f: v => num(v * 100, 1) + '%' },
  l_vanish: { god: 'loki',    mod: 'lokiT',     n: 'Longer vanish',  step: 0.05,  what: 'Vanish',   base: () => 3,    f: v => num(v, 2) + ' s' },
  l_cd:     { god: 'loki',    mod: 'cd',        n: 'Quick tricks',   step: -0.05, what: 'Cooldown', base: () => (G.GODS.loki || {}).cd || 10, f: v => num(v, 2) + ' s' },
  a_chain:  { god: 'amirani', mod: 'chainT',    n: 'Longer chains',  step: 0.05,  what: 'Chains',   base: () => 3,    f: v => num(v, 2) + ' s' },
  a_cd:     { god: 'amirani', mod: 'cd',        n: 'Quick chains',   step: -0.05, what: 'Cooldown', base: () => (G.GODS.amirani || {}).cd || 10, f: v => num(v, 2) + ' s' },
  bank:     { god: '*',       mod: 'bankT',     n: 'Quick banker',   step: -0.05, what: 'Bank',     base: () => G.BANK_T || 1.5, f: v => num(v, 2) + ' s' },
  purse:    { god: '*',       mod: 'rob',       n: 'Tight purse',    step: -0.03, what: 'Robbed', base: () => G.ROB || 0.35, f: v => num(v * 100, 1) + '%' },
};
const ORDER = { hermes: ['h_dash', 'h_speed'], thor: ['t_reach', 't_share'], loki: ['l_vanish', 'l_cd'], amirani: ['a_chain', 'a_cd'] };
const order = g => (ORDER[g] || []).concat(['bank', 'purse']);

/* ---------- the save ---------- */
let T = { v: 1, g: {} };
const load = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && typeof o === 'object' && o.g && typeof o.g === 'object') T = { v: 1, g: o.g }; } catch (e) {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (e) {} };
load();
const rec = g => { let r = T.g[g]; if (!r || typeof r !== 'object') r = T.g[g] = { xp: 0, p: {} }; if (!r.p || typeof r.p !== 'object') r.p = {}; return r; };
const xpOf = g => { const r = T.g[g]; const x = r && +r.xp; return isFinite(x) && x > 0 ? Math.floor(x) : 0; };
const takes = (g, id) => { const r = T.g[g]; const n = r && r.p ? Math.floor(+r.p[id]) : 0; return isFinite(n) ? Math.max(0, Math.min(MAXT, n)) : 0; };
const lvlOf = xp => { let l = 1; while (l < MAXL && xp >= LV[l]) l++; return l; };
const used = g => order(g).reduce((s, id) => s + takes(g, id), 0);
function offer(g) {
  const pend = lvlOf(xpOf(g)) - 1 - used(g); if (pend <= 0) return [];
  const open = order(g).filter(id => takes(g, id) < MAXT); if (!open.length) return [];
  if (open.length === 1) return open;
  const i = used(g) % open.length; return [open[i], open[(i + 1) % open.length]];
}
function get(g) {
  const xp = xpOf(g), lvl = lvlOf(xp), perks = {};
  for (const id of order(g)) { const n = takes(g, id); if (n) perks[id] = n; }
  return { lvl, xp, prev: LV[lvl - 1], next: lvl < MAXL ? LV[lvl] : null, perks, pending: Math.max(0, lvl - 1 - used(g)), offer: offer(g) };
}
const frac = s => s.next == null ? 1 : Math.max(0, Math.min(1, (s.xp - s.prev) / (s.next - s.prev)));
/* the training factor on one number for one god: each perk ≤ MAXT takes, and the product held inside ±CAP */
function factor(g, m) {
  let f = 1; for (const id of order(g)) { const P = PERKS[id]; if (P.mod === m) f *= 1 + P.step * takes(g, id); }
  return Math.max(1 - CAP, Math.min(1 + CAP, f));
}
function pick(g, id) {
  if (!offer(g).includes(id)) return false;
  const r = rec(g); r.p[id] = takes(g, id) + 1; save(); return true;
}

/* ---------- the modifiers: the human hero only ---------- */
for (const m of ['speed', 'cd', 'dash', 'thorR', 'thorShare', 'lokiT', 'chainT', 'bankT', 'rob'])
  G.addMod(m, (p, v) => { const S = G.S; if (!p || !S || p !== S.me || p.bot) return v; const f = factor(p.god, m); return f === 1 ? v : v * f; });

/* ---------- styles ---------- */
const st = document.createElement('style');
st.textContent = '.god{position:relative}' +
  '.trn-lv{position:absolute;left:8px;top:6px;font:700 11px/1 Georgia,serif;color:#e8b84a;pointer-events:none;letter-spacing:.02em}' +
  '.trn-cb{position:absolute;left:8px;top:20px;width:32px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;pointer-events:none}' +
  '.trn-cb>span{display:block;height:100%;background:#e8b84a}.trn-lv[hidden],.trn-cb[hidden]{display:none}' +
  '.trn-end{width:min(100%,440px);display:flex;flex-direction:column;align-items:stretch;gap:6px}' +
  '.trn-head{display:flex;align-items:center;gap:10px;font:700 15px/1.2 Georgia,serif;color:#f3e7c4;white-space:nowrap}' +
  '.trn-head .x{color:#e8b84a;font-weight:900}' +
  '.trn-bar{flex:1 1 auto;min-width:60px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}' +
  '.trn-bar>span{display:block;height:100%;background:linear-gradient(90deg,#b8862b,#f0c75e);transition:width .8s ease-out}' +
  '.trn-up{font:700 14px/1.3 Georgia,serif;color:#e8b84a;text-align:center;white-space:nowrap}' +
  '.trn-pick{display:flex;flex-direction:column;gap:6px}' +
  '.trn-row{display:flex;gap:8px;flex:1 1 auto}' +
  '.trn-row .sec{width:auto;flex:1 1 0;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 8px;line-height:1.2}' +
  '.trn-row .sec b{font-size:15px;white-space:nowrap}.trn-row .sec small{font:700 13px/1.2 Georgia,serif;color:#e8b84a;white-space:nowrap}' +

/* ---------- the title cards ---------- */

  reset() { T = { v: 1, g: {} }; try { localStorage.removeItem(KEY); } catch (e) {} last = null; const el = document.getElementById('trainEnd'); if (el) el.remove(); decorate(); },

<script>/* 60_sfx.js */
(function(){try{

      tone({ type: 'triangle', f: 659, t: t + 0.2, d: 0.34, v: 0.16 * k }); tone({ f: 330, t: t + 0.2, d: 0.34, v: 0.05 * k }); },
    // the vaults move soon: a soft bell

  Object.defineProperty(api, 'ready', { get: () => !!ac, enumerable: true });

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 60_sfx.js: "+(e&&e.message||e));}})();

  document.head.appendChild(css);
  const scr = el('div', 'scr'); scr.id = 'hgOn';
  const box = el('div', 'onB'), hH = el('h2', 'onH', 'ONLINE'), st = el('div', 'onSt'), ls = el('div', 'onLs'), ft = el('div', 'onF');
  st.id = 'onSt'; ls.id = 'onList';
  const ib = (icon, word) => { const b = el('button', 'ib'); b.type = 'button'; const w = el('span', null, word); b.append(el('i', null, icon), w); b.word = w; return b; };
  /* one primary at most: START NOW (the host, 2+ players) or TRY AGAIN (an error); Invite and Leave are icon buttons */
  const bStart = el('button', 'pri', 'START NOW'); bStart.id = 'onStart'; bStart.type = 'button';
  const row = el('div', 'onRow links');
  const bInv = ib('📤', 'Invite'); bInv.id = 'onInvite';
  const bLeave = ib('✕', 'Leave'); bLeave.id = 'onLeave';
  row.append(bInv, bLeave); ft.append(bStart, row); box.append(hH, st, ls, ft); scr.appendChild(box); document.body.appendChild(scr);
  bInv.addEventListener('click', invite);
  bStart.addEventListener('click', () => { if (O.phase === 'err') { O.phase = 'off'; play(); } else if (R && isHost() && !R.started && members().length >= 2) startRound(); });
  bLeave.addEventListener('click', leave);
  function show() { scr.classList.add('on'); paint(); }
  function hide() { scr.classList.remove('on'); }
  function paint() {
    if (!scr.classList.contains('on')) return;
    const ph = O.phase, ms = R && R.ch && R.ch.joined ? members() : [];
    st.textContent = ''; ls.textContent = '';
    bStart.hidden = true; bStart.textContent = 'START NOW'; bInv.hidden = false; bLeave.word.textContent = 'Leave';
    if (ph === 'err') { st.append(O.err || 'Server unreachable'); bStart.hidden = false; bStart.textContent = 'TRY AGAIN'; bInv.hidden = true; bLeave.word.textContent = 'Back'; return; }
    if (ph === 'conn' || ph === 'lobby' || !R || !R.ch.joined) { st.append(wsUp ? 'Finding a room…' : (tries ? 'Reconnecting…' : 'Connecting…')); bInv.hidden = true; return; }
    const left = Math.max(0, Math.ceil((R.deadline - now()) / 1000));
    const b = el('b', null, R.deadline ? left + ' s' : '…'); st.append(b); if (!R.deadline || !left) st.append(R.deadline ? 'Starting…' : 'Waiting for host');   // the seats below say who and how many
    for (const m of ms) { const r = el('div', 'onP' + (m.k === R.key ? ' me' : '')); r.dataset.u = m.u; r.append(el('span', 'f', flag(m.c)), el('span', 'n', m.n)); if (m.k === R.key) r.appendChild(el('span', 'y', 'YOU')); ls.appendChild(r); }
    const nb = Math.max(0, (G.BOTS + 1) - Math.min(ms.length, O.MAX));
    if (nb) { const r = el('div', 'onP bot'); r.append(el('span', 'f', '🤖'), el('span', 'n', '× ' + nb)); ls.appendChild(r); }
    bStart.hidden = !(isHost() && ms.length >= 2);
  }
  setInterval(() => { if (scr.classList.contains('on') && O.phase !== 'play') paint(); }, 500);

  /* the title button: online only (inside Telegram, logged in) */
  const tb = ib('🌐', 'Online'); tb.id = 'hgOnline'; tb.hidden = true;
  tb.addEventListener('click', () => play());
  /* first on screen (CSS order -1), but appended: 35_chat keeps the DOM's first place for its Chat button */
  const links = G.$('titleLinks'); if (links) links.appendChild(tb);
  const vis = () => { tb.hidden = !online(); };
  /* the HUD chip during an online round */
  const ch_ = el('div'); ch_.id = 'onChip'; const hx = G.$('hudExtra'); if (hx) hx.appendChild(ch_);
  let chipTxt = '';
  function chip() {
    const S = G.S, on = !!(R && R.started && S && S === R.S && !S.over);
    ch_.classList.toggle('on', on); if (!on) return;
    const n = R.seats.length, silent = S.client && now() - R.lastState > 1200;
    const t = silent ? '🌐 …' : '🌐 ' + n;
    if (t !== chipTxt) { chipTxt = t; ch_.textContent = t; } ch_.classList.toggle('bad', silent);
  }
  /* after an online round PLAY AGAIN looks for another online room */
  const again = G.$('again'), endScr = G.$('end');
  let lastOnline = false;
  G.on('end', S => { lastOnline = !!(S && S.online) && online(); if (again) again.textContent = lastOnline ? 'PLAY ONLINE' : 'PLAY AGAIN'; });
  if (endScr) endScr.addEventListener('click', e => { const t = e.target && e.target.closest && e.target.closest('#again'); if (!t || !lastOnline) return; e.stopPropagation(); e.preventDefault(); endScr.classList.remove('on'); G.$('title').classList.add('on'); play(); }, true);
  G.on('start', S => { if (R && S !== R.S && !S.online) { cleanup(); O.phase = 'off'; hide(); } chip(); });

  /* a friend link: start_param 'room_<code>' */
  const startCode = () => { try { const u = G.TG && G.TG.initDataUnsafe; let s = (u && u.start_param) || ''; if (!s) { const q = new URLSearchParams(location.search); s = q.get('tgWebAppStartParam') || ''; }
    const m = /^room_([a-z0-9]{4,10})$/i.exec(String(s)); return m ? m[1].toLowerCase() : ''; } catch (e) { return ''; } };
  const tryLink = () => { if (spUsed || !online()) return; const c = startCode(); if (!c) return; if (G.S && !G.S.over) return; spUsed = true; play(c); };
  G.on('net', () => { vis(); wrapRpc(); tryLink(); });
  G.on('title', vis);
  G.on('profile', () => { if (pending && hasProfile() && !(G.profileUI && G.profileUI.needFix) && online()) { const c = pending; pending = null; setTimeout(() => play(c === '*' ? '' : c), 0); } });
  vis(); setTimeout(tryLink, 0);
  window.addEventListener('pagehide', () => { if (R || ws) cleanup(); });
  Object.assign(O, { play: c => play(c), leave, invite, start: () => { if (R && isHost() && !R.started) startRound(); }, members, isHost, sendState, socketURL: wsURL });
  Object.defineProperty(O, 'R', { get: () => R, enumerable: false });
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 90_online.js: "+(e&&e.message||e));}})();
</script>
