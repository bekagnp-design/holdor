<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Heavy Gold</title>
<style>
:root{--bg:#070c16;--ink:#f3e7c4;--muted:#8d9bb0;--gold:#e8b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:rgba(7,12,22,.9);z-index:10;overflow:auto}
.scr.on{display:flex}
.scr{justify-content:flex-start}.scr>:first-child{margin-top:auto}.scr>:last-child{margin-bottom:auto}
@media (max-height:430px){.scr{gap:8px}.big{font-size:34px}.lines{font-size:13px;line-height:1.35}.sec{min-height:44px}h1{font-size:32px}.rule{font-size:14px}.god{min-height:88px}}
h1{margin:0;font:900 40px/1 Georgia,serif;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 24px rgba(232,184,74,.35);text-align:center}
.rule{margin:0;font:italic 16px/1.35 Georgia,serif;color:#cfd6e2;text-align:center;max-width:440px}
.gods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(100%,600px)}
.god{min-height:104px;border-radius:14px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--ink);padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;cursor:pointer}
.god b{font-size:16px}
.god i{font:900 20px Georgia,serif;font-style:normal;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#081018}
.god small{font-size:12px;color:var(--muted);line-height:1.2;text-align:center}
.god.sel{border-color:var(--gold);background:rgba(232,184,74,.16)}
@media (max-width:440px){.gods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pri{min-height:56px;width:min(100%,360px);border:0;border-radius:14px;background:linear-gradient(180deg,#f0c75e,#b8862b);color:#1c1207;font:900 19px Georgia,serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.sec{min-height:46px;width:min(100%,360px);border:2px solid rgba(255,255,255,.22);border-radius:14px;background:transparent;color:var(--ink);font:700 16px Georgia,serif;cursor:pointer}
.small{font-size:13px;color:var(--muted);text-align:center}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
.tl{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));font:700 15px/1.35 Georgia,serif;text-shadow:0 1px 3px #000}
.tl .c{color:var(--gold)}
.tc{position:absolute;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;font:12px/1.3 Georgia,serif;color:#cfd6e2;text-shadow:0 1px 3px #000;white-space:nowrap}
.tc b{display:block;font-size:22px;color:var(--ink)}
.tr{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));font:13px/1.4 Georgia,serif;text-align:right;text-shadow:0 1px 3px #000;min-width:120px}
.tr .me{color:var(--gold);font-weight:700}
#sk{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:3px solid var(--gold);background:rgba(10,16,28,.72);color:var(--ink);font:800 14px Georgia,serif;z-index:6;display:none;pointer-events:auto;touch-action:none}
#sk.on{display:block}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;pointer-events:none;font:700 16px Georgia,serif;color:var(--ink);text-shadow:0 2px 6px #000;text-align:center;width:max-content;max-width:calc(100vw - 32px);background:rgba(7,12,22,.78);padding:6px 12px;border-radius:10px;opacity:0;transition:opacity .25s}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#5a1414;color:#fff;font:12px monospace;padding:6px;border-radius:8px;display:none;white-space:pre-wrap}
.big{font:900 46px/1 Georgia,serif;color:var(--gold)}
.lines{font:15px/1.5 Georgia,serif;color:#cfd6e2;text-align:center}
.extra{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100%,600px)}.extra:empty,.links:empty{display:none}
/* a short landscape window (a phone held sideways): the title and end screens in two columns, so PLAY stays on screen */
@media (max-height:430px) and (min-aspect-ratio:4/3){
  #title.on,#end.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-auto-rows:min-content;column-gap:20px;row-gap:8px;align-content:safe center;align-items:start;justify-items:center}
  #title>*,#end>*{margin:0!important;width:100%}
  #title>h1{grid-column:1;grid-row:1}#title>.rule{grid-column:1;grid-row:2}#titleExtra{grid-column:1;grid-row:3/7}
  #gods{grid-column:2;grid-row:1/4}#play{grid-column:2;grid-row:4}#best{grid-column:2;grid-row:5}#titleLinks{grid-column:2;grid-row:6}
  #end>.small{grid-column:1;grid-row:1}#eRank{grid-column:1;grid-row:2}#eLines{grid-column:1;grid-row:3/7}
  #endExtra{grid-column:2;grid-row:1}#again{grid-column:2;grid-row:2}#share{grid-column:2;grid-row:3}#change{grid-column:2;grid-row:4}
  .pri,.sec{width:100%}
  #gods{grid-template-columns:repeat(2,minmax(0,1fr))}#gods .god{min-height:78px;padding:6px 6px}
}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(100%,600px)}.links .sec{width:auto;flex:1 1 140px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="tl" id="hTL"></div><div class="tc" id="hTC"></div><div class="tr" id="hTR"></div><div id="hudExtra"></div></div>
<button id="sk">SKILL</button>
<div id="toast"></div>
<div class="scr on" id="title">
  <h1>HEAVY GOLD</h1>
  <p class="rule">The lighter one robs the heavier one. Only gold in a vault is yours, and the vaults move.<br>One coin appears every second. Every 50 s a coin is worth half.<br>Drag anywhere to move. The round button is your god's skill.</p>
  <div class="gods" id="gods"></div>
  <div id="titleExtra" class="extra"></div>
  <button class="pri" id="play">PLAY</button>
  <div class="small" id="best"></div>
  <div id="titleLinks" class="links"></div>
</div>
<div class="scr" id="end">
  <div class="small">ROUND OVER</div>
  <div class="big" id="eRank"></div>
  <div class="lines" id="eLines"></div>
  <div id="endExtra" class="extra"></div>
  <button class="pri" id="again">PLAY AGAIN</button>
  <button class="sec" id="share">Challenge a friend</button>
  <button class="sec" id="change">Change god</button>
</div>
<div id="err"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
(() => {
  const errBox = document.getElementById('err');
  const showErr = m => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; };
  window.addEventListener('error', e => showErr('Error: ' + (e.message || e)));

  /* ---------- hooks for the modules (src/gold/js/*.js): G.on(event, fn), G.addMod(name, fn(p, value) → value) ----------
     events: start(S) · step(dt) · pickup(p, coin) · rob(thief, victim, take, loss) · bank(p, amount) · skill(p) · end(S, res) · draw(ctx, k, ox, oy) · hud(S) · title()
     mods:   speed · cd · dash · thorR · thorShare · lokiT · chainT · rob (the victim's share lost) · bankT · coinValue (p = null) · view (camera scale) */
  const BUS = {}, MODS = {};
  const emit = (e, ...a) => { for (const f of BUS[e] || []) { try { f(...a); } catch (x) { showErr(e + ': ' + (x && x.message || x)); } } };
  const mod = (n, p, v) => { for (const f of MODS[n] || []) { try { const r = f(p, v); if (typeof r === 'number' && isFinite(r)) v = r; } catch (x) { showErr('mod ' + n + ': ' + (x && x.message || x)); } } return v; };

  /* ---------- Telegram ---------- */
  const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
  try { if (TG) { TG.ready(); TG.expand(); if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); if (TG.setHeaderColor) TG.setHeaderColor('#070c16'); if (TG.setBackgroundColor) TG.setBackgroundColor('#070c16'); } } catch (e) {}
  const haptic = k => { try { if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

  /* ---------- canvas ---------- */
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let VW = 390, VH = 844, DPR = 1;
  const resize = () => { DPR = Math.min(2, window.devicePixelRatio || 1); VW = window.innerWidth || 390; VH = window.innerHeight || 844; cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); };
  window.addEventListener('resize', resize); resize();

  /* ---------- rules ---------- */
  /* the owner's numbers (2026-11-23): a map ~15 s across, 7 bots, one coin a second whose worth halves every 50 s (8 → 4 → 2),
     2 vaults that move every 20 s (the new spot shows 3 s before), robbery 35 % (half to the thief, half spilled) */
  const WORLD = 4000, ROUND = 150, COIN_T = 1, HALVE_T = 50, FIRST_VALUE = 8, START_COINS = 14, BOTS = 7, BANK_T = 1.5, ROB = 0.35, TAU = Math.PI * 2;
  const VAULT_N = 2, VAULT_R = 120, VAULT_MOVE = 20, VAULT_WARN = 3;
  const coinValue = t => Math.max(1, FIRST_VALUE >> Math.floor(t / HALVE_T));
  const GODS = {
    hermes:  { n: 'Hermes',  c: '#5ad1e8', g: 'H', sk: 'DASH',    d: 'Winged dash, a little faster', cd: 4 },
    thor:    { n: 'Thor',    c: '#7b93ff', g: 'T', sk: 'THUNDER', d: 'Richer rivals near you spill gold', cd: 9 },
    loki:    { n: 'Loki',    c: '#7fd36a', g: 'L', sk: 'TRICK',   d: 'Vanish, leave a glowing decoy', cd: 10 },
    amirani: { n: 'Amirani', c: '#ee6a4c', g: 'A', sk: 'CHAINS',  d: 'Cannot be robbed for 3 s', cd: 10 },
  };
  /* each god's sign inside his circle: Hermes a wing, Thor a hammer, Loki a serpent, Amirani a chain */
  function sym(c, g, x, y, s) {
    c.save(); c.fillStyle = '#081018'; c.strokeStyle = '#081018'; c.lineCap = 'round';
    if (g === 'thor') { c.fillRect(x - s * 0.46, y - s * 0.5, s * 0.92, s * 0.36); c.fillRect(x - s * 0.1, y - s * 0.16, s * 0.2, s * 0.68); }
    else if (g === 'hermes') { for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(x + s * (0.06 - i * 0.07), y - s * 0.26 + i * s * 0.26, s * (0.56 - i * 0.12), s * 0.12, -0.35, 0, TAU); c.fill(); } }
    else if (g === 'loki') { c.lineWidth = s * 0.2; c.beginPath(); c.moveTo(x - s * 0.36, y - s * 0.42); c.bezierCurveTo(x + s * 0.62, y - s * 0.42, x - s * 0.62, y + s * 0.42, x + s * 0.36, y + s * 0.42); c.stroke();
      c.beginPath(); c.arc(x - s * 0.36, y - s * 0.42, s * 0.16, 0, TAU); c.fill(); }
    else { c.lineWidth = s * 0.13; c.beginPath(); c.ellipse(x - s * 0.22, y, s * 0.3, s * 0.19, 0, 0, TAU); c.stroke(); c.beginPath(); c.ellipse(x + s * 0.22, y, s * 0.3, s * 0.19, 0, 0, TAU); c.stroke(); }
    c.restore();
  }
  const GK = Object.keys(GODS);
  const BOTN = ['Ares', 'Freya', 'Anubis', 'Odin', 'Athena', 'Dali', 'Tyr'];
  const rnd = (() => { let s = (Date.now() ^ 0x9e3779b9) >>> 0; const f = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; f.seed = n => { s = n >>> 0; }; return f; })();
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const radius = p => Math.min(58, 17 + Math.sqrt(Math.max(0, p.carry)) * 1.1);
  const speed = p => mod('speed', p, (p.god === 'hermes' ? 1.08 : 1) * 270 / Math.sqrt(1 + p.carry / 110));

  let S = null, god = 'hermes', paused = false;
  try { const g = localStorage.getItem('hg_god'); if (GODS[g]) god = g; } catch (e) {}
  const best = () => { try { return +(localStorage.getItem('hg_best') || 0); } catch (e) { return 0; } };

  /* ---------- round ---------- */
  const mkP = (name, g, bot, id) => ({ id, name, god: g, bot, x: 0, y: 0, vx: 0, vy: 0, fx: 1, fy: 0, carry: 0, bank: 0, cd: 0, imm: 0, inv: 0, dash: 0, bankT: 0, robs: 0, lost: 0, best: 0,
    ai: { t: 0, dx: 0, dy: 0, th: 18 + Math.floor(rnd() * 40), mode: 'coin' } });
  const addCoin = (x, y, v) => { S.coins.push({ x: clamp(x, 12, WORLD - 12), y: clamp(y, 12, WORLD - 12), v }); };
  const spill = (x, y, amount, r) => { if (amount <= 0) return; const n = Math.min(40, amount); let left = amount;
    for (let i = 0; i < n; i++) { const v = i === n - 1 ? left : Math.max(1, Math.floor(amount / n)); left -= v; if (v <= 0) continue; const a = rnd() * TAU, d = r * (0.7 + rnd() * 0.8); addCoin(x + Math.cos(a) * d, y + Math.sin(a) * d, v); } };
  const fx = (o) => { S.fx.push(Object.assign({ t: S.t, life: 0.8 }, o)); };
  let toastT = 0; const toast = (m, ms) => { const el = $('toast'); el.textContent = m; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { el.style.opacity = 0; }, ms || 1600); };

  /* n spots far apart and away from the edges (and from the given points) */
  function spots(n, avoid) { const out = []; for (let i = 0; i < n; i++) { let best = null, bd = -1;
      for (let k = 0; k < 40; k++) { const q = { x: 450 + rnd() * (WORLD - 900), y: 450 + rnd() * (WORLD - 900) }; const d = Math.min(1e9, ...out.concat(avoid).map(o => dist(o, q)));
        if (d > bd) { bd = d; best = q; } } out.push(best); } return out; }
  const nearestVault = p => { let bv = S.vaults[0], bd = 1e9; for (const v of S.vaults) { const d = dist(v, p); if (d < bd) { bd = d; bv = v; } } return bv; };
  function start(g) {
    god = GODS[g] ? g : god; try { localStorage.setItem('hg_god', god); } catch (e) {}
    const ps = []; let id = 0;
    const me = mkP('You', god, false, id++); ps.push(me);
    for (let i = 0; i < BOTS; i++) ps.push(mkP(BOTN[i], GK[(i + 1) % 4], true, id++));
    S = { t: 0, ps, me, coins: [], decoys: [], fx: [], veins: [], pairT: {}, vaults: [], vNext: VAULT_MOVE, nextCoin: COIN_T, minted: 0, over: false, camX: 0, camY: 0, hudT: 0 };
    S.vaults = spots(VAULT_N, []).map(q => ({ x: q.x, y: q.y, r: VAULT_R, nx: null, ny: null }));
    for (const p of ps) { for (let k = 0; k < 80; k++) { p.x = 250 + rnd() * (WORLD - 500); p.y = 250 + rnd() * (WORLD - 500);
      if (S.vaults.every(v => dist(v, p) > 500) && ps.every(q => q === p || !q.placed || dist(q, p) > 500)) break; } p.placed = true; }
    S.camX = me.x; S.camY = me.y;
    for (let i = 0; i < START_COINS; i++) { addCoin(250 + rnd() * (WORLD - 500), 250 + rnd() * (WORLD - 500), FIRST_VALUE); S.minted += FIRST_VALUE; }
    $('title').classList.remove('on'); $('end').classList.remove('on'); $('hud').classList.add('on');
    const sk = $('sk'); sk.classList.add('on'); sk.textContent = GODS[god].sk; sk.style.borderColor = GODS[god].c;
    joy.on = false; keys.clear();
    emit('start', S);
    toast(('ontouchstart' in window ? 'Drag anywhere to move. ' : 'WASD to move. ') + 'Bank gold in a VAULT.', 3000); setTimeout(() => { if (S && !S.over && S.t < 7) toast('Green ring: you can rob them. Red ring: they can rob you.', 3400); }, 3200);
  }

  function useSkill(p) {
    if (!S || S.over || p.cd > S.t) return false;
    const G = GODS[p.god]; p.cdT = mod('cd', p, G.cd); p.cd = S.t + p.cdT;
    if (p.god === 'hermes') { p.dash = S.t + mod('dash', p, 0.3); fx({ kind: 'ring', x: p.x, y: p.y, r: 40, c: G.c }); }
    else if (p.god === 'thor') {
      const TR = mod('thorR', p, 170), TS = mod('thorShare', p, 0.25);
      fx({ kind: 'ring', x: p.x, y: p.y, r: TR, c: G.c, life: 0.6 });
      let hits = 0; for (const q of S.ps) { if (q === p || q.carry <= p.carry || q.imm > S.t || q.inv > S.t || dist(p, q) > TR) continue; hits++; const loss = Math.ceil(q.carry * TS); q.carry -= loss; q.lost += loss; q.bankT = 0; spill(q.x, q.y, loss, radius(q) + 26);
        fx({ kind: 'text', x: q.x, y: q.y - 30, s: '-' + loss, c: '#9fb2ff' }); if (q === S.me) { toast(p.name + ' struck you: -' + loss); haptic('heavy'); } }
      if (!hits) { p.cd = S.t + 1; if (p === S.me) toast('No richer rival in reach'); }
    }
    else if (p.god === 'loki') { const LT = mod('lokiT', p, 3); p.inv = S.t + LT; const da = Math.atan2(p.fy, p.fx) + (rnd() < 0.5 ? 1.57 : -1.57); S.decoys.push({ owner: p, x: p.x, y: p.y, vx: Math.cos(da) * 200, vy: Math.sin(da) * 200, carry: Math.max(p.carry, 40), until: S.t + LT }); fx({ kind: 'ring', x: p.x, y: p.y, r: 50, c: G.c }); }
    else if (p.god === 'amirani') { p.imm = S.t + mod('chainT', p, 3); fx({ kind: 'ring', x: p.x, y: p.y, r: 60, c: G.c }); }
    if (p === S.me) haptic('medium');
    emit('skill', p);
    return true;
  }

  function contact(a, b) {
    const key = a.id < b.id ? a.id + '_' + b.id : b.id + '_' + a.id;
    if ((S.pairT[key] || 0) > S.t) return; S.pairT[key] = S.t + 1.0;
    if (Math.abs(a.carry - b.carry) < 1) return;
    const H = a.carry > b.carry ? a : b, L = H === a ? b : a;
    if (S.vaults.some(v => dist(v, H) < v.r)) { fx({ kind: 'text', x: H.x, y: H.y - 34, s: 'safe', c: '#e8b84a' }); return; }
    if (H.imm > S.t || H.inv > S.t) { fx({ kind: 'text', x: H.x, y: H.y - 34, s: H.imm > S.t ? 'chained' : 'missed', c: '#ee6a4c' }); return; }
    const loss = Math.ceil(H.carry * mod('rob', H, ROB)); if (loss <= 0) return;
    const take = Math.ceil(loss / 2);
    H.carry -= loss; H.lost += loss; H.bankT = 0; L.carry += take; L.robs++; L.best = Math.max(L.best, take);
    spill(H.x, H.y, loss - take, radius(H) + 24);
    fx({ kind: 'text', x: L.x, y: L.y - 34, s: '+' + take, c: '#ffd36a' }); fx({ kind: 'text', x: H.x, y: H.y - 34, s: '-' + loss, c: '#ff7a7a' });
    if (L === S.me) { toast('You robbed ' + H.name + ': +' + take); haptic('light'); }
    if (H === S.me) { toast(L.name + ' robbed you: -' + loss); haptic('heavy'); }
    emit('rob', L, H, take, loss);
  }

  /* ---------- bots ---------- */
  function think(p) {
    const a = p.ai, t = S.t; a.t = t + 0.2 + rnd() * 0.08;
    let fx_ = 0, fy_ = 0;
    if (p.carry > 6 && p.imm <= t) {   // a lighter rival close by is a thief
      let th = null, td = 230;
      for (const q of S.ps) { if (q === p || q.inv > t || q.carry >= p.carry - 3) continue; const d = dist(p, q); if (d < td) { td = d; th = q; } }
      if (th) { fx_ = (p.x - th.x) / (td || 1); fy_ = (p.y - th.y) / (td || 1);
        if (td < 120) { if (p.god === 'amirani' || p.god === 'loki' || p.god === 'hermes') useSkill(p); } }
    }
    let tx = null, ty = null;
    if (p.carry >= a.th) { const bv = nearestVault(p); tx = bv.x; ty = bv.y; a.mode = 'bank'; }
    else {
      let prey = null, pd = 460;
      for (const q of S.ps) { if (q === p || q.inv > t || q.imm > t || q.carry < p.carry + 8) continue; const d = dist(p, q); if (d < pd) { pd = d; prey = q; } }
      for (const dc of S.decoys) { if (dc.owner === p || dc.carry < p.carry + 8) continue; const d = dist(p, dc); if (d < pd) { pd = d; prey = dc; } }
      if (prey) { tx = prey.x + (prey.vx || 0) * 0.3; ty = prey.y + (prey.vy || 0) * 0.3; a.mode = 'hunt';
        if (pd < 190 && p.god === 'hermes') useSkill(p);
        if (pd < 160 && p.god === 'thor' && prey.carry > p.carry) useSkill(p); }

})();

    const f = document.createElement('span'); f.className = 'f'; f.textContent = flag(c); const t = document.createElement('span'); t.textContent = n; b.append(f, t);
    b._k = fold(n + ' ' + c + ' ' + (ALIAS[c] || '')); return b; };
  function build() {
    if (built) return; built = true; list.textContent = '';
    if (suggestGE()) {
      const l1 = document.createElement('div'); l1.className = 'hgLbl hgSugL'; l1.textContent = 'Suggested'; list.appendChild(l1);
      list.appendChild(mkBtn('GE', CC.GE, 'hgSug'));
      const l2 = document.createElement('div'); l2.className = 'hgLbl hgSugL'; l2.textContent = 'All countries'; list.appendChild(l2);
    }
    for (const [c, n] of COUNTRIES) list.appendChild(mkBtn(c, n));
    const none = document.createElement('div'); none.className = 'hgNone'; none.id = 'hgNone'; none.hidden = true; none.textContent = 'No country matches'; list.appendChild(none);
  }
  list.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.hgC'); if (!b) return; pick(b.dataset.cc); });
  function pick(c) {
    if (!CC[c]) return; sel = c; touched = true;
    for (const b of list.querySelectorAll('.hgC')) b.classList.toggle('sel', b.dataset.cc === c);
    paintSel(); if (errEl.dataset.code === 'bad_country') msg('');
  }
  function paintSel() {
    selEl.classList.remove('bad');
    if (sel) { selEl.textContent = ''; const b = document.createElement('b'); b.textContent = flag(sel) + ' ' + CC[sel]; selEl.append('Country: ', b); }
    else selEl.textContent = 'Country: pick one below';
  }
  function filter() {
    const q = fold(tidy(searchIn.value)); let n = 0;
    for (const b of list.querySelectorAll('.hgC')) { const show = !q ? true : (b.classList.contains('hgSug') ? false : (b._k.indexOf(q) >= 0)); b.hidden = !show; if (show && !b.classList.contains('hgSug')) n++; }
    for (const l of list.querySelectorAll('.hgSugL')) l.hidden = !!q;

  nameIn.addEventListener('input', () => { touched = true; if (errEl.classList.contains('bad') && errEl.dataset.code !== 'bad_country') msg(''); });

    errEl.dataset.code = code || '';

  async function save() {
    if (busy) return;
    const name = tidy(nameIn.value);
    if (!valid(name)) { msg('bad_name'); return; }
    if (!CC[sel]) { msg('bad_country'); return; }

    busy = true; saveB.disabled = true; saveB.textContent = 'SAVING…';
    let res = null, online = false;
    try { if (G.net && G.TG) online = await G.net.login(); } catch (e) { online = false; }
    if (online) res = await G.net.rpc('hg_profile_set', { token: null, name, country });
    busy = false; saveB.disabled = false; saveB.textContent = 'SAVE';
    if (res && res.error) { msg(res.error); return; }
    if (res && res.ok) { needFix = ''; apply(res.name || name, CC[res.country] ? res.country : country); }
    else { needFix = ''; apply(name, country); if (online) G.toast('Saved on this phone. The server did not answer.', 2400); }

  backB.addEventListener('click', close);

  /* ---- the title button ---- */
  const btn = document.createElement('button'); btn.className = 'sec'; btn.id = 'hgMe'; btn.type = 'button';
  function paintBtn() { btn.textContent = has() ? (needFix ? 'Name taken: change it' : G.profile.name + ' · ' + flag(G.profile.country)) : 'Your name & country'; }

  };

  /* ---- sync when the game is online: the server's profile wins; with none there, the local one goes up ---- */
  let syncing = null;
  function sync() {
    if (syncing) return syncing;
    syncing = (async () => {
      if (!G.net || !G.net.on) return false;
      const r = await G.net.rpc('hg_profile_get', { token: null });
      if (!r || typeof r !== 'object' || r.error) return false;
      if (r.name && CC[r.country]) {
        needFix = ''; apply(r.name, r.country);

        return true;

      const loc = has() ? { name: G.profile.name, country: G.profile.country } : read();
      if (!loc) return false;
      const s = await G.net.rpc('hg_profile_set', { token: null, name: loc.name, country: loc.country });
      if (s && s.ok) { needFix = ''; apply(s.name || loc.name, CC[s.country] ? s.country : loc.country); return true; }

      return false;
    })().catch(() => false).then(v => { syncing = null; return v; });

  G.on('title', paintBtn);

  /* ---- start ---- */
  const p0 = read(); if (p0) { G.profile = G.profile || {}; G.profile.name = p0.name; G.profile.country = p0.country; }

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 20_profile.js: "+(e&&e.message||e));}})();

  }

  async function submit(res) {

<script>/* 40_daygod.js */

     Mon  Máni    Moon night     dark beyond ~340 units around you       (draw: an overlay with a soft hole; coins glimmer, rivals hidden)
     Tue  Tyr     Tyr's law      a robbery takes 50 % instead of 35 %   (mod rob)
     Wed  Odin    Odin's ravens  skill cooldowns 30 % shorter            (mod cd)
     Thu  Thor    Thor's day     every 30 s lightning hits the richest carrier (>= 10, not in a vault): 25 % spills as coins
     Fri  Freya   Freya's gold   coins worth 50 % more                   (mod coinValue; the start coins too, minted adjusted)
     Sat  Saturn  Saturn's hour  banking takes 0.75 s instead of 1.5     (mod bankT)
   API: G.dayGod = { key, name, rule, day, desc, ... } (the day in force: today's UTC day, or the forced one),
        G.setDayGod(key | 'none' | null) forces a day ('none' = no rule, null = back to the real UTC day); it takes effect at the next G.start.
        G.dayGod.active = the key in force in the running (or last) round; G.dayGod.visible(p) = false for a hero hidden by the Moon night.
        G.on('lightning', (p, loss) => …) after each strike (an event of this module, sent with G.emit).

    { key: 'sol',    name: 'Sol',    rule: 'Sun day',       day: 'Sunday',    col: '#ffcf5a', desc: 'every hero runs 12% faster' },
    { key: 'mani',   name: 'Máni',   rule: 'Moon night',    day: 'Monday',    col: '#a9c4ff', desc: 'darkness past your light; coins still glimmer' },
    { key: 'tyr',    name: 'Tyr',    rule: "Tyr's law",     day: 'Tuesday',   col: '#ff8a5a', desc: 'a robbery takes 50% instead of 35%' },
    { key: 'odin',   name: 'Odin',   rule: "Odin's ravens", day: 'Wednesday', col: '#8fd3c8', desc: 'skill cooldowns are 30% shorter' },
    { key: 'thor',   name: 'Thor',   rule: "Thor's day",    day: 'Thursday',  col: '#7b93ff', desc: 'lightning strikes the richest every 30 s' },
    { key: 'freya',  name: 'Freya',  rule: "Freya's gold",  day: 'Friday',    col: '#ffa8c8', desc: 'every coin is worth 50% more' },
    { key: 'saturn', name: 'Saturn', rule: "Saturn's hour", day: 'Saturday',  col: '#d9c38a', desc: 'banking takes 0.75 s instead of 1.5 s' },

  const left = () => { const m = Math.max(1, Math.ceil(msLeft() / 6e4)), h = Math.floor(m / 60); return (h ? h + ' h ' : '') + (m % 60) + ' m'; };

    visible: p => { const S = G.S; if (!is('mani') || !S || !p || p === S.me) return true; return G.dist(S.me, p) <= LIGHT; },

    if (q === S.me) { G.toast("Thor's lightning struck you: " + loss + ' gold spilled', 2400); G.haptic('heavy'); }

  /* Moon night: an overlay, opaque beyond LIGHT units around the hero, with a soft hole; rivals outside the light are covered

      const r = (c.v >= 8 ? 8 : c.v >= 4 ? 6.5 : 5) * k + 1, tw = a * (0.8 + 0.2 * Math.sin(S.t * 3 + c.x * 0.013 + c.y * 0.007));

  }

      for (let i = 1; i < N; i++) { const q = i / N; pts.push([x0 + (x - x0) * q + (rr() - 0.5) * 46, -12 + (y + 12) * q]); } pts.push([x, y]);
      const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) ctx.lineTo(p[0], p[1]); };

      ctx.shadowColor = '#9fc4ff'; ctx.shadowBlur = 20; ctx.strokeStyle = 'rgba(160,195,255,.9)'; ctx.lineWidth = 7; path(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = '#f4f8ff'; ctx.lineWidth = 2.5; path(); ctx.stroke();
      const ig = ctx.createRadialGradient(x, y, 0, x, y, 90 * k); ig.addColorStop(0, 'rgba(220,235,255,.75)'); ig.addColorStop(1, 'rgba(150,185,255,0)');
      ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(x, y, 90 * k, 0, TAU); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha = 1;

  }

  /* ---------- UI: title banner, HUD chip, end line ---------- */
  const css = document.createElement('style');
  css.textContent = '.dg-ban{border:1px solid var(--dg);border-radius:12px;background:rgba(255,255,255,.04);padding:7px 12px;font:14px/1.4 Georgia,serif;color:#cfd6e2;text-align:center;max-width:min(100%,560px);text-wrap:balance}'
    + '.dg-ban b{color:var(--dg);letter-spacing:.06em}.dg-ban .dg-t{color:var(--muted);white-space:nowrap}'
    + '@media (max-height:430px){.dg-ban{font-size:12px;line-height:1.3;padding:3px 10px;border-radius:9px}}'
    + '@media (max-height:380px){.dg-ban{font-size:11.5px;line-height:1.2;padding:1px 10px;margin:-3px 0}}'   // 640×360: PLAY stays on screen
    + '#dgChip{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(56px + env(safe-area-inset-top));display:none;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:999px;'
    + 'border:1px solid var(--dg);background:rgba(7,12,22,.66);color:var(--ink);font:700 11px/1.1 Georgia,serif;letter-spacing:.07em;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}'
    + '#dgChip.on{display:flex}#dgChip i{width:8px;height:8px;border-radius:50%;background:var(--dg);box-shadow:0 0 6px var(--dg)}'
    + '#dgChip.hot{box-shadow:0 0 12px var(--dg)}#dgChip.hot i{animation:dgp .5s infinite alternate}@keyframes dgp{to{opacity:.25}}'
    + '#dgEnd b{color:var(--dg)}';
  document.head.appendChild(css);

  function banner() {
    const box = $('titleExtra'); if (!box) return;
    let el = $('dgBanner'); if (!el) { el = document.createElement('div'); el.id = 'dgBanner'; el.className = 'dg-ban'; box.appendChild(el); }
    if (sel.key === 'none') { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.setProperty('--dg', sel.col);
    el.innerHTML = '<b>TODAY · ' + sel.rule.toUpperCase() + '</b> — ' + sel.desc + ' <span class="dg-t">· next god in ' + left() + '</span>';
  }
  let chipTxt = '';
  function chip(force) {
    const box = $('hudExtra'); if (!box) return;
    let el = $('dgChip'); if (!el) { el = document.createElement('div'); el.id = 'dgChip'; el.innerHTML = '<i></i><span></span>'; box.appendChild(el); }
    if (!act || act.key === 'none') { el.classList.remove('on'); chipTxt = ''; return; }

    if (force) { el.style.setProperty('--dg', act.col); el.classList.add('on'); }

    if (t !== chipTxt || force) { chipTxt = t; el.lastChild.textContent = t; }
  }
  G.on('hud', () => chip(false));
  G.on('end', () => {
    const box = $('endExtra'); if (!box) return;
    let el = $('dgEnd'); if (!el) { el = document.createElement('div'); el.id = 'dgEnd'; el.className = 'small'; box.appendChild(el); }
    if (!act || act.key === 'none') { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.setProperty('--dg', act.col);
    const n = nextOf(act); el.innerHTML = 'Today: <b>' + act.rule + '</b>' + (n ? ' · next: ' + n.rule + ' in ' + left() : '');
  });
  const refresh = () => { if (!forced && !running()) { const t = today(); if (t.key !== sel.key) { sel = t; sync(sel); } } banner(); };
  G.on('title', refresh);
  setInterval(() => { const t = $('title'); if (t && t.classList.contains('on')) refresh(); }, 15000);
  banner();
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 40_daygod.js: "+(e&&e.message||e));}})();

<script>/* 50_training.js */
(function(){try{
/* 50_training.js — god training (the owner's idea, 2026-11-23): the player grows with his god across rounds, with a small edge only,
   so a newcomer and a friend can still beat a veteran.
   - Each god has his own XP in localStorage 'hg_train' (the player's own save: no server).
     A round gives XP = banked gold + 5 per robbery + 10 for finishing.
   - Levels 1..10 (XP 0, 60, 150, 280, 450, 670, 950, 1300, 1700, 2200). Each new level offers one of two perks for that god on the end
     screen (#endExtra). Every perk can be taken at most 3 times and moves one number by at most 15 % (speed 9 %, robbed share 9 %).
     9 picks (Lv 2..10) from 12 slots, so two choices are always open.
   - Perks reach the game only through G.addMod, and only for the human hero (p === G.S.me), never for bots.
   - The title cards (#gods .god) get "Lv N" and a thin XP bar; the core rebuilds the cards on each tap, a MutationObserver re-decorates them.
   - Test hooks: G.train = { get(god) → {lvl, xp, prev, next, perks, pending, offer}, reset(), offer(god), factor(god, mod), PERKS, LEVELS }. */
const G = window.G; if (!G || !G.on || !G.addMod) return;
const KEY = 'hg_train', LV = [0, 60, 150, 280, 450, 670, 950, 1300, 1700, 2200], MAXL = LV.length, XP_ROB = 5, XP_FINISH = 10, MAXT = 3, CAP = 0.15;
const num = (v, d) => String(+v.toFixed(d));
/* step = the relative change of one take; |step| × MAXT ≤ CAP. `what` + base → the before → after line on the button */
const PERKS = {
  h_dash:   { god: 'hermes',  mod: 'dash',      n: 'Longer dash',    step: 0.05,  what: 'Dash',     base: () => 0.3,  f: v => num(v, 3) + ' s' },
  h_speed:  { god: 'hermes',  mod: 'speed',     n: 'Swift feet',     step: 0.03,  what: 'Speed',    base: () => 1,    f: v => '+' + num((v - 1) * 100, 1) + '%' },
  t_reach:  { god: 'thor',    mod: 'thorR',     n: 'Wider thunder',  step: 0.05,  what: 'Reach',    base: () => 170,  f: v => num(v, 0) },
  t_share:  { god: 'thor',    mod: 'thorShare', n: 'Heavier strike', step: 0.04,  what: 'Strike',   base: () => 0.25, f: v => num(v * 100, 1) + '%' },
  l_vanish: { god: 'loki',    mod: 'lokiT',     n: 'Longer vanish',  step: 0.05,  what: 'Vanish',   base: () => 3,    f: v => num(v, 2) + ' s' },
  l_cd:     { god: 'loki',    mod: 'cd',        n: 'Quick tricks',   step: -0.05, what: 'Cooldown', base: () => (G.GODS.loki || {}).cd || 10, f: v => num(v, 2) + ' s' },
  a_chain:  { god: 'amirani', mod: 'chainT',    n: 'Longer chains',  step: 0.05,  what: 'Chains',   base: () => 3,    f: v => num(v, 2) + ' s' },
  a_cd:     { god: 'amirani', mod: 'cd',        n: 'Quick chains',   step: -0.05, what: 'Cooldown', base: () => (G.GODS.amirani || {}).cd || 10, f: v => num(v, 2) + ' s' },
  bank:     { god: '*',       mod: 'bankT',     n: 'Quick banker',   step: -0.05, what: 'Bank',     base: () => G.BANK_T || 1.5, f: v => num(v, 2) + ' s' },
  purse:    { god: '*',       mod: 'rob',       n: 'Tight purse',    step: -0.03, what: 'Robbed of', base: () => G.ROB || 0.35, f: v => num(v * 100, 1) + '%' },
};
const ORDER = { hermes: ['h_dash', 'h_speed'], thor: ['t_reach', 't_share'], loki: ['l_vanish', 'l_cd'], amirani: ['a_chain', 'a_cd'] };
const order = g => (ORDER[g] || []).concat(['bank', 'purse']);

/* ---------- the save ---------- */
let T = { v: 1, g: {} };
const load = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && typeof o === 'object' && o.g && typeof o.g === 'object') T = { v: 1, g: o.g }; } catch (e) {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (e) {} };
load();
const rec = g => { let r = T.g[g]; if (!r || typeof r !== 'object') r = T.g[g] = { xp: 0, p: {} }; if (!r.p || typeof r.p !== 'object') r.p = {}; return r; };
const xpOf = g => { const r = T.g[g]; const x = r && +r.xp; return isFinite(x) && x > 0 ? Math.floor(x) : 0; };
const takes = (g, id) => { const r = T.g[g]; const n = r && r.p ? Math.floor(+r.p[id]) : 0; return isFinite(n) ? Math.max(0, Math.min(MAXT, n)) : 0; };
const lvlOf = xp => { let l = 1; while (l < MAXL && xp >= LV[l]) l++; return l; };
const used = g => order(g).reduce((s, id) => s + takes(g, id), 0);
function offer(g) {
  const pend = lvlOf(xpOf(g)) - 1 - used(g); if (pend <= 0) return [];
  const open = order(g).filter(id => takes(g, id) < MAXT); if (!open.length) return [];
  if (open.length === 1) return open;
  const i = used(g) % open.length; return [open[i], open[(i + 1) % open.length]];
}
function get(g) {
  const xp = xpOf(g), lvl = lvlOf(xp), perks = {};
  for (const id of order(g)) { const n = takes(g, id); if (n) perks[id] = n; }
  return { lvl, xp, prev: LV[lvl - 1], next: lvl < MAXL ? LV[lvl] : null, perks, pending: Math.max(0, lvl - 1 - used(g)), offer: offer(g) };
}
const frac = s => s.next == null ? 1 : Math.max(0, Math.min(1, (s.xp - s.prev) / (s.next - s.prev)));
/* the training factor on one number for one god: each perk ≤ MAXT takes, and the product held inside ±CAP */
function factor(g, m) {
  let f = 1; for (const id of order(g)) { const P = PERKS[id]; if (P.mod === m) f *= 1 + P.step * takes(g, id); }
  return Math.max(1 - CAP, Math.min(1 + CAP, f));
}
function pick(g, id) {
  if (!offer(g).includes(id)) return false;
  const r = rec(g); r.p[id] = takes(g, id) + 1; save(); return true;
}

/* ---------- the modifiers: the human hero only ---------- */
for (const m of ['speed', 'cd', 'dash', 'thorR', 'thorShare', 'lokiT', 'chainT', 'bankT', 'rob'])
  G.addMod(m, (p, v) => { const S = G.S; if (!p || !S || p !== S.me || p.bot) return v; const f = factor(p.god, m); return f === 1 ? v : v * f; });

/* ---------- styles ---------- */
const st = document.createElement('style');
st.textContent = '.god{position:relative}' +
  '.trn-lv{position:absolute;left:8px;top:6px;font:700 11px/1 Georgia,serif;color:#e8b84a;pointer-events:none;letter-spacing:.02em}' +
  '.trn-cb{position:absolute;left:8px;top:20px;width:32px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;pointer-events:none}' +
  '.trn-cb>span{display:block;height:100%;background:#e8b84a}' +
  '.trn-end{width:min(100%,440px);display:flex;flex-direction:column;align-items:stretch;gap:6px}' +
  '.trn-head{display:flex;align-items:center;gap:10px;font:700 15px/1.2 Georgia,serif;color:#f3e7c4;white-space:nowrap}' +
  '.trn-head .x{color:#e8b84a;font-weight:900}' +
  '.trn-bar{flex:1 1 auto;min-width:60px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}' +
  '.trn-bar>span{display:block;height:100%;background:linear-gradient(90deg,#b8862b,#f0c75e);transition:width .8s ease-out}' +
  '.trn-sub{font:12px/1.3 Georgia,serif;color:#8d9bb0;text-align:center}' +
  '.trn-up{font:700 14px/1.3 Georgia,serif;color:#f3e7c4;text-align:center}.trn-up .x{color:#e8b84a}.trn-up em{font-style:normal;color:#e8b84a;font-size:11px;letter-spacing:.08em}' +
  '.trn-pick{display:flex;flex-direction:column;gap:6px}' +
  '.trn-row{display:flex;gap:8px;flex:1 1 auto}' +
  '.trn-row .sec{width:auto;flex:1 1 0;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 8px;line-height:1.2}' +
  '.trn-row .sec b{font-size:15px}.trn-row .sec small{font:12px/1.2 Georgia,serif;color:#cfd6e2}.trn-row .sec em{font-style:normal;font-weight:400;color:#e8b84a;letter-spacing:.08em;font-size:11px}' +
  '@media (max-height:430px){.trn-end{width:min(100%,600px);gap:4px}.trn-head{font-size:14px}.trn-sub{display:none}' +
  '.trn-pick{flex-direction:row;align-items:center;gap:8px}.trn-pick .trn-up{flex:0 0 140px;text-align:left;font-size:13px}.trn-from{display:none}.trn-row .sec{min-height:46px;padding:4px 8px}.trn-row .sec b{font-size:14px}}';
document.head.appendChild(st);

/* ---------- the title cards ---------- */
function decorate() {
  const box = G.$('gods'); if (!box) return;
  for (const b of box.querySelectorAll('.god')) {
    const g = b.dataset.god; if (!g) continue;
    let lv = b.querySelector('.trn-lv'), cb = b.querySelector('.trn-cb');
    if (!lv) { lv = document.createElement('span'); lv.className = 'trn-lv'; b.appendChild(lv); }
    if (!cb) { cb = document.createElement('span'); cb.className = 'trn-cb'; cb.appendChild(document.createElement('span')); b.appendChild(cb); }
    const s = get(g); lv.textContent = 'Lv ' + s.lvl; cb.firstChild.style.width = Math.round(frac(s) * 100) + '%';
  }
}
decorate();
try { const box = G.$('gods'); if (box && window.MutationObserver) new MutationObserver(decorate).observe(box, { childList: true }); } catch (e) {}
G.on('title', decorate);

/* ---------- the end screen ---------- */
let last = null;   // the last round: {god, gain, bank, robs, fromXp, fromLvl, took, fresh}
const pips = (g, id) => { const n = takes(g, id); return '●'.repeat(n) + '○'.repeat(MAXT - n); };
const line = (g, id) => { const P = PERKS[id], b = P.base(), n = takes(g, id); return P.what + ' ' + P.f(b * (1 + P.step * n)) + ' → ' + P.f(b * (1 + P.step * (n + 1))); };
function box() {
  let el = document.getElementById('trainEnd');
  const host = G.$('endExtra');
  if (!el) { el = document.createElement('div'); el.id = 'trainEnd'; el.className = 'trn-end'; }
  if (host && el.parentNode !== host) host.appendChild(el);
  else if (!host && !el.parentNode) { const a = G.$('again'); if (a && a.parentNode) a.parentNode.insertBefore(el, a); }
  return el;
}
function renderEnd() {
  if (!last) return;
  const el = box(), g = last.god, GD = G.GODS[g] || { n: g, c: '#e8b84a' }, s = get(g);
  const w = Math.round(frac(s) * 100), w0 = last.fresh ? (s.lvl === last.fromLvl ? Math.round(frac({ xp: last.fromXp, prev: s.prev, next: s.next }) * 100) : 0) : w;
  const up = s.lvl > last.fromLvl;
  let h = '<div class="trn-head"><span>' + GD.n + ' · Lv ' + s.lvl + '</span><span class="trn-bar"><span style="width:' + w0 + '%"></span></span><span class="x">+' + last.gain + ' XP</span></div>' +
    '<div class="trn-sub">Banked ' + last.bank + (last.robs ? ' + ' + last.robs + (last.robs > 1 ? ' robs' : ' rob') + ' ×' + XP_ROB : '') + ' + finish ' + XP_FINISH + ' · ' + (s.next == null ? 'top level' : (s.next - s.xp) + ' XP to Lv ' + (s.lvl + 1)) + '</div>';
  const off = s.offer;
  if (off.length) {
    h += '<div class="trn-pick"><div class="trn-up">' + (up && !last.took ? '<span class="x">Level ' + s.lvl + '!</span> ' : '') + 'Pick a gift<span class="trn-from"> from ' + GD.n + '</span>' + (s.pending > 1 ? ' · ' + s.pending + ' waiting' : '') + '</div><div class="trn-row">' +
      off.map(id => '<button class="sec" data-perk="' + id + '" style="border-color:' + GD.c + '"><b>' + PERKS[id].n + ' <em>' + pips(g, id) + '</em></b><small>' + line(g, id) + '</small></button>').join('') + '</div></div>';
  } else if (last.took) h += '<div class="trn-up">Taken: <span class="x">' + PERKS[last.took].n + '</span> <em>' + pips(g, last.took) + '</em></div>';
  el.innerHTML = h;
  for (const b of el.querySelectorAll('button[data-perk]')) b.addEventListener('click', () => {
    if (b.disabled) return; for (const o of el.querySelectorAll('button[data-perk]')) o.disabled = true;
    const id = b.dataset.perk;
    if (pick(g, id)) { last.took = id; G.haptic('light'); }
    last.fresh = false; renderEnd(); decorate();
  });
  if (last.fresh && w0 !== w) { const f = el.querySelector('.trn-bar>span'); requestAnimationFrame(() => requestAnimationFrame(() => { f.style.width = w + '%'; })); }
  last.fresh = false;
}
const seen = new WeakSet();
G.on('end', (S, res) => {
  if (!res || !G.GODS[res.god] || (S && seen.has(S))) return; if (S) seen.add(S);
  const g = res.god, bank = Math.max(0, Math.floor(+res.bank || 0)), robs = Math.max(0, Math.floor(+res.robs || 0));
  const gain = bank + XP_ROB * robs + XP_FINISH, fromXp = xpOf(g);
  rec(g).xp = fromXp + gain; save();
  last = { god: g, gain, bank, robs, fromXp, fromLvl: lvlOf(fromXp), took: null, fresh: true };
  renderEnd(); decorate();
});

G.train = {
  get, offer, factor, PERKS, LEVELS: LV.slice(), XP: { rob: XP_ROB, finish: XP_FINISH }, MAX_TAKES: MAXT, CAP,
  reset() { T = { v: 1, g: {} }; try { localStorage.removeItem(KEY); } catch (e) {} last = null; const el = document.getElementById('trainEnd'); if (el) el.remove(); decorate(); },
};

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 50_training.js: "+(e&&e.message||e));}})();

<script>/* 60_sfx.js */
(function(){try{
/* 60_sfx.js — Heavy Gold sound. Every sound is synthesised with WebAudio: no audio files, no URLs.
   - The AudioContext is made on the first user gesture (iOS and Telegram need that) and never before.
   - Only events of the human hero, or ones on his screen, make a sound; frequent sounds are throttled.
   - The halving, the vault-move warning and the last 20 s are read from G.S (S.t crossing the times, the next vault spot
     appearing), not from the toast text.
   - A "Sound: on/off" .sec button in #titleLinks, saved in localStorage 'hg_sound' ('on' | 'off').
   - G.sfx = { play(name, vol), muted (get/set), log: [] (the names played, for tests), names, ready }. */
(() => {
  const G = window.G; if (!G) return;
  const KEY = 'hg_sound', MASTER = 0.9;
  const AC = window.AudioContext || window.webkitAudioContext;
  let muted = false; try { muted = localStorage.getItem(KEY) === 'off'; } catch (e) {}
  let ac = null, out = null, nbuf = null;
  const log = [], last = {}, recent = [];
  const ms = () => (window.performance && performance.now ? performance.now() : Date.now());

  /* ---------- the context: made inside a gesture only ---------- */
  function ensure() {
    if (muted || !AC) return null;
    if (!ac) {
      try {
        try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}   // mix with the player's music
        ac = new AC();
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
        out = ac.createGain(); out.gain.value = MASTER; out.connect(comp); comp.connect(ac.destination);
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0);   // the iOS unlock
      } catch (e) { ac = null; out = null; return null; }
    }
    if (ac.state !== 'running' && ac.resume) { try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    return ac;
  }
  const gesture = () => { if (!muted) ensure(); };
  for (const ev of ['pointerdown', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown']) window.addEventListener(ev, gesture, { capture: true, passive: true });
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    try { const p = document.hidden ? ac.suspend() : (!muted ? ac.resume() : null); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  });

  /* ---------- building blocks ---------- */
  const noiseBuf = () => { if (nbuf) return nbuf; const n = Math.floor(ac.sampleRate * 0.8); nbuf = ac.createBuffer(1, n, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return nbuf; };
  const env = (g, t, a, v, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d); };
  const free = (...n) => () => { for (const x of n) { try { x.disconnect(); } catch (e) {} } };
  /* a tone: f (Hz), f2 (glide target), type, t (start), d (length), v (peak), a (attack), det (cents) */
  function tone(o) {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, o.t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, o.t + (o.glide || o.d));
    if (o.det) osc.detune.setValueAtTime(o.det, o.t);
    env(g, o.t, o.a || 0.004, o.v, o.d);
    osc.connect(g); g.connect(out); osc.start(o.t); osc.stop(o.t + o.d + 0.05); osc.onended = free(osc, g);
  }
  /* filtered noise: ft (filter type), f, f2 (sweep), q, t, d, v, a */
  function noise(o) {
    const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf(); flt.type = o.ft || 'bandpass'; flt.frequency.setValueAtTime(o.f, o.t);
    if (o.f2) flt.frequency.exponentialRampToValueAtTime(o.f2, o.t + o.d);
    flt.Q.setValueAtTime(o.q || 1, o.t);
    env(g, o.t, o.a || 0.01, o.v, o.d);
    src.connect(flt); flt.connect(g); g.connect(out); src.start(o.t, Math.random() * 0.3); src.stop(o.t + o.d + 0.05); src.onended = free(src, flt, g);
  }
  const semi = (f, n) => f * Math.pow(2, n / 12);

  /* ---------- the sounds: (t, vol, arg) ---------- */
  const SND = {
    // a soft coin tick, higher for a richer coin and for a quick run of pickups
    pickup(t, k, a) { const v = (a && a.v) || 1, n = (v >= 8 ? 7 : v >= 4 ? 3 : v >= 2 ? 0 : -3) + Math.min(4, (a && a.streak) || 0), f = semi(880, n);
      tone({ f, t, d: 0.09, v: 0.28 * k, a: 0.002 }); tone({ f: f * 2.76, t, d: 0.035, v: 0.05 * k, a: 0.001 }); },
    // you robbed someone: a bright rising run
    rob(t, k) { [784, 1175, 1568].forEach((f, i) => tone({ type: 'triangle', f, t: t + i * 0.055, d: 0.17, v: 0.16 * k }));
      tone({ f: 3136, t: t + 0.12, d: 0.22, v: 0.04 * k }); },
    // you were robbed: a low thud
    robbed(t, k) { tone({ f: 150, f2: 46, glide: 0.22, t, d: 0.34, v: 0.55 * k, a: 0.003 }); noise({ ft: 'lowpass', f: 320, q: 0.8, t, d: 0.13, v: 0.3 * k, a: 0.002 });
      tone({ type: 'triangle', f: 233, f2: 196, t: t + 0.03, d: 0.26, v: 0.05 * k }); },
    // two others clash on your screen: a soft muffled pop
    rob_near(t, k) { noise({ ft: 'bandpass', f: 700, q: 1.4, t, d: 0.09, v: 0.22 * k, a: 0.002 }); tone({ f: 210, f2: 120, t, d: 0.12, v: 0.12 * k }); },
    // banked: a small chime, a third note for a big deposit
    bank(t, k, amt) { const notes = [1319, 1976].concat(amt >= 100 ? [2637] : []);
      notes.forEach((f, i) => { tone({ f, t: t + i * 0.08, d: 0.55, v: 0.14 * k, a: 0.003 }); tone({ f: f * 2.76, t: t + i * 0.08, d: 0.14, v: 0.025 * k, a: 0.002 }); }); },
    // Hermes: a whoosh
    skill_hermes(t, k) { noise({ ft: 'bandpass', f: 450, f2: 3200, q: 1.3, t, d: 0.34, v: 0.6 * k, a: 0.09 }); tone({ f: 520, f2: 1250, t, d: 0.22, v: 0.03 * k, a: 0.05 }); },
    // Thor: a crack, then a rumble
    skill_thor(t, k) { noise({ ft: 'highpass', f: 2600, q: 0.7, t, d: 0.06, v: 0.22 * k, a: 0.001 }); noise({ ft: 'lowpass', f: 190, f2: 70, q: 0.8, t, d: 0.75, v: 0.7 * k, a: 0.02 });
      tone({ f: 58, f2: 36, t, d: 0.65, v: 0.35 * k, a: 0.02 }); },
    // Loki: a shimmer of high notes
    skill_loki(t, k) { [1760, 2217, 2637, 3136, 2637, 3520].forEach((f, i) => tone({ f, t: t + i * 0.045, d: 0.34, v: 0.05 * k, a: 0.01, det: (Math.random() - 0.5) * 18 })); },
    // Amirani: two metal clanks
    skill_amirani(t, k) { for (const [dt, m] of [[0, 1], [0.09, 0.94]]) { noise({ ft: 'highpass', f: 3200, q: 0.8, t: t + dt, d: 0.04, v: 0.08 * k, a: 0.001 });
      [523, 1330, 2240, 3170].forEach((f, i) => tone({ type: i ? 'sine' : 'triangle', f: f * m, t: t + dt, d: 0.18 - i * 0.03, v: (0.09 - i * 0.015) * k, a: 0.001 })); } },
    // a halving: two falling notes
    halving(t, k) { tone({ type: 'triangle', f: 988, t, d: 0.2, v: 0.16 * k }); tone({ f: 494, t, d: 0.2, v: 0.05 * k });
      tone({ type: 'triangle', f: 659, t: t + 0.2, d: 0.34, v: 0.16 * k }); tone({ f: 330, t: t + 0.2, d: 0.34, v: 0.05 * k }); },
    // the vaults move soon: a soft bell
    vault(t, k) { tone({ f: 784, t, d: 1.1, v: 0.13 * k, a: 0.006 }); tone({ f: 1568, t, d: 0.5, v: 0.035 * k, a: 0.004 }); tone({ f: 784 * 2.76, t, d: 0.3, v: 0.02 * k, a: 0.003 }); },
    // the clock: a wood tick (arg 2: tick-tock)
    tick(t, k, n) { for (let i = 0; i < (n || 1); i++) { const tt = t + i * 0.2, f = i ? 1250 : 1700;
      tone({ f, f2: f * 0.7, glide: 0.03, t: tt, d: 0.05, v: 0.14 * k, a: 0.001 }); noise({ ft: 'bandpass', f: f * 1.5, q: 4, t: tt, d: 0.03, v: 0.07 * k, a: 0.001 }); } },
    // the round is over: a rising chord for first place, a soft cadence otherwise
    end(t, k, rank) { const ns = rank === 1 ? [523, 659, 784, 1047] : [784, 659, 523];
      ns.forEach((f, i) => tone({ type: 'triangle', f, t: t + i * 0.11, d: i === ns.length - 1 ? 0.7 : 0.22, v: 0.14 * k })); },
    // the sound button itself
    ui(t, k) { tone({ f: 1175, t, d: 0.08, v: 0.12 * k, a: 0.002 }); },
  };
  /* the least time between two plays of a sound (ms); the rest are rare and play every time */
  const GAP = { pickup: 60, rob: 90, robbed: 90, rob_near: 250, skill_hermes: 200, skill_thor: 200, skill_loki: 200, skill_amirani: 200, ui: 80 };

  function play(name, vol, arg) {
    const fn = SND[name]; if (!fn || muted || !ac || !out || ac.state === 'closed') return false;   // no context before the first gesture
    const now = ms(), k = vol == null ? 1 : Math.max(0.05, Math.min(1, +vol || 0));
    if (GAP[name] && last[name] != null && now - last[name] < GAP[name]) return false;
    while (recent.length && now - recent[0] > 160) recent.shift();
    if ((name === 'pickup' || k < 1) && recent.length >= 4) return false;   // a crowded moment: drop the small sounds
    try { fn(ac.currentTime + 0.01, k, arg); } catch (e) { return false; }
    last[name] = now; recent.push(now);
    log.push(name); if (log.length > 300) log.splice(0, log.length - 300);
    return true;
  }

  /* ---------- mute ---------- */
  let btn = null;
  const label = () => { if (btn) { btn.textContent = 'Sound: ' + (muted ? 'off' : 'on'); btn.setAttribute('aria-pressed', String(!muted)); } };
  function setMuted(v) {
    muted = !!v; try { localStorage.setItem(KEY, muted ? 'off' : 'on'); } catch (e) {}
    if (ac && out) { try { out.gain.cancelScheduledValues(ac.currentTime); out.gain.setTargetAtTime(muted ? 0 : MASTER, ac.currentTime, 0.02); } catch (e) {} }
    if (muted && ac) setTimeout(() => { if (muted && ac && ac.suspend) { try { const p = ac.suspend(); if (p && p.catch) p.catch(() => {}); } catch (e) {} } }, 150);   // silent and idle
    label();
  }
  const links = document.getElementById('titleLinks');
  if (links) {
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sec'; btn.id = 'hgSound'; label(); links.appendChild(btn);
    btn.addEventListener('click', () => { setMuted(!muted); if (!muted) { ensure(); play('ui'); } });
  }

  /* ---------- what the hero hears ---------- */
  const viewK = me => { const base = Math.min(1.5, Math.max(0.65, Math.sqrt(G.W * G.H) / 680)) / (1 + (G.radius(me) - 17) / 140);
    try { return typeof G.mod === 'function' ? G.mod('view', me, base) : base; } catch (e) { return base; } };
  /* is the world point on the human hero's screen (with a margin in world units)? */
  const seen = (x, y, pad) => { const S = G.S; if (!S) return false; const me = S.me, k = viewK(me) || 1;
    return Math.abs(x - me.x) < G.W / 2 / k + (pad || 0) && Math.abs(y - me.y) < G.H / 2 / k + (pad || 0); };
  const skillName = g => SND['skill_' + g] ? 'skill_' + g : 'skill_hermes';

  let prevT = 0, nextSeen = false, lostSeen = 0, streak = 0, streakT = -1e9;
  G.on('start', S => { prevT = S.t; nextSeen = !!(S.vaults[0] && S.vaults[0].nx != null); lostSeen = S.me.lost; streak = 0; });
  G.on('pickup', (p, c) => { const S = G.S; if (!S || p !== S.me) return;
    const now = ms(); streak = now - streakT < 450 ? streak + 1 : 0; streakT = now; play('pickup', 1, { v: c && c.v, streak }); });
  G.on('rob', (thief, victim) => { const S = G.S; if (!S) return; const me = S.me;
    if (thief === me) play('rob'); else if (victim === me) play('robbed'); else if (seen(victim.x, victim.y, 40)) play('rob_near', 0.5);
    lostSeen = me.lost; });
  G.on('bank', (p, amt) => { const S = G.S; if (S && p === S.me) play('bank', 1, amt); });
  G.on('skill', p => { const S = G.S; if (!S) return; const me = S.me;
    if (p === me) play(skillName(p.god)); else if (seen(p.x, p.y, 80)) play(skillName(p.god), 0.35);
    if (p !== me && p.god === 'thor' && me.lost > lostSeen) play('robbed', 0.9);   // his thunder made you spill
    lostSeen = me.lost; });
  G.on('step', () => { const S = G.S; if (!S) return; const a = prevT, t = S.t, RD = G.ROUND || 150, H = G.HALVE_T || 50; prevT = t;
    for (let n = 1; n * H < RD; n++) if (a < n * H && t >= n * H) play('halving');
    const nx = !!(S.vaults[0] && S.vaults[0].nx != null); if (nx && !nextSeen) play('vault'); nextSeen = nx;
    if (a < RD - 20 && t >= RD - 20) play('tick', 1, 2);
    for (let s = 5; s >= 1; s--) if (a < RD - s && t >= RD - s) play('tick', 0.7, 1);
    lostSeen = S.me.lost; });
  G.on('end', (S, res) => { play('end', 1, res && res.rank); });

  const api = { play, log, names: Object.keys(SND), toggle: () => setMuted(!muted) };
  Object.defineProperty(api, 'muted', { get: () => muted, set: v => setMuted(v), enumerable: true });
  Object.defineProperty(api, 'ready', { get: () => !!ac, enumerable: true });
  Object.defineProperty(api, 'state', { get: () => (ac ? ac.state : 'none'), enumerable: true });
  G.sfx = api;
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 60_sfx.js: "+(e&&e.message||e));}})();
</script>
<script>/* 70_minimap.js */
(function(){try{
/* 70_minimap.js — Heavy Gold minimap: a 92 px canvas in #hudExtra, under the top-left carry/bank text (clear of the clock,
   the board and the skill button at 390×844, 844×390 and 640×360). It never takes a touch (pointer-events:none), so a drag
   that starts on it still moves the hero. It shows the 4000×4000 arena, the camera's view, the two vaults (gold rings) and
   the next vault spots once they are announced (dashed), you (a white dot with your facing) and the other heroes (dots in
   their god's colour, larger the more they carry; a vanished Loki shows only as his decoy). No coins. Redrawn on 'hud'
   (10 times a second) at most. While you carry gold a dashed line leads to the nearest vault, because the core's off-screen
   vault arrow can fall under this panel (top-left corner). G.minimap = { el, dots, marks, draws, rect(), map(x, y), draw() }:
   dots/marks are in CSS px inside the canvas, rect() is the canvas box on the page (for a core that keeps arrows clear of it). */
(() => {
  const G = window.G; if (!G) return;
  const host = document.getElementById('hudExtra') || document.getElementById('hud'); if (!host) return;
  const SZ = 92, PAD = 5, TAU = Math.PI * 2;
  const css = document.createElement('style');
  css.textContent = '#hgMini{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(84px + env(safe-area-inset-top));width:' + SZ + 'px;height:' + SZ + 'px;pointer-events:none;border-radius:10px;display:block}';
  document.head.appendChild(css);
  const cv = document.createElement('canvas'); cv.id = 'hgMini'; cv.setAttribute('aria-hidden', 'true'); host.appendChild(cv);
  const c = cv.getContext('2d');
  let dpr = 0;
  const fit = () => { const d = Math.min(3, Math.max(1, window.devicePixelRatio || 1)); if (d !== dpr) { dpr = d; cv.width = Math.round(SZ * d); cv.height = Math.round(SZ * d); } };
  fit(); window.addEventListener('resize', () => { fit(); draw(true); });

  const scale = () => (SZ - 2 * PAD) / (G.WORLD || 4000);
  const map = (x, y) => { const k = scale(); return { x: PAD + x * k, y: PAD + y * k }; };
  const dotR = carry => 2.2 + Math.min(4.6, Math.sqrt(Math.max(0, carry || 0)) * 0.3);
  const colOf = g => (G.GODS[g] && G.GODS[g].c) || '#c8cdd6';
  const viewK = me => { const base = Math.min(1.5, Math.max(0.65, Math.sqrt(G.W * G.H) / 680)) / (1 + (G.radius(me) - 17) / 140);
    try { return typeof G.mod === 'function' ? G.mod('view', me, base) : base; } catch (e) { return base; } };
  const panel = () => { const r = 9, w = SZ - 1, h = SZ - 1; c.beginPath(); c.moveTo(0.5 + r, 0.5); c.arcTo(0.5 + w, 0.5, 0.5 + w, 0.5 + h, r); c.arcTo(0.5 + w, 0.5 + h, 0.5, 0.5 + h, r);
    c.arcTo(0.5, 0.5 + h, 0.5, 0.5, r); c.arcTo(0.5, 0.5, 0.5 + w, 0.5, r); c.closePath(); c.fillStyle = 'rgba(7,12,22,.84)'; c.fill(); };

  const M = { el: cv, dots: [], marks: [], draws: 0, size: SZ, map, draw: () => draw(true), rect: () => cv.getBoundingClientRect() };
  let lastMs = -1e9;
  function draw(force) {
    const now = performance.now(); if (!force && now - lastMs < 95) return; lastMs = now;
    fit(); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, SZ, SZ);
    const dots = [], marks = []; M.dots = dots; M.marks = marks; M.draws++;
    const S = G.S; if (!S) return;
    panel();
    const k = scale(), W = G.WORLD || 4000, me = S.me, t = S.t;
    // the arena border
    c.strokeStyle = 'rgba(232,184,74,.6)'; c.lineWidth = 1; c.strokeRect(PAD + 0.5, PAD + 0.5, W * k - 1, W * k - 1);
    // what the screen shows
    const kv = viewK(me) || 1, hw = G.W / 2 / kv, hh = G.H / 2 / kv, cx = S.camX != null ? S.camX : me.x, cy = S.camY != null ? S.camY : me.y;
    const x0 = Math.max(0, cx - hw), x1 = Math.min(W, cx + hw), y0 = Math.max(0, cy - hh), y1 = Math.min(W, cy + hh);
    if (x1 > x0 && y1 > y0) { c.strokeStyle = 'rgba(255,255,255,.2)'; c.strokeRect(PAD + x0 * k, PAD + y0 * k, (x1 - x0) * k, (y1 - y0) * k); }
    // while you carry gold, a line to the nearest vault (the core's edge arrow can sit under this panel)
    const nv = me.carry > 0 && S.vaults.length ? G.nearestVault(me) : null;
    if (nv) { const a = map(me.x, me.y), b = map(nv.x, nv.y); c.strokeStyle = 'rgba(232,184,74,.5)'; c.lineWidth = 1; c.setLineDash([3, 2]); c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); c.setLineDash([]); }
    // vaults; the next spots (dashed) once announced
    for (const v of S.vaults) {
      const p = map(v.x, v.y), r = Math.max(3.5, v.r * k);
      if (v.nx != null) { const q = map(v.nx, v.ny), al = 0.55 + 0.35 * Math.sin(t * 8);
        c.strokeStyle = 'rgba(232,184,74,.28)'; c.lineWidth = 1; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke();
        c.strokeStyle = 'rgba(232,184,74,' + al.toFixed(2) + ')'; c.lineWidth = 1.3; c.setLineDash([2, 2]); c.beginPath(); c.arc(q.x, q.y, r, 0, TAU); c.stroke(); c.setLineDash([]);
        marks.push({ kind: 'next', x: q.x, y: q.y, r }); }
      c.fillStyle = 'rgba(232,184,74,' + (v === nv ? '.5' : '.3') + ')'; c.strokeStyle = '#e8b84a'; c.lineWidth = v === nv ? 2 : 1.4; c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill(); c.stroke();
      marks.push({ kind: 'vault', x: p.x, y: p.y, r, nearest: v === nv });
    }
    // the other heroes (a vanished one is hidden; his decoy shows as him), the heaviest first so a light dot stays on top
    const others = [];
    const seen = p => !(G.dayGod && typeof G.dayGod.visible === 'function') || G.dayGod.visible(p);   // Moon night: only what the hero's light shows
    for (const p of S.ps) if (p !== me && !(p.inv > t) && seen(p)) others.push({ name: p.name, god: p.god, x: p.x, y: p.y, carry: p.carry, decoy: false });
    for (const d of S.decoys || []) if (d.owner && d.owner !== me && seen(d)) others.push({ name: d.owner.name, god: d.owner.god, x: d.x, y: d.y, carry: d.carry, decoy: true });
    others.sort((a, b) => b.carry - a.carry);
    for (const o of others) { const p = map(o.x, o.y), r = dotR(o.carry), col = colOf(o.god);
      c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.7)'; c.lineWidth = 1; c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill(); c.stroke();
      dots.push({ name: o.name, god: o.god, x: p.x, y: p.y, r, c: col, me: false, decoy: o.decoy }); }
    // you: a white dot and a wedge for your facing
    { const p = map(me.x, me.y), r = Math.max(2.8, dotR(me.carry)), fl = Math.hypot(me.fx || 0, me.fy || 0) || 1, ux = (me.fx || 1) / fl, uy = (me.fy || 0) / fl;
      c.globalAlpha = me.inv > t ? 0.55 : 1;
      c.fillStyle = '#ffffff'; c.strokeStyle = 'rgba(0,0,0,.75)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(p.x + ux * (r + 5), p.y + uy * (r + 5)); c.lineTo(p.x - uy * r * 0.9, p.y + ux * r * 0.9); c.lineTo(p.x + uy * r * 0.9, p.y - ux * r * 0.9); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill(); c.stroke();
      c.globalAlpha = 1;
      dots.push({ name: me.name, god: me.god, x: p.x, y: p.y, r, c: '#ffffff', me: true, decoy: false, fx: ux, fy: uy }); }
  }
  G.on('start', () => { lastMs = -1e9; draw(true); });
  G.on('hud', () => draw(false));
  G.minimap = M;
})();

}catch(e){(window.G&&G.showErr?G.showErr:console.error)("module 70_minimap.js: "+(e&&e.message||e));}})();
</script>
