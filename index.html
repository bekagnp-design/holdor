<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HOLDOR: Hold the Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1b2d; --ink:#e9eef5; --muted:#93a4ba;
  --gold:#e3b661; --ice:#8fd3ff; --ember:#ff9a3c; --wild:#7cff6b; --blood:#e14b4b;
  --panel:#182a44; --panel2:#213756; --line:#2f4666; --house:#9fb4c8;
  --f-display:'Cinzel',"Times New Roman",serif; --f-body:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a1220;color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{position:relative;margin:0 auto;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--night)}
#hud{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.stat b{font-family:var(--f-display);font-size:15px;font-weight:700;white-space:nowrap}
.stat span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.gate{flex:1;display:flex;flex-direction:column;gap:3px;min-width:70px}
.gbar{height:9px;background:#101a2b;border-radius:5px;overflow:hidden;border:1px solid #2a3a52}
.gbar i{display:block;height:100%;width:100%;background:var(--ice);transition:width .15s}
.gate span{font-size:11px;color:var(--muted);text-align:center}
.ic{width:38px;height:38px;flex:0 0 38px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;font-family:var(--f-display);font-size:14px;font-weight:700;padding:0}
#bInfo{color:var(--gold);font-size:18px}
#stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;touch-action:none}
#bar{height:120px;flex:0 0 120px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;padding:6px 7px}
.brow{flex:1;min-height:0;display:flex;gap:6px}
.pw.lock{opacity:.42}
.pw .lk{position:absolute;top:3px;right:5px;font-size:10px}
.pw{position:relative;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:4px 2px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.pw .e{font-size:26px;line-height:1}
.pw .l{font-family:var(--f-display);font-size:9px;letter-spacing:.02em;white-space:nowrap}
.pw .cd{display:block;position:absolute;left:0;bottom:0;width:100%;height:100%;background:rgba(10,18,32,.78);transform-origin:bottom;pointer-events:none;transform:scaleY(0)}
.pw.armed{outline:2px solid var(--ember)}
.pw:disabled{color:var(--muted)}
#hCard{flex:1.55;border-color:var(--house)}
#hCard.sel{outline:2px solid var(--gold)}
#hCard .hp{display:block;width:86%;height:5px;background:#101a2b;border-radius:3px;overflow:hidden}
#hCard .hp i{display:block;height:100%;background:var(--house);width:100%}
#nextwave{flex:.9}
#nextwave small{font-size:10px;color:var(--gold)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 8px 12px;transform:translateY(100%);transition:transform .18s ease;z-index:5}
#sheet.open{transform:none}
#sheet h3{margin:0 0 6px;font-family:var(--f-display);font-size:14px;font-weight:700}
#sheet .sub{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.opt{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:6px 2px;text-align:center;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px}
.opt .e{font-size:24px;line-height:1}
.opt b{color:var(--gold);font-family:var(--f-display);font-size:11px}
.opt:disabled{opacity:.45}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 4px;font-size:13px;font-family:var(--f-body)}
#overlay{position:absolute;inset:0;background:rgba(6,11,20,.9);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
#overlay.hidden{display:none}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 14px;max-height:96%;overflow:auto}
.card h1{margin:0;font-family:var(--f-display);font-size:24px;font-weight:900;letter-spacing:.03em;line-height:1.1}
.card h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400;font-style:italic;margin-top:6px;letter-spacing:0;line-height:1.4}
.card h2{margin:14px 0 6px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.02em}
.card p{margin:8px 0 0;font-size:14px;line-height:1.45}
.card p.m{color:var(--muted)}
.big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:9px;background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:11px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.02em}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:500;letter-spacing:0}
.btn:disabled{opacity:.5}
.btn .e{font-size:20px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px;font-variant-numeric:tabular-nums}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500}
tr.me td{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .e{font-size:38px;line-height:1}
.tile b{font-family:var(--f-display);font-size:13px}
.tile small{font-size:11.5px;color:var(--muted);font-style:italic}
.tile.cur{outline:2px solid var(--gold)}
.champ{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:8px}
.champ.sel{outline:2px solid var(--gold)}
.champ.lock{opacity:.55}
.champ .av{font-size:34px;line-height:1;width:44px;text-align:center;flex:0 0 44px}
.champ .body{flex:1;min-width:0}
.champ .nm{font-family:var(--f-display);font-size:13.5px;font-weight:700}
.champ .ty{font-size:12px;color:var(--muted)}
.sk{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:4px}
.sk .pips{color:var(--gold);letter-spacing:1px;font-size:11px}
.sk button,.champ .lvl button{background:var(--panel);border:1px solid var(--line);color:var(--gold);border-radius:7px;padding:3px 7px;font-size:12px;font-family:var(--f-body)}
.sk button:disabled,.champ .lvl button:disabled{opacity:.4}
.champ .lvl{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:2px}
.champ .acts{display:flex;gap:6px;margin-top:6px}
.champ .acts button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px;font-size:12px;font-family:var(--f-body)}
.shop .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.shop .it small{display:block;color:var(--muted);font-size:11px}
.shop .it button{background:var(--panel2);border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:7px 10px;font-size:12.5px;white-space:nowrap;font-family:var(--f-body)}
.info h2{margin-top:12px}
.info .li{display:flex;gap:8px;font-size:13.5px;line-height:1.35;margin-top:5px}
.info .li .e{font-size:18px;flex:0 0 24px;text-align:center}
.map svg{width:100%;height:auto;display:block;border-radius:10px}
.lvbox{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.lvbox b{font-family:var(--f-display)}
.stars{color:var(--gold);letter-spacing:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar .back{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-family:var(--f-body);font-size:13px}
button{cursor:pointer;font-family:inherit}
button:focus-visible{outline:2px solid var(--ice);outline-offset:1px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}

.card.wide{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;padding:8px;display:flex;flex-direction:column;overflow:hidden}
.hubtop{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-bottom:6px;white-space:nowrap}
.hubtop b{color:var(--ink);font-family:var(--f-display);font-size:12px}
.hubtop .r{margin-left:auto;color:var(--gold);font-variant-numeric:tabular-nums}
.mapwrap{flex:1;min-height:0;overflow:auto;border:1px solid #7a6640;border-radius:10px;background:#c9b58a;-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block}
.hubbar{display:flex;gap:4px;margin-top:7px}
.hubbar button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:6px 1px;font-size:8.5px;font-family:var(--f-display);letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.hubbar button .e{font-size:18px;line-height:1}
.hubbar button:disabled{opacity:.4}
.hubbar button.hot{background:#3a2a12;border-color:var(--gold);color:var(--gold)}
.slot{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:9px;width:100%;text-align:left;color:var(--ink)}
.slot .sig{width:52px;flex:0 0 52px;height:58px;border-radius:8px 8px 26px 26px;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid var(--gold);background:#0f1728}
.slot .b{flex:1;min-width:0}
.slot .b .nm{font-family:var(--f-display);font-size:14px;font-weight:700}
.slot .b .ln{font-size:11.5px;color:var(--muted);margin-top:2px}
.slot .b .ln b{color:var(--gold)}
.slot.empty{justify-content:center;color:var(--muted);font-style:italic;border-style:dashed}
.ugrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.ug{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8px;line-height:1.05;text-align:center}
.ug .e{font-size:21px;line-height:1;filter:grayscale(1) opacity(.55)}
.ug .c{position:absolute;right:3px;bottom:2px;color:var(--gold);font-size:8.5px}
.ug.own{border-color:var(--gold);background:#2a2110}
.ug.own .e{filter:none}
.ug.own .c{color:var(--wild)}
.tabs{display:flex;gap:5px;margin:8px 0 2px}
.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 2px;font-size:12px;font-family:var(--f-display)}
.tabs button.on{background:var(--gold);color:#1a1405}
.ach{display:flex;gap:9px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:6px}
.ach.done{border-color:var(--gold)}
.ach .e{font-size:24px;filter:grayscale(1) opacity(.5)}
.ach.done .e{filter:none}
.ach .b{flex:1;min-width:0}
.ach .b b{font-family:var(--f-display);font-size:12.5px}
.ach .b small{display:block;color:var(--muted);font-size:11.5px}
.ach .g{color:var(--gold);font-size:12px;white-space:nowrap}
.scene{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:2px}
.scene svg{display:block;width:100%;height:auto}
.scene .ttl{position:absolute;left:0;right:0;top:12%;text-align:center}
.scene .ttl h1{font-size:38px;letter-spacing:.06em;text-shadow:0 3px 0 #0a1220,0 0 22px rgba(143,211,255,.45);color:#eaf4ff;margin:0}
.scene .ttl .rib{display:inline-block;margin-top:6px;background:#7a1d1d;border:1px solid #e3b661;color:#f6e3bb;font-family:var(--f-display);font-size:10.5px;letter-spacing:.22em;padding:3px 12px;border-radius:3px}
.rank{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.rank .f{font-size:19px}
.rank .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank.me{color:var(--gold)}
.diffgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.diffcard{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;color:var(--ink)}
.diffcard .lbl{font-family:var(--f-display);font-size:15px;font-weight:900;letter-spacing:.05em;color:var(--gold)}
.diffcard .nm2{font-family:var(--f-display);font-size:11px;color:var(--ink)}
.diffcard .sb{font-size:10.5px;color:var(--muted);line-height:1.2;font-style:italic}
.diffcard.cur{border-color:var(--gold)}
.diffcard.no{opacity:.45}
.diffcard .e{font-size:32px;line-height:1}
.diffcard b{font-family:var(--f-display);font-size:14px}
.diffcard small{display:block;color:var(--muted);font-size:11.5px}
.langgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.langgrid button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px 2px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.langgrid button .f{font-size:22px}
.langgrid button.cur{border-color:var(--gold)}

#hud.off,#bar.off{visibility:hidden}
.scene .ver{position:absolute;top:5px;right:8px;color:rgba(255,255,255,.75);font-size:9px;letter-spacing:.06em;font-family:var(--f-display)}
.crest{display:block}
.searchbox{width:100%;margin-top:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--f-body);font-size:14px}
.searchbox::placeholder{color:var(--muted)}
.langlist{max-height:46vh;overflow:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.langrow{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:5px;color:var(--ink);text-align:left}
.langrow .f{font-size:22px}
.langrow b{font-family:var(--f-display);font-size:13px}
.langrow small{display:block;color:var(--muted);font-size:11.5px}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.hcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 6px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.hcard b{font-family:var(--f-display);font-size:13px}
.hcard small{color:var(--muted);font-size:10.5px;font-style:italic;line-height:1.15}
.cine{position:absolute;inset:0;background:#070d16;display:flex;align-items:center;justify-content:center;z-index:20}
.cine .sk{position:absolute;right:10px;top:10px;background:rgba(20,30,46,.8);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-family:var(--f-display);font-size:12px;z-index:3}
.cine svg{width:100%;height:100%}
@keyframes flyIn{0%{transform:translate(-120%,-40%) rotate(-8deg);opacity:0}20%{opacity:1}100%{transform:translate(0,0) rotate(0)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes glowIn{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
.cine .raven{animation:flyIn 1.5s ease-out both}
.cine .l1{animation:fadeUp .7s ease-out .9s both}
.cine .l2{animation:fadeUp .7s ease-out 1.8s both}
.cine .l3{animation:glowIn .9s ease-out 2.7s both}
.cine .l4{animation:fadeUp .8s ease-out 3.6s both}

#overlay.full{padding:0}
.card.full{max-width:none;width:100%;height:100%;max-height:100%;border:0;border-radius:0;padding:0;background:#070d16;overflow:hidden}
.fs{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.fs .bg,.fs .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#070d16;z-index:0}
.fs.hasbg .bgimg{object-fit:cover;object-position:50% 6%;height:74%;top:0;bottom:auto}
.fs.hasbg .veil{background:linear-gradient(180deg,rgba(6,11,20,.28) 0%,rgba(6,11,20,0) 22%,rgba(6,11,20,0) 52%,rgba(6,11,20,.55) 68%,rgba(6,11,20,.97) 78%)}
.fs.hasbg #bStart{display:none}
.fs.hasbg .minirow{margin-top:0}
.fs.hasbg .taphint{display:block}
.taphint{display:none;text-align:center;color:rgba(242,230,201,.8);font-family:var(--f-display);font-size:9px;letter-spacing:.22em;margin-bottom:18px;animation:tp 1.9s ease-in-out infinite}
@keyframes tp{0%,100%{opacity:.35}50%{opacity:1}}
.fs .bg svg{width:100%;height:100%;display:block}
.fs .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,11,20,.55) 0%,rgba(6,11,20,.15) 32%,rgba(6,11,20,.72) 74%,rgba(6,11,20,.94) 100%)}
.fs .in{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:14px 13px 16px}
.fs .ver{position:absolute;top:8px;right:11px;z-index:3;color:rgba(255,255,255,.82);font-size:10px;letter-spacing:.08em;font-family:var(--f-display)}
.fs .art{position:absolute;top:6px;left:8px;z-index:3;background:rgba(10,18,32,.55);border:1px solid rgba(255,255,255,.18);color:#e9eef5;border-radius:8px;padding:4px 8px;font-size:11px}
.fs .x{position:absolute;top:6px;right:8px;z-index:3;background:rgba(10,18,32,.6);border:1px solid rgba(255,255,255,.2);color:#e9eef5;border-radius:9px;width:32px;height:32px;font-size:15px}
.fs h1{font-family:var(--f-display);font-size:27px;font-weight:900;letter-spacing:.05em;margin:0;text-shadow:0 3px 0 rgba(6,11,20,.9),0 0 20px rgba(143,211,255,.35)}
.fs .sub{margin:5px 0 0;font-size:13px;color:#c6d6e6;font-style:italic;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.fs .grow{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.fs .foot{padding-top:10px}
.title-mark{text-align:center;margin-top:6vh}
.title-mark h1{font-size:44px;letter-spacing:.08em}
.title-mark .rib{display:inline-block;margin-top:8px;background:rgba(122,29,29,.9);border:1px solid var(--gold);color:#f6e3bb;font-family:var(--f-display);font-size:11px;letter-spacing:.28em;padding:4px 14px;border-radius:3px}
.bignav{width:100%;background:linear-gradient(180deg,#e9c877,#c99b3f);color:#20180a;border:1px solid #f0dda6;border-radius:12px;padding:15px;font-family:var(--f-display);font-size:18px;font-weight:900;letter-spacing:.12em;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.minirow{display:flex;gap:7px;margin-top:9px}
.minirow button{flex:1;background:rgba(16,26,43,.72);border:1px solid rgba(255,255,255,.16);color:#dfe8f2;border-radius:10px;padding:9px 3px;font-size:11px;font-family:var(--f-display);letter-spacing:.03em}
.seat{display:flex;align-items:center;gap:11px;width:100%;background:linear-gradient(180deg,rgba(23,38,60,.92),rgba(14,24,40,.94));border:1px solid #46617f;border-radius:12px;padding:11px;margin-top:10px;color:var(--ink);text-align:left}

let ART={};
function loadArt(){try{const r=window.localStorage&&window.localStorage.getItem(AKEY);if(r)ART=JSON.parse(r)||{};}catch(e){ART={};}}
function saveArt(){try{if(window.localStorage)window.localStorage.setItem(AKEY,JSON.stringify(ART));}catch(e){}}
function bgOf(slot){
  const def=ART_EMBED[slot]||(ART_SLOTS.find(a=>a[0]===slot)||[])[2]||'';
  const src=ART[slot]||def;
  return src?`<img class="bgimg" src="${src}" alt="" onerror="this.style.display='none'" onload="this.parentNode.classList.add('hasbg')">`:'';
}
function pickArt(slot,after){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=1100,sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        try{ART[slot]=cv.toDataURL('image/jpeg',0.72);saveArt();}catch(e){}
        if(after)after();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  inp.click();
}
function showArt(back){
  show(`<div class="topbar"><h1>🖼️ Background art<small>Drop your own picture behind any screen. Stored in this browser only.</small></h1><button class="back" id="bBack">✖</button></div>
  <div class="artsheet">${ART_SLOTS.map(a=>`<div class="it"><div>${a[1]}<small style="display:block;color:var(--muted);font-size:11px">${ART[a[0]]?'custom image set':(ART_EMBED[a[0]]?'built-in image':'looks for '+a[2]+' next to this file')}</small></div><div style="display:flex;gap:6px"><button data-p="${a[0]}">Choose…</button>${ART[a[0]]?`<button data-c="${a[0]}">✖</button>`:''}</div></div>`).join('')}</div>
  <p class="m">A picture placed next to this HTML file with the listed name is used automatically.</p>`);
  $('#bBack').addEventListener('click',back);
  card.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>pickArt(b.dataset.p,()=>showArt(back))));
  card.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{delete ART[b.dataset.c];saveArt();showArt(back);}));
}

function distToPath(x,y,segs){let m=1e9;for(const s of segs){const vx=s.b.x-s.a.x,vy=s.b.y-s.a.y;const t=clamp(((x-s.a.x)*vx+(y-s.a.y)*vy)/(s.len*s.len),0,1);m=Math.min(m,dist(x,y,s.a.x+vx*t,s.a.y+vy*t));}return m;}

function genDaily(seed){

  const biomes=['snow','wall','forest','swamp','river','mountain','ash','city','sea'];
  return{pts,biome:biomes[Math.floor(rng()*biomes.length)],mod:MODS[MODL[Math.floor(rng()*MODL.length)]]};
}
function buildMap(o){

function levelPool(id,n){
  let p=[];for(let i=1;i<=(id||10);i++)if(POOLS[i])p=p.concat(POOLS[i]);
  p=p.filter(k=>!ENEMIES[k].mini&&!ENEMIES[k].boss);
  const cap=1.4+(n||1)*0.62;
  const f=p.filter(k=>ENEMIES[k].c<=cap);
  return f.length?f:p.filter(k=>ENEMIES[k].c<=1.6);
}
function buildWave(n,rng,o){
  const list=[];const pool=levelPool(o.id,n);
  let budget=6+n*2.5;
  let guard=0,charges=0,airs=0,heavy=0;
  while(budget>0&&guard++<200){
    const k=pool[Math.floor(rng()*pool.length)],E=ENEMIES[k];
    if(E.c>budget+1.5)continue;
    if(E.charge&&charges>=2)continue;
    if(E.air&&airs>=(E.pack||1)*2)continue;
    if(E.c>=5&&heavy>=3)continue;
    if(E.c>=5)heavy++;
    if(E.charge)charges++;
    if(E.air)airs+=(E.pack||1);
    const cnt=E.pack?E.pack:1;
    for(let i=0;i<cnt;i++)list.push(k);
    budget-=E.c*cnt;
  }
  for(let i=list.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  const minis=o.minis&&o.minis.length?o.minis:['giant'];
  const isKing=o.king&&n>0&&n%o.king===0;
  const isLord=!isKing&&o.lord&&n>=10&&n%10===0;
  const isDragon=!isKing&&!isLord&&o.dragon&&n%o.dragon===0;
  const isMini=!isKing&&!isLord&&!isDragon&&n>=6&&n%6===0;
  if(isKing)list.push('king');
  else if(isLord)list.push('lord');
  else if(isDragon)list.push('dragon');
  else if(isMini)list.push(minis[Math.floor(rng()*minis.length)]);
  if(isKing||isLord||isDragon){const keep=Math.floor(list.length*0.62);while(list.length>keep+1)list.splice(Math.floor(rng()*(list.length-1)),1);}
  return list;
}

    if(e.poison){dmg(e,e.poison.dps*dt,'poison');e.poison.t-=dt;if(e.poison.t<=0)e.poison=null;if(e.hp<=0)continue;}
    if(e.stunT>0){e.stunT-=dt;continue;}
    const spd=e.spdBase*(e.slowImmune?1:(e.boss?1-(1-e.slow)*0.5:e.slow))*(e.slowImmune?1:(e.boss?1-(1-slowG)*0.5:slowG))*(e.hasted||1);

      const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;e.ang=Math.atan2(dy,dx);
      if(d<160&&!e.hunt)G.brace=Math.max(G.brace,1);
      if(d<16){
        if(e.hunt&&e.tgt&&e.tgt.tower){e.tgt.tower.frozen=G.time+2.5;addFx({t:'ring',x:tx,y:ty,r0:4,r1:24,life:0.5,col:'#8fd3ff'});addText(tx,ty-24,'blinded','#8fd3ff');e.hp=-1;e.left=true;}
        else if(e.burst){hitDoor(e.burst);e.hp=-1;e.left=true;addFx({t:'fire',x:GX,y:GATE_Y,r0:10,r1:70,life:0.6,col:'#8ed2ee'});}
        else{e.atkT-=dt;if(e.atkT<=0){e.atkT=0.8;hitDoor((e.gateDps||e.dps)*0.8);}}
      }else{e.x+=dx/d*spd*dt;e.y+=dy/d*spd*dt;}
      continue;}
    const p=posE(e);const remain=map.total-e.prog;
    if(remain<150)G.brace=Math.max(G.brace,1);
    let blocker=null;
    if(alive&&h.type==='melee'&&!e.charge&&!e.air&&(!e.giant||h.taunts||oath)&&(h.eng<h.blocks||oath)&&dist(p.x,p.y,h.x,h.y)<=26+e.r){blocker=h;h.eng++;e.blockedBy='hero';}
    else if(!e.charge&&!e.air){for(const a of G.allies){if(a.eng<1&&dist(p.x,p.y,a.x,a.y)<=24+e.r){blocker=a;a.eng++;e.blockedBy='ally';break;}}}
    if(blocker){e.atkT-=dt;if(e.atkT<=0){e.atkT=0.7;
      if(blocker===h){hurtHero(e.dps*0.7);if(e.knock)h.invulnUntil=Math.max(h.invulnUntil,0);}
      else{blocker.hp-=e.dps*0.7;if(e.knock)blocker.stunT=1.5;}}}
    else if(e.ranged&&remain<=e.ranged){e.atkT-=dt;if(e.atkT<=0){e.atkT=0.8;hitDoor(e.dps*0.8);addFx({t:'arrow',x:p.x,y:p.y,tx:GX+(e.id%5-2)*8,ty:GATE_Y-4,life:0.3});}}
    else if(remain<=6){e.atkT-=dt;if(e.atkT<=0){e.atkT=0.7;hitDoor(e.dps*0.7);addFx({t:'hit',x:GX+(e.id%5-2)*9,y:GATE_Y-2,life:0.15});}}
    else{e.prog=Math.min(map.total-4,e.prog+spd*dt);e.walk=(e.walk||0)+spd*dt;}
  }
  for(const e of G.enemies){
    if(e.hp<=0)continue;

    if(e.healAura){e.hT=(e.hT==null?1:e.hT)-dt;if(e.hT<=0){e.hT=1;const q=posE(e);for(const o of G.enemies){if(o!==e&&o.hp>0&&o.hp<o.max&&!o.fly&&dist(posE(o).x,posE(o).y,q.x,q.y)<70)o.hp=Math.min(o.max,o.hp+e.healAura);}addFx({t:'ring',x:q.x,y:q.y,r0:60,r1:70,life:0.35,col:'#7cff6b'});}}
    if(e.speedAura){const q=posE(e);for(const o of G.enemies){if(o!==e&&o.hp>0&&!o.fly&&dist(posE(o).x,posE(o).y,q.x,q.y)<80)o.hasted=e.speedAura;}}
    if(e.web){e.wT=(e.wT==null?2:e.wT)-dt;if(e.wT<=0){e.wT=4;const q=posE(e);for(const x of map.slots)if(x.tower&&dist(x.x,x.y,q.x,q.y)<100)x.tower.webbed=G.time+4;}}
    if(e.spawn){e.sT=(e.sT==null?e.spawn[2]:e.sT)-dt;if(e.sT<=0){e.sT=e.spawn[2];for(let i=0;i<e.spawn[1];i++)spawn(e.spawn[0],e.prog-4-i*5);addText(posE(e).x,posE(e).y-24,'brood!','#7cff6b');}}
    if(e.raise){e.rT=(e.rT==null?e.raise:e.rT)-dt;if(e.rT<=0){e.rT=e.raise;const rec=G.deaths.filter(d=>G.time-d.t<14).slice(-2);for(const d of rec)spawn(d.type,e.prog-6-G.rng()*10);if(rec.length){const q=posE(e);addFx({t:'ring',x:q.x,y:q.y,r0:6,r1:50,life:0.6,col:'#66f0ff'});G.deaths=G.deaths.filter(d=>G.time-d.t>=14);}}}
    if(e.frz){
      e.frzT=(e.frzT==null?(e.king?7:e.lord?6:10):e.frzT)-dt;
      if(e.frzT<=0){
        e.frzT=e.king?9:e.lord?10:13;const q=posE(e);
        const cands=map.slots.filter(x=>x.tower&&!(x.tower.frozen>G.time)&&dist(x.x,x.y,q.x,q.y)<165).sort((a,b)=>dist(a.x,a.y,q.x,q.y)-dist(b.x,b.y,q.x,q.y));
        const cnt=e.king?3:e.lord?2:1,dur=e.king?5:e.lord?4:3;
        for(let i=0;i<Math.min(cnt,cands.length);i++){cands[i].tower.frozen=G.time+dur;addFx({t:'ring',x:cands[i].x,y:cands[i].y,r0:4,r1:28,life:0.5,col:'#8fd3ff'});}
        if(cands.length)addText(q.x,q.y-26,'❄ frozen','#8fd3ff');
      }
    }
    if(e.lord){
      e.raiseT=(e.raiseT==null?10:e.raiseT)-dt;
      if(e.raiseT<=0){e.raiseT=11;const rec=G.deaths.filter(d=>G.time-d.t<18).slice(-2);for(const d of rec)spawn(d.type,e.prog-8-G.rng()*14);
        if(rec.length){const q=posE(e);addFx({t:'ring',x:q.x,y:q.y,r0:6,r1:58,life:0.7,col:'#66f0ff'});addText(q.x,q.y-30,'the dead rise','#66f0ff');G.deaths=G.deaths.filter(d=>G.time-d.t>=18);}}
    }
  }
  for(const d of G.decals)d.life-=dt;G.decals=G.decals.filter(d=>d.life>0);
  if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null;}
  for(const tr of G.traps){const e=G.enemies.find(e=>e.hp>0&&!e.fly&&dist(posE(e).x,posE(e).y,tr.x,tr.y)<=22);if(e){tr.done=true;for(const o of G.enemies){if(o.hp<=0)continue;const q=posE(o);if(dist(q.x,q.y,tr.x,tr.y)<=55+o.r){dmg(o,tr.dmg,'hero');if(o.hp>0)o.burn={dps:15,t:3};}}addFx({t:'fire',x:tr.x,y:tr.y,r0:8,r1:55,life:0.6,col:'#7cff6b'});addFx({t:'ring',x:tr.x,y:tr.y,r0:8,r1:60,life:0.4,col:'#7cff6b'});}}
  G.traps=G.traps.filter(t=>!t.done);
  for(const cl of G.clouds){cl.t-=dt;for(const e of G.enemies){if(e.hp<=0||e.fly)continue;const q=posE(e);if(dist(q.x,q.y,cl.x,cl.y)<=60+e.r)dmg(e,cl.dps*dt,'hero');}}
  G.clouds=G.clouds.filter(c=>c.t>0);
  const king=G.enemies.find(e=>e.king&&e.hp>0);
  if(king){G.kingT-=dt;if(G.kingT<=0){G.kingT=12;const rec=G.deaths.filter(d=>G.time-d.t<20).slice(-4);for(const d of rec)spawn(d.type,king.prog-10-G.rng()*20);if(rec.length){const q=posE(king);addFx({t:'ring',x:q.x,y:q.y,r0:6,r1:70,life:0.8,col:'#66f0ff'});addText(q.x,q.y-24,'The dead rise','#66f0ff');}G.deaths=[];}}
  if(G.deaths.length>40)G.deaths=G.deaths.slice(-40);
  G.enemies=G.enemies.filter(e=>e.hp>0);
  G.allies=G.allies.filter(a=>a.hp>0&&a.t>0);
  for(const f of G.fx)f.life-=dt;G.fx=G.fx.filter(f=>f.life>0);
  for(const x of G.texts){x.life-=dt;x.y-=18*dt;}G.texts=G.texts.filter(x=>x.life>0);
  if(G.stressT>0){G.shoutT-=dt;if(G.shoutT<=0){G.shoutT=7;addText(GX,GATE_Y-44,'Hold the door!','#e3b661');}}
  if(G.gold>(G.maxGold||0))G.maxGold=G.gold;
  if(G.dragonFx>0)G.dragonFx-=dt;
}
function towerStats(t){
  const d=TOWERS[t.type],l=t.lvl,k=t.type;
  let range=(d.range+6*(l-1))*((G.mod&&G.mod.range)||1),dmg=d.dmg*Math.pow(1.38,l-1),rate=d.rate*Math.pow(1.06,l-1),dps=(d.dps||0)*Math.pow(1.38,l-1),burn=(d.burn||0)*Math.pow(1.3,l-1),splash=(d.splash||0)+3*(l-1),slow=d.slow!=null?d.slow-(d.kind==='aura'?0.04:0.03)*(l-1):1,mark=(d.mark||1)+0.05*(l-1);
  if(k==='watch'){if(UP('keen'))range*=1.12;if(UP('shafts'))dmg*=1.15;if(UP('draw'))rate*=1.12;if(UP('firearrow'))burn=8;}
  if(k==='scorp'){if(UP('bolts'))dmg*=1.18;if(UP('crew'))rate*=1.15;}
  if(k==='wild'){if(UP('blend'))splash*=1.25;if(UP('sticky'))burn*=1.6;}
  if(k==='glass'&&UP('sharper'))dps*=1.2;
  if(k==='weir'&&UP('roots')){slow-=0.08;range*=1.1;}
  if(k==='keep'){const b={count:d.count[l-1],shp:d.shp[l-1],sdmg:d.sdmg[l-1],resp:d.resp[l-1]};
    if(UP('sworn')){b.count=Math.min(5,b.count+1);}
    if(UP('training'))b.shp=Math.round(b.shp*1.18);
    return Object.assign({range,dmg,rate,dps,slow,mark,splash,burn},b);}
  return{range,dmg,rate,dps,slow,mark,splash,burn};}

function costOf(type){return Math.round(TOWERS[type].cost[0]*Math.pow(1.12,G.typeCount[type]||0));}
function upCost(t){return TOWERS[t.type].cost[t.lvl];}
function build(s,type){
  const c=costOf(type);if(s.tower||G.gold<c)return;
  G.gold-=c;s.tower={type,lvl:1,cd:0,invested:c,face:-Math.PI/2};noteTower(type,1);
  G.typeCount[type]=(G.typeCount[type]||0)+1;G.builds=(G.builds||0)+1;
  G.log.push({t:G.tick,a:'build',s:s.id,type});G.sel=null;G.pending=null;closeSheet();
  addFx({t:'ring',x:s.x,y:s.y,r0:6,r1:30,life:0.4,col:'#e3b661'});SFX.play('build');
  if(G.tut)tutEvent('build');
}
function openConfirm(s,type){
  const d=TOWERS[type],c=costOf(type),st={range:d.range,dmg:d.dmg,rate:d.rate,dps:d.dps,count:d.count?d.count[0]:0};
  G.pending={slot:s,type};
  const line=d.kind==='barracks'?`${st.count} men hold the road`:d.kind==='aura'?`slows everything nearby`:d.kind==='zone'?`${d.dps} damage per second in melee`:`${d.dmg} damage, ${d.rate.toFixed(2)}/s`;
  sheet.innerHTML=`<h3>${d.e} ${d.n}</h3><p class="sub">${d.sub}. ${line}${d.kind==='barracks'?'':' · range '+d.range}</p>
  <div class="row"><button id="cOk" style="flex:1.6;background:var(--gold);color:#1a1405;font-family:var(--f-display);font-weight:700" ${G.gold<c?'disabled':''}>✔ Build · ${c}g</button><button id="cNo">✖ Cancel</button></div>`;
  sheet.classList.add('open');
  $('#cOk').addEventListener('click',()=>build(s,type));
  $('#cNo').addEventListener('click',()=>{G.pending=null;G.sel=null;closeSheet();});
}
function openSheet(s){
  if(s.tower){const t=s.tower,def=TOWERS[t.type];const up=t.lvl<5?upCost(t):0;const sell=Math.round(t.invested*(UP('salvage')?0.9:0.6));const st=towerStats(t);
    const line=def.kind==='aura'?`Slow ${Math.round((1-st.slow)*100)}%, +${Math.round((st.mark-1)*100)}% damage taken`:def.kind==='zone'?`${Math.round(st.dps)} dmg/s, slow ${Math.round((1-st.slow)*100)}%`:def.kind==='barracks'?`${st.count} men · ${st.shp} hp · ${st.sdmg} dmg · back in ${st.resp}s`:`${Math.round(st.dmg)} dmg, ${st.rate.toFixed(2)}/s`;
    sheet.innerHTML=`<h3>${def.e} ${def.n} ${ROMAN[t.lvl-1]}</h3><p class="sub">${def.sub}. ${line}${def.kind==='barracks'?'':', range '+Math.round(st.range)}</p><div class="row">${def.kind==='barracks'?'<button id="sRally">🚩 Move banner</button>':''}${t.lvl>=5?`<button disabled>⭐ Max</button>`:t.lvl>=maxTowerLvl()?`<button disabled>🔒 ${ROMAN[t.lvl]} at gate ${LVL_GATES[t.lvl]}</button>`:`<button id="sUp" ${G.gold<up?'disabled':''}>⬆️ ${ROMAN[t.lvl]} · ${up}g</button>`}<button id="sSell">💸 +${sell}g</button><button id="sClose">✖</button></div>`;
    const rb=$('#sRally');if(rb)rb.addEventListener('click',()=>{G.armed='rally';G.rallySlot=s;G.heroSel=false;closeSheet();updateBar();});
    const u=$('#sUp');if(u)u.addEventListener('click',()=>{if(G.gold<up||t.lvl>=maxTowerLvl())return;G.gold-=up;t.lvl++;t.invested+=up;noteTower(t.type,t.lvl);G.log.push({t:G.tick,a:'up',s:s.id});addFx({t:'ring',x:s.x,y:s.y,r0:6,r1:34,life:0.4,col:'#e3b661'});SFX.play('upgrade');if(G.tut)tutEvent('upgrade');openSheet(s);});
    $('#sSell').addEventListener('click',()=>{G.gold+=sell;G.allies=G.allies.filter(a=>a.home!==s.id);G.typeCount[t.type]=Math.max(0,(G.typeCount[t.type]||1)-1);s.tower=null;G.log.push({t:G.tick,a:'sell',s:s.id});G.sel=null;closeSheet();});
    $('#sClose').addEventListener('click',()=>{G.sel=null;closeSheet();});
  }else{
    const avail=G.tut?['watch']:openTowers();
    sheet.innerHTML=`<h3>🏗️ Build</h3><div class="opts">${avail.map(k=>{const d=TOWERS[k],c=costOf(k);return`<button class="opt" data-t="${k}" ${G.gold<c?'disabled':''}><span class="e">${d.e}</span>${d.n.split(' ')[0]}<b>${c}g</b></button>`;}).join('')}</div><div class="row"><button id="sCancel">✖ Cancel</button></div>`;
    sheet.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>openConfirm(s,b.dataset.t)));
    $('#sCancel').addEventListener('click',()=>{G.sel=null;closeSheet();});
  }
  sheet.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');}
canvas.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  if(G.tut&&G.state==='play'){const r0=canvas.getBoundingClientRect(),sx=(ev.clientX-r0.left)/scale,sy=(ev.clientY-r0.top)/scale;if(sx>=W-80&&sx<=W-8&&sy>=H-94&&sy<=H-60){skipTutorial();return;}}
  if(G.tut&&G.tut.hold){tutNext();return;}
  if(G.state!=='play')return;
  const r=canvas.getBoundingClientRect();
  const w0=toWorld((ev.clientX-r.left)/scale,(ev.clientY-r.top)/scale);
  const x=w0.x,y=w0.y;
  const h=G.hero;
  const sm=spawnMark();
  if(sm&&canCall()&&dist(x,y,sm.x,sm.y)<32){callWave();return;}
  if(G.armed==='rally'){
    const s0=G.rallySlot;
    if(s0&&s0.tower){const dx=x-s0.x,dy=y-s0.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,150);
      s0.tower.rx=clamp(s0.x+dx/d*m,12,W-12);s0.tower.ry=clamp(s0.y+dy/d*m,46,GATE_Y-14);
      for(const a of G.allies)if(a.home===s0.id){a.rx=s0.tower.rx;a.ry=s0.tower.ry;}
      G.log.push({t:G.tick,a:'rally',s:s0.id,x:Math.round(s0.tower.rx),y:Math.round(s0.tower.ry)});
      addFx({t:'ring',x:s0.tower.rx,y:s0.tower.ry,r0:3,r1:22,life:0.4,col:'#e3b661'});}
    G.armed=null;G.rallySlot=null;updateBar();return;
  }
  if(G.armed){castPower(G.armed,x,y);G.armed=null;updateBar();if(G.tut)tutEvent('power');return;}
  if(G.heroSel&&G.heroOn&&!h.dead){h.tx=clamp(x,12,W-12);h.ty=clamp(y,40,470);G.heroSel=false;if(G.tut)tutEvent('move');G.log.push({t:G.tick,a:'move',x:Math.round(h.tx),y:Math.round(h.ty)});addFx({t:'ring',x:h.tx,y:h.ty,r0:3,r1:16,life:0.35,col:HOUSES[ACC.house].col});updateBar();return;}
  if(G.heroOn&&!h.dead&&dist(x,y,h.x,h.y-8)<=22){G.heroSel=true;G.sel=null;closeSheet();updateBar();return;}
  let hit=null;for(const s of G.map.slots){if(dist(s.x,s.y,x,y)<=24){hit=s;break;}}
  if(hit){G.sel=hit;openSheet(hit);}else{G.sel=null;closeSheet();}
});

function updateBar(){

  if(st.auto)setTimeout(()=>{if(G.tut&&TUT_STEPS[G.tut.i]===st)tutNext();},st.auto);

}

function smoothPath(dstr){const pts=dstr.replace(/[MLZ]/g,' ').trim().split(/\s+/).map(Number);const P=[];for(let i=0;i<pts.length;i+=2)P.push([pts[i],pts[i+1]]);const n=P.length;let s='';for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;if(!i){const z=P[n-1],m0x=(z[0]+a[0])/2,m0y=(z[1]+a[1])/2;s='M'+m0x+' '+m0y;}s+=' Q'+a[0]+' '+a[1]+' '+mx+' '+my;}return s+' Z';}
