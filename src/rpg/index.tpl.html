<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HOLDOR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#e3b661;--ok:#7fd06a;--bad:#e14b4b;--ink:#0b1220;--paper:#f2e6c9;--muted:#9fb6c9;--f-display:Cinzel,Georgia,serif;--f-body:"EB Garamond",Georgia,serif;--acc:#a9bdd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#060b14;color:#e9eef5;font-family:var(--f-body);overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
#screen{position:absolute;inset:0;display:none;background:rgba(6,11,20,.92);overflow:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#screen.on{display:block}
button{font-family:var(--f-display);font-weight:800;border:2px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);color:#e9eef5;min-height:44px;padding:0 14px;cursor:pointer}
button.pri{background:linear-gradient(180deg,#8be26a,#3f9a3a);border-color:#d8ffbf;color:#0b2a0a;font-size:18px;min-height:56px;width:100%;letter-spacing:.06em;box-shadow:0 8px 20px rgba(0,0,0,.45)}
button:disabled{filter:grayscale(1) brightness(.75)}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(6,11,20,.9);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;font:700 14px var(--f-display);color:#f3e7c4;pointer-events:none;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#err{position:absolute;left:8px;right:8px;bottom:8px;background:#5a1414;color:#fff;font:12px/1.3 monospace;padding:6px;border-radius:8px;display:none;z-index:99;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"><canvas id="gl"></canvas><canvas id="c"></canvas><div id="ui"></div><div id="screen"></div><div id="err"></div></div>
<script>
'use strict';
</script>
</body>
</html>
