<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HOLDOR</title>
<style>
:root{--gold:#e3b661;--ok:#7fd06a;--bad:#e14b4b;--ink:#0b1220;--paper:#f2e6c9;--muted:#9fb6c9;--f-display:Cinzel,Georgia,serif;--f-body:"EB Garamond",Georgia,serif;--acc:#a9bdd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#060b14;color:#e9eef5;font-family:var(--f-body);overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
#screen{position:absolute;inset:0;z-index:10;display:none;background:rgba(6,11,20,.92);overflow:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#screen.on{display:block}
button{font-family:var(--f-display);font-weight:800;border:2px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);color:#e9eef5;min-height:44px;padding:0 14px;cursor:pointer}
button.pri{background:linear-gradient(180deg,#d9b56a 0%,#a77b34 52%,#7a5420 100%);border-color:rgba(243,223,168,.75);color:#1c1207;font-size:18px;min-height:56px;width:100%;letter-spacing:.08em;text-shadow:0 1px 0 rgba(255,236,190,.45);box-shadow:inset 0 1px 0 rgba(255,240,200,.55),inset 0 -3px 8px rgba(40,22,4,.45),0 8px 22px rgba(0,0,0,.55)}
button:disabled{filter:grayscale(1) brightness(.75)}
.toast{position:absolute;z-index:60;left:50%;top:14%;transform:translateX(-50%);background:rgba(6,11,20,.9);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;font:700 14px var(--f-display);color:#f3e7c4;pointer-events:none;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
#boot{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 38%,#16233a 0%,#060b14 70%);transition:opacity .4s ease-out}
#boot h1{margin:0;font:900 44px/1 var(--f-display);letter-spacing:.14em;color:#f3e7c4;text-shadow:0 0 24px rgba(227,182,97,.35),0 3px 0 #000}
#boot p{margin:0;font:italic 17px var(--f-body);color:#9fb6c9;letter-spacing:.06em}
#boot .bar{width:170px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:18px}
#boot .bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,#e3b661,transparent);animation:bootbar 1.3s linear infinite}
#boot small{font:12px var(--f-display);color:rgba(233,238,245,.45);letter-spacing:.08em;min-height:15px}
@keyframes bootbar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
#err{position:absolute;left:8px;right:8px;bottom:8px;pointer-events:none;background:#5a1414;color:#fff;font:12px/1.3 monospace;padding:6px;border-radius:8px;display:none;z-index:99;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"><canvas id="gl"></canvas><canvas id="c"></canvas><div id="ui"></div><div id="screen"></div><div id="err"></div></div>
<div id="boot"><h1>HOLDOR</h1><p>Hold the door</p><div class="bar"><i></i></div><small id="bootTxt">The ravens are flying…</small></div>
<script>setTimeout(function(){var b=document.getElementById('boot'),t=document.getElementById('bootTxt');if(b&&t&&!(window.R&&window.R.boot)){t.textContent='The road is blocked. Close and open HOLDOR again.';}},15000);</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
</script>
</body>
</html>
