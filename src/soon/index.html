<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HOLDOR</title>
<style>
:root{--bg:#060b14;--ink:#f3e7c4;--muted:#8d9bb0;--gold:#e3b661}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#16233a 0%,var(--bg) 70%)}
h1{font:900 40px/1 Georgia,serif;letter-spacing:.14em;text-shadow:0 0 24px rgba(227,182,97,.35)}
p{font:italic 18px/1.4 Georgia,serif;color:var(--muted);max-width:320px}
i{display:block;width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
</style>
</head>
<body>
<h1>HOLDOR</h1>
<i></i>
<p>A new game is on its way.</p>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{var T=window.Telegram&&Telegram.WebApp;if(T){T.ready();T.expand();T.setHeaderColor&&T.setHeaderColor('#060b14');T.setBackgroundColor&&T.setBackgroundColor('#060b14');}}catch(e){}</script>
</body>
</html>
